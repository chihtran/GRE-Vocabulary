<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ascent — GRE vocabulary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E8E9E1; --paper2:#DEE0D6; --contour:#B4A98E; --contour2:#9C8E6E;
  --ink:#252A26; --ink2:#5A6259; --route:#3A6480; --route-l:#6F97AE;
  --learn:#C08A3E; --solid:#4E7346; --weak:#A8453A;
  --rule:#C8C9BD;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){@media (prefers-color-scheme:dark){
  --paper:#161A19; --paper2:#1E2422; --contour:#3A4440; --contour2:#4E5A54;
  --ink:#E4E7E0; --ink2:#9AA49B; --route:#7FAAC6; --route-l:#4A6C82;
  --learn:#D6A055; --solid:#6E9A63; --weak:#C4655A; --rule:#2C3330;
}}
:root[data-theme="dark"]{
  --paper:#161A19; --paper2:#1E2422; --contour:#3A4440; --contour2:#4E5A54;
  --ink:#E4E7E0; --ink2:#9AA49B; --route:#7FAAC6; --route-l:#4A6C82;
  --learn:#D6A055; --solid:#6E9A63; --weak:#C4655A; --rule:#2C3330;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"Source Serif 4",Georgia,serif;font-size:17px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.lab{font-family:"Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.02em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--route);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* shell */
.wrap{max-width:860px;margin:0 auto;padding:0 18px 90px}
header.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);
  border-bottom:1px solid var(--rule);margin:0 -18px 22px;padding:14px 18px 11px;
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
}
.brand{font-family:"Barlow Condensed",sans-serif;font-size:27px;font-weight:600;line-height:1}
.alt{font-family:"Barlow Condensed",sans-serif;font-size:15px;color:var(--ink2);margin-left:auto}
.alt b{color:var(--ink);font-weight:600}

/* profile */
.profile{position:relative;margin:4px 0 26px}
.profile svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-family:"Barlow Condensed",sans-serif;font-size:14px;color:var(--ink2);margin-top:2px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:baseline}

/* stations */
.bands{display:flex;flex-direction:column;gap:2px}
.bandhead{font-family:"Barlow Condensed",sans-serif;font-size:14px;color:var(--contour2);
  border-bottom:1px solid var(--rule);padding:16px 0 4px;margin-bottom:6px}
.st{
  display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;
  width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);
  padding:11px 2px;
}
.st:hover .sn{color:var(--route)}
.sn{font-family:"Barlow Condensed",sans-serif;font-size:19px;color:var(--contour2);font-variant-numeric:tabular-nums}
.stt{font-family:"Barlow Condensed",sans-serif;font-size:18px;line-height:1.15}
.sax{font-size:13.5px;color:var(--ink2);line-height:1.35;margin-top:1px}
.meter{width:96px}
.meter .bar{height:5px;background:var(--paper2);border-radius:3px;overflow:hidden;display:flex}
.meter .bar span{display:block;height:100%}
.meter .cap{font-family:"Barlow Condensed",sans-serif;font-size:12.5px;color:var(--ink2);text-align:right;margin-top:3px;font-variant-numeric:tabular-nums}
.locked .stt,.locked .sn{color:var(--contour)}

/* cluster */
.back{font-family:"Barlow Condensed",sans-serif;background:none;border:0;padding:6px 0;color:var(--route);font-size:16px}
h2.ct{font-family:"Barlow Condensed",sans-serif;font-size:31px;font-weight:600;margin:6px 0 2px;line-height:1.05}
.cax{color:var(--ink2);font-size:15px;margin:0 0 18px;max-width:62ch}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.btn{font-family:"Barlow Condensed",sans-serif;font-size:17px;padding:9px 20px;border:1px solid var(--ink);
  background:none;border-radius:2px}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.wlist{border-top:1px solid var(--rule)}
.wrow{display:grid;grid-template-columns:10px 1fr;gap:12px;padding:10px 2px;border-bottom:1px solid var(--rule);align-items:baseline}
.dot{width:9px;height:9px;border-radius:50%;background:var(--paper2);margin-top:7px}
.wd{font-family:"Barlow Condensed",sans-serif;font-size:19px}
.wdef{font-size:15px;color:var(--ink2);margin-top:1px}
.wnote{font-size:13.5px;color:var(--contour2);margin-top:3px}

/* card */
.card{border:1px solid var(--rule);background:var(--paper2);border-radius:3px;padding:30px 24px;min-height:230px;
  display:flex;flex-direction:column;justify-content:center;text-align:center;margin-bottom:16px}
.cw{font-family:"Barlow Condensed",sans-serif;font-size:42px;line-height:1.05}
.cd{font-size:19px;margin-top:14px;max-width:46ch;margin-left:auto;margin-right:auto}
.cn{font-size:14.5px;color:var(--ink2);margin-top:12px;max-width:50ch;margin-left:auto;margin-right:auto}
.hint{font-family:"Barlow Condensed",sans-serif;color:var(--ink2);font-size:15px}
.prog{font-family:"Barlow Condensed",sans-serif;font-size:14px;color:var(--ink2);margin-bottom:10px;font-variant-numeric:tabular-nums}

/* quiz */
.qp{font-size:19px;margin:6px 0 18px;max-width:58ch}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.opt{font-family:"Barlow Condensed",sans-serif;font-size:19px;text-align:left;padding:12px 15px;
  border:1px solid var(--rule);background:var(--paper2);border-radius:2px}
.opt:hover:not(:disabled){border-color:var(--route)}
.opt.right{border-color:var(--solid);background:color-mix(in srgb,var(--solid) 12%,var(--paper2))}
.opt.wrong{border-color:var(--weak);background:color-mix(in srgb,var(--weak) 12%,var(--paper2))}
.fb{border-left:3px solid var(--route);padding:2px 0 2px 14px;font-size:15.5px;color:var(--ink2);margin-bottom:16px}
.fb b{color:var(--ink);font-family:"Barlow Condensed",sans-serif;font-size:18px}
.why{border-top:1px solid var(--rule);padding-top:10px;margin-bottom:16px}
.whyh{display:block;color:var(--contour2);font-size:14px;margin-bottom:6px}
.wl{font-size:14.5px;color:var(--ink2);margin-bottom:4px}
.wl b{font-family:"Barlow Condensed",sans-serif;font-size:17px;color:var(--ink);margin-right:6px}
.opt.picked{border-color:var(--route);background:color-mix(in srgb,var(--route) 10%,var(--paper2))}
.blank{border-bottom:1.5px solid var(--route);padding:0 2px;color:var(--route)}
.blab{color:var(--contour2);font-size:14px;margin:12px 0 5px}

.empty{color:var(--ink2);padding:26px 0;max-width:56ch}
footer{border-top:1px solid var(--rule);margin-top:34px;padding-top:12px;
  font-family:"Barlow Condensed",sans-serif;font-size:14px;color:var(--contour2);
  display:flex;gap:16px;flex-wrap:wrap}
footer button{background:none;border:0;color:var(--contour2);padding:0;text-decoration:underline}
@media(max-width:560px){
  .cw{font-size:34px}.meter{width:72px}h2.ct{font-size:26px}
  .st{grid-template-columns:28px 1fr auto;gap:9px}
}
</style>
</head>

</footer>
</div>

ated, pompous in speech","From bombast, cotton padding used to stuff clothing. The image is padding"],["bravado","a show of boldness meant to impress","The boldness is display, not courage — that is the whole word"],["bromide","a trite, soothing remark","Originally a sedative — a phrase administered to calm rather than inform"],["cant","insincere pious or moralistic talk; also, jargon of a group","Two live senses. Also a trap word — see cluster 47"],["derivative","unoriginal, copied from elsewhere","TRAP: the everyday maths sense is irrelevant. This is a criticism"],["doggerel","crude, badly made verse","The verse-specific word"],["egoism","the doctrine or habit of self-interest","Note: egoism ≠ egotism. Egoism is philosophical; egotism is talking about yourself"],["egotistical","excessively self-referential","The everyday one"],["fatuous","silly and self-satisfied","Foolishness plus complacency — that combination is the word"],["flamboyant","showy, extravagant","From flame — flame-shaped"],["florid","ornate, elaborately decorated","flos, flower. Also means flushed red in the face"],["fulsome","excessive to the point of insincerity","TRAP: does not mean \"full\" or \"generous.\" Fulsome praise is praise that has become unpleasant"],["gloat","to dwell on your own success or another's failure","The satisfaction in another's loss is the distinguishing part"],["grandiloquent","using lofty, extravagant language","grand + loqui, to speak"],["hackneyed","worn out by overuse","From hackney, a horse hired out until exhausted"],["haughty","arrogantly superior","From haut, high"],["homily","a moralizing lecture; a sermon","Not necessarily hollow, but usually used dismissively"],["humdrum","monotonous, dull",""],["insipid","dull, without flavour or interest","Literally tasteless — in- + sapidus, flavourful"],["megalomania","delusion of one's own power or greatness","The extreme end"],["monotonous","unvarying, tediously uniform","mono + tonos, one tone"],["mundane","ordinary, of ],["ambiguous","open to more than one interpretation","May or may not be deliberate — the one word here that can be innocent"],["arcane","mysterious, known to few","arca, a chest — knowledge kept in a box"],["articulate","(adj) expressing oneself clearly · (v) to express","Dual part of speech, and the verb also means to connect at a joint"],["befuddled","confused, muddled",""],["byzantine","excessively complicated, especially of systems","From the administration of the Byzantine empire. Usually of bureaucracy"],["circuitous","indirect, roundabout","The route rather than the knot"],["coherent","logically connected, holding together","co- + haerere, to stick. Not the same as clear: a coherent argument can be hard"],["confound","to confuse or bewilder; also, to defeat expectations","Two senses. Confound the sceptics = prove them wrong"],["conundrum","a confusing problem or riddle","The problem"],["convoluted","excessively complex and twisted","con- + volvere, to roll up"],["decipher","to work out the meaning of something obscure or coded","The verb of getting out"],["delineate","to describe or outline precisely","de- + linea, line. The image is drawing an outline"],["digression","a wandering away from the subject","A departure, not a confusion"],["disjointed","lacking connection between its parts","The exact opposite of coherent"],["elucidate","to make clear, throw light on","e- + lux. The active verb of clarifying"],["elusive","difficult to catch, grasp, or define","Can apply to concepts as well as people"],["enigmatic","puzzling, mysterious","From enigma"],["enunciate","to pronounce clearly; to state a principle formally","Two senses, both about making something distinct"],["equivocate","to use ambiguous language to avoid commitment","equi- + vocare, equal voices. The point is avoiding commitment, not confusion"],["esoteric","understood only by a small initiated group","The difficulty is specialist knowledge"],["evasive","avoiding a direct answer",""],["explicable","able to be explained","Note inexplicable is the commoner form"],["explicate","to explain in detail, unfold","ex- + plicare, to unfold. More systematic than elucidate"],["fathom","to understand after effort","cannot fathom. Originally a measure of depth"],["flummoxed","completely baffled","Informal register"],["impenetrable","impossible to understand or get into",""],["indeterminate","not fixed or settled","Of a value or outcome, not a person"],["inscrutable","impossible to interpret or read","Usually of faces and intentions, not texts"],["intelligible","able to be understood","Weaker than lucid — it means merely possible to understand"],["limn","to depict or describe","Rare and literary. Same family as illuminate"],["lucid","clear and easy to follow","lux, light. Also means mentally sound — a lucid interval"],["nonplussed","so surprised as to be at a loss","TRAP: it does not mean unbothered. American usage has drifted, but the GRE uses the original: at a loss for how to react"],["obfuscate","to deliberately make unclear","ob- + fuscus, dark. The clearest case of intent"],["opaque","not transparent; impossible to see through","The physical metaphor for obscurity"],["quandary","a state of uncertainty about what to do","The state you are in — a quandary is about a decision, a conundrum about a puzzle"],["recondite","deep and obscure","The difficulty is depth. Near-twin of abstruse"],["tortuous","full of twists and turns","TRAP: ≠ torturous, which means painful. A tortuous argument winds; a torturous one hurts"]]},{"n":9,"t":"Calm → unfeeling → torpid","a":"Declining responsiveness to stimulus. Very high SE frequency","w":[["abeyance","temporary suspension","A noun and a state. Held in abeyance — of rules, claims, activity"],["aloof","distant, uninvolved","Physical or social distance"],["apathy","absence of interest or concern","a- + pathos, without feeling"],["aplomb","self-confident composure under pressure","handled the interruption with aplomb"],["blasé","unimpressed through overfamiliarity","The cause is having seen it before"],["callous","insensitive to others' suffering","The moral word here — hardened, from callus"],["cavalier","offhand, dismissive of things that deserve care","Negative. a cavalier attitude to safety"],["complacent","smugly satisfied, unaware of deficiency","TRAP: ≠ complaisant from cluster 02. Complacent is about yourself; complaisant is about pleasing others"],["dawdle","to move or act slowly, wasting time","The verb"],["dilatory","tending to delay","Of a person or a process. dilatory tactics"],["distrait","distracted, inattentive","French. Attention is elsewhere, not absent"],["dormant","temporarily inactive, sleeping","dormire, to sleep. A dormant volcano is not extinct"],["ennui","listless boredom arising from lack of interest","French. Boredom with a philosophical flavour"],["equable","even-tempered, not given to swings","Describes the disposition. Also used of climate"],["equanimity","evenness of mind under strain","aequus + animus, level mind. The noun everyone should know"],["halcyon","calm and peaceful","Almost always of a past time — halcyon days. From the kingfisher"],["impassive","showing no emotion","About the surface. An impassive face may conceal a great deal"],["imperturbable","not capable of being upset","in- + perturbare. The strongest of these"],["indolent","habitually lazy","The moral version. Indolence is a fault; lassitude is a condition"],["inert","without power to move or act","Chemically or physically incapable, not merely resting"],["insensible","unaware, unresponsive","TRAP: ≠ insensitive. Insensible of the danger means unaware of it"],["insouciant","free from concern, carefree","Lighter than nonchalant, and often approving"],["inured","accustomed to something unpleasant","inured to hardship. Reached by exposure, not by nature"],["languid","slow, relaxed, lacking vigour","Can be almost positive — languid elegance"],["lassitude","weariness, lack of energy","Physical or mental fatigue"],["lethargic","sluggish, lacking energy",""],["lull","a temporary pause in activity","a lull in the fighting"],["nonchalant","casually unconcerned","Neutral or mildly positive — coolness"],["oblivious","unaware","Of surroundings or of facts"],["passive","accepting without resisting",""],["phlegmatic","unemotional, hard to excite","From the humour phlegm. Closer to a temperament than a moment"],["placid","calm, untroubled","Can tip slightly negative — placid implies nothing is happening"],["poise","composed self-assurance","Includes bearing, not just calm"],["quiescent","at rest, inactive","The medical and technical word for the same"],["serene","calm and untroubled, with an air of dignity",""],["sluggish","slow-moving, unresponsive",""],["somnolent","drowsy, sleepy","Describes the person — the mirror of soporific"],["soporific","causing sleep or drowsiness","Direction of fit: describes the thing, not the person. A soporific lecture"],["stoic","enduring hardship without complaint","The endurance is the point. From the philosophical school"],["stolid","showing no emotion or interest; dull","Impassive plus the suggestion of dullness"],["stupefy","to make someone unable to think clearly","The verb of producing the state"],["subdued","quiet and restrained, often after something","Implies a previous state that was livelier"],["supine","lying face up; failing to act through weakness","The second sense is the tested one — a supine legislature is one that will not resist"],["tepid","lukewarm; unenthusiastic","a tepid response"],["torpor","a state of physical or mental inactivity","The noun for the condition. Also used of hibernating animals"],["tranquil","peaceful, quiet","Usually of places and conditions"],["weary","tired, worn out",""]]},{"n":10,"t":"Obstinacy and dogmatism","a":"Refusal to yield, plus the ideological version: doctrinaire, ideologue, zealot","w":[["acolyte","a devoted follower or assistant","Originally an altar attendant. Implies subordination and learning"],["adamant","refusing to be persuaded","From adamas, the hardest substance — the root of diamond. The mildest here, and closest to neutral: being adamant can be admirable"],["apologist","someone who defends a position or institution","TRAP: nothing to do with apologising. An apologist makes the case for something, usually something unpopular"],["contumacious","stubbornly disobedient to authority","Legal register — contempt of court is contumacious conduct"],["disciple","a follower of a teacher or doctrine","discere, to learn. Neutral to positive"],["doctrinaire","applying a theory rigidly without regard to circumstances","About applying a theory regardless of whether it fits. Stronger and more specific than dogmatic"],["dogmatic","asserting opinions as if they were certainties","About the manner of holding beliefs"],["froward","difficult to deal with, contrary","Archaic. The opposite of toward — turned away"],["headstrong","determined to have one's own way","Suggests youth, and not having thought it through"],["hidebound","unwilling to change because bound by convention","The image is dried leather, too stiff to flex. The rigidity is habitual, not commanded"],["ideologue","someone driven by an ideology rather than by evidence","The person"],["imperious","arrogantly commanding, expecting obedience","From imperium, command. Watch: ≠ imperial (of an empire) and ≠ imperative (urgently necessary)"],["implacable","impossible to appease or placate","in- + placare. Note what it is not: not merely stubborn, but unable to be calmed — of hostility, opposition, an enemy"],["intractable","not easily controlled or solved","Also used of problems, not just people — an intractable dispute"],["intransigence","refusal to compromise","The noun"],["intransigent","refusing to compromise","The negotiation word"],["magisterial","authoritative, in a manner that brooks no question","Two faces: it can praise (a magisterial study) or criticize (a magisterial manner). Context decides"],["martinet","someone who demands rigid adherence to rules","A noun, and a person. From Jean Martinet, a French drillmaster"],["obdurate","stubbornly refusing to change","ob- + durus, hard. Negative, and often about refusing to feel pity"],["obstinate","stubborn, especially unreasonably","The plain word"],["ossify","to become rigid and fixed, to stop developing","os, bone — literally to turn to bone. A verb, and used of institutions"],["partisan","can be neutral — a supporter, not necessarily a bigot",""],["peremptory","allowing no refusal or discussion","a peremptory dismissal. The tone that closes off reply"],["recalcitrant","resisting authority or control","re- + calcitrare, to kick back. The image is a mule"],["refractory","stubbornly resistant to control or treatment","Near-twin of recalcitrant. Also technical: a refractory material resists heat"],["wayward","wilful and unpredictable, straying from what is expected","Adds unpredictability: a wayward child wanders rather than defies"],["willful","deliberately doing what one wants despite instruction","The deliberateness is the point. Also spelled wilful"],["zealot","a fanatical adherent","Originally a Jewish sect resisting Rome. Implies action, not just belief"]]},{"n":11,"t":"Reckless ↔ brave ↔ hesitant ↔ cowardly","a":"A four-position scale, not a synonym pile","w":[["ambivalence","the noun",""],["ambivalent","pulled both ways — not uncertain, not indifferent",""],["apprehension","anxiety about a future event","Also means understanding — apprehension of the facts. Two senses"],["assertive","confident in stating one's position","The mildest, and about speech rather than danger"],["audacious","daring, often to the point of impudence","Two faces: an audacious plan can be admiring; audacious behaviour is not"],["brazen","shameless, boldly defiant of propriety","From brass — brass-faced. The shamelessness is the point, not the courage"],["craven","contemptibly cowardly","Strong condemnation"],["daunt","to make someone lose courage","undaunted is the commoner form"],["daunting","intimidating, discouraging","Describes the task"],["demur","to raise an objection; to hesitate","Mild — a demurral is a polite objection, not a refusal"],["diffidence","the noun",""],["diffident","lacking self-confidence, modest to a fault","TRAP: ≠ indifferent. Diffidence is shyness, not disinterest"],["disconcerting","unsettling, throwing one off balance","Describes the thing; compare discomfit from cluster 08"],["effrontery","insolent boldness; shameless nerve","The noun for brazen behaviour. had the effrontery to ask"],["flustered","agitated and unable to collect oneself","Composure lost under pressure, not fear of danger"],["foolhardy","recklessly bold without regard to danger","The judgment failure is explicit in the word"],["fraught","filled with something undesirable; tense","fraught with danger, or simply a fraught meeting. Not itself a fear word — it describes a situation charged with it"],["fret","to worry persistently about small things","The verb"],["impetuous","acting suddenly on impulse","The speed is the fault"],["impulsive","acting without forethought","Plainer than impetuous"],["intrepid","fearless and enduring","in- + trepidus, not trembling. Built on trepidation, negated"],["irresolute","unable to decide",""],["mettle","spirit and resilience under test","prove your mettle. Not metal — though the words share an origin"],["mettlesome","spirited, courageous","The adjective"],["perturb","to make anxious or unsettled","The verb of doing it to someone"],["plucky","brave in a determined way, especially against odds","Implies the underdog — plucky is never used of the strong"],["precipitate (adj)","done with excessive haste","a precipitate decision"],["precipitous","dangerously steep","Constantly swapped with the above"],["pusillanimous","cowardly, lacking courage","pusillus + animus, a small spirit. The literary word"],["quail","to lose courage and shrink back","Careful: this one faces the al","warm and friendly","Can be formal — cordial relations between states"],["droll","amusing in an odd or understated way","The oddness is the point, not the volume of the joke"],["ebullient","overflowing with enthusiasm","e- + bullire, to boil over"],["effervescence","bubbling liveliness","The noun. Same image as fizzing water"],["euphoria","intense happiness or elation","Stronger than cheerfulness; often temporary"],["exhilarating","making one feel very happy and animated","Describes the thing, not the person"],["facetious","treating serious matters with inappropriate humour","Negative. The inappropriateness is built in"],["felicitous","well chosen, apt; also happy","Two senses, and the tested one is \"apt\" — a felicitous phrase is a well-judged one"],["fervent","showing intense feeling","The common adjective"],["fervid","intensely enthusiastic","Slightly stronger than fervent, and can tip into overheated"],["fervor","great warmth and intensity of feeling","Near-twin of ardor. Root fervere, to boil"],["gambol","to run or skip about playfully","Physical. The image is a lamb"],["geniality","friendliness and cheerfulness of manner","The noun"],["gratify","to give pleasure or satisfaction","gratified by the response"],["gregarious","sociable, fond of company","From grex, a flock — the same root as congregate and segregate"],["heady","exhilarating; intoxicating","Describes the experience, not the person — a heady atmosphere"],["jocose","playful, given to joking","Neutral to positive"],["jocund","cheerful and light-hearted","Literary register"],["levity","lack of seriousness, lightness of manner","Often a mild criticism — levity at the wrong moment. Opposite of gravity"],["panache","flamboyant confidence of style","French. Originally a plume on a helmet"],["regale","to entertain, especially with talk","regaled us with stories. Also means to feast someone"],["sanguine","optimistic, confident about the future","From the humour blood. Not the same as cheerful — sanguine santhropic","hating humankind","The adjective"],["misogynist","one who hates women","miso-, hate, same prefix"],["morose","sullen and ill-humoured","The plain word. Gloom with a closed door"],["nostalgia","sentimental longing for the past","The object is always the past"],["obsequy","a funeral rite","Usually plural, obsequies. Not obsequious, which means fawning"],["plaintive","sounding sad and mournful","Describes a sound — a plaintive cry, a plaintive melody"],["poignant","evoking a keen sense of sadness, and moving","A compliment when applied to art. From pungere, to prick"],["rue","(v) to regret bitterly","rue the day. Also a bitter herb"],["sardonic","mocking in a bitter, scornful way","The mockery is the point. From Sardinia, via a plant said to cause a rictus grin"],["saturnine","gloomy and taciturn by temperament","From the planet Saturn. A disposition, not a mood"],["sentimental","appealing to shallow emotion","The one negative here. It means the feeling is unearned"],["wistful","yearning with gentle sadness","Longing for something out of reach, and the longing is sweet"],["woeful","full of sorrow; also lamentably bad","Second sense is common: a woeful performance means very poor"]]},{"n":14,"t":"Soothing and relieving","a":"Largest synonym chain in the list: allay = assuage = mitigate = mollify = placate","w":[["allay","to diminish or put to rest","Takes fears and doubts as well as pain. allay concerns"],["alleviate","to make suffering less severe","levis, light — to lighten. The plainest of these"],["ameliorate","to make a bad situation better","melior, better. Improves the situation, not just the feeling"],["analgesic","(n/adj) a painkiller","Specifically pain"],["anodyne","inoffensive to the point of saying nothing",""],["appease","to pacify by giving in to demands","Carries the concession. Historically loaded — appeasement"],["assuage","to make an unpleasant feeling less intense","Also means to satisfy — assuage hunger. Two uses"],["beneficence","active kindness; doing good","bene + facere. The noun"],["benign","gentle and kindly; also harmless","Two senses: a benign smile, a benign tumour"],["boon","a thing that is helpful and beneficial","A noun. a boon to farmers"],["cathartic","providing emotional release","From Greek katharsis, purging"],["coddle","to treat with excessive care","Negative. Over-protection"],["commiserate","to express sympathy with someone","Does not fix anything — it is shared feeling, not intervention"],["conciliatory","intended to overcome hostility","An adjective, describing a gesture or tone"],["convalescent","recovering from illness","Describes the person recovering, not the remedy"],["detente","an easing of hostility between states","French. Diplomatic register, usually of nations"],["emollient","(n/adj) softening; a skin-softening substance","Figuratively, an emollient remark softens a dispute"],["innocuous","harmless, causing no offence","in- + nocere, not to harm. About the absence of harm, not the presence of kindness"],["magnanimity","generosity of spirit, especially toward a rival","magnus + animus, great soul. Implies you could have been harsh and were not"],["mediate","to intervene between parties to produce agreement","The third party is the point"],["mollify","to soften someone's anger","mollis, soft. Emphasises softening"],["pacify","to bring peace to a person or a region","Two scales: you can pacify a child or a province"],["placate","to make someone less angry","The plain word"],["propitiate","to win favour from someone offended, especially a deity","Implies an offering. More formal than the rest"],["reconcile","to restore friendly relations; also to make consistent","Two live senses — reconcile two people, or reconcile two accounts"],["remedial","intended to correct a deficiency","remedial classes. Fixing a shortfall"],["salubrious","health-giving","Usually of air, climate, surroundings"],["salutary","producing a beneficial effect, often through being unpleasant","The twist: a salutary lesson is a useful one you did not enjoy"],["solicitous","showing attentive concern","Can tip negative — solicitous to the point of fussing"],["succor","(n/v) help given in time of distress","Old-fashioned register. came to their succor"]]},{"n":15,"t":"Greed ↔ thrift ↔ waste ↔ poverty","a":"Four poles. Prodigal and profligate mean wasteful, not merely wandering","w":[["acquisitive","keen to acquire things","Mildest here, and can be neutral — an acquisitive museum"],["affluent","wealthy","Neutral"],["avarice","extreme greed for wealth","The noun, and the strongest"],["avaricious","greedy for money","The adjective"],["covet","to yearn to possess something belonging to another","The object belongs to someone else — that is the whole word"],["covetous","eagerly desirous of what another has",""],["exorbitant","unreasonably high, of a price","ex orbita, off the track"],["exploitative","taking unfair advantage","Broader than money — labour, resources, people"],["extravagant","spending much more than needed","Also means exceeding reasonable bounds generally"],["frugality","economy in spending","Positive or neutral. A virtue"],["gouge","to overcharge grossly","The verb for doing it to customers"],["impecunious","having little money","im- + pecunia, money. Mildest — short of cash rather than destitute"],["indigence","poverty, need","Formal register. the indigent = the poor"],["lavish","(adj) very generous or extravagant; (v) to give in abundance","Can be a compliment — lavish praise, a lavish production"],["lucrative","producing a great deal of profit","Neutral to positive — a lucrative contract"],["lucre","money, especially when regarded as sordid","Negative, and almost always in filthy lucre"],["mercenary","motivated solely by money","Also a noun: a soldier for hire"],["miserly","hoarding money, unwilling to spend any","Strongly negative"],["opportunistic","exploiting chances without regard to principle","About timing rather than money specifically"],["parsimonious","unwilling to spend; extremely sparing","Negative. Stinginess dressed as economy"],["penurious","mean with money; also extremely poor","Two senses, and they conflict. See below"],["penury","extreme poverty","The noun. Unlike penurious, it means only poverty"],["prodigal","recklessly wasteful","Not \"wandering.\" The prodigal son was wasteful, not lost. It also has a second sense: lavishly abundant"],["profligate","wasteful, and often dissolute","Adds moral looseness to the waste"],["rapacious","aggressively grasping","rapere, to seize. Implies predation, not just desire"],["remuneration","payment for work or services","Formal and neutral. Note the spelling — not renumeration"],["spendthrift","(n) one who spends wastefully","A person, where the others are adjectives or verbs"],["squander","to spend or use wastefully","The verb"],["stinting","restricting supply; sparing","Usually in the negative: without stinting means generously"],["usury","lending at unreasonably high interest","Historically a crime; now the term for predatory lending"],["venal","open to bribery; corruptible","Not venial, which means a forgivable sin. A venal official takes money"]]},{"n":16,"t":"Deceit ↔ honesty","a":"Largest cluster after TRAP. Artless/ingenuous mean naive, not clumsy","w":[["artful","clever at attaining an end, often by deceit","TRAP: the opposite of artless. Artful = crafty; artless = innocent"],["artless","without guile; natural and sincere","TRAP: does not mean clumsy. The opposite of artful"],["beguile","to charm in a way that may deceive","Can be almost positive — beguiling is attractive"],["bogus","not genuine","Informal"],["candid","truthful and straightforward","Positive"],["chicanery","the use of trickery, especially legal or political","The noun for the whole practice"],["collude","to cooperate secretly for a deceitful purpose","Requires two or more parties"],["concoct","to devise or invent, often a story","Same root as cooking something up"],["conspire","to plan together secretly to do something wrong",""],["counterfeit","a forged imitation","Physical objects — currency, goods"],["cozen","to trick or deceive","Archaic, literary"],["crafty","cunning, skilled at deceiving","Plain word"],["cunning","skilled at achieving ends by deceit",""],["delusion","a false belief held despite evidence","The victim's state, not the deceiver's product"],["devious","showing a skilful use of underhand tactics","de- + via, off the road"],["disingenuous","insincere; feigning ignorance or innocence","The negative of ingenuous — it fakes the innocence"],["dissemble","to conceal one's true motives or feelings","Hiding what is there"],["distort","to misrepresent",""],["dupe","(n) one easily deceived; (v) to deceive","Both parts of speech"],["duplicitous","deceitful; saying one thing and doing another","duplex, twofold — two faces"],["fabricate","to invent, especially falsely",""],["fallacious","based on a mistaken belief; logically unsound","The logic is faulty"],["feign","to pretend; to simulate","Displaying what is not there. The mirror of dissemble"],["feint","a deceptive movement, especially in combat","From fencing. A mock attack"],["fidelity","faithfulness; also accuracy of reproduction","Two senses"],["frank","open and honest in speech","Can be blunt"],["guileless","innocent, without cunning",""],["gullible","easily deceived","The adjective for the disposition"],["hypocrite","one who professes beliefs they do not hold","The gap is between stated and actual conviction"],["illusory","based on illusion; not real","The appearance was never real"],["implausible","not believable","Note the difference from specious: implausible fails on sight; specious passes"],["ingenuous","innocent and unsuspecting","TRAP: not ingenious, which means clever"],["insidious","proceeding harmfully in a gradual, concealed way","The stealth and the gradualness are the point. Often of diseases and influences"],["intrigue","(n) secret plotting; (v) to plot, or to fascinate","Two verb senses — the fascination sense is unrelated to deceit"],["inveigle","to persuade by deception or flattery","Takes into — inveigle someone into doing something"],["machiavellian","cunning and unscrupulous in politics","From Machiavelli. Political register"],["machinations","scheming plots","Usually plural, and sinister"],["malinger","to feign illness to avoid work","Very specific, and it comes up"],["mendacious","lying, habitually dishonest","About a person or statement, and it means actually untrue"],["mendacity","untruthfulness","The noun"],["naive","lacking experience or judgment","Not a moral fault; just untested"],["perfidious","deliberately faithless, treacherous","Betrayal of trust is the specific element"],["perfidy","treachery; deliberate breach of faith","The noun of perfidious"],["phony","not genuine","Informal"],["ploy","a cunning manoeuvre to gain advantage","More strategic than a ruse"],["poseur","one who pretends to be what they are not","The deceiver, not the victim — listed here because it is the flip side"],["prevaricate","to speak evasively; to avoid the truth","Not quite lying — it is dodging"],["probity","complete honesty and integrity","Formal and strong. The noun for incorruptibility"],["ruse","a trick intended to deceive",""],["sham","a thing that is not what it purports to be","Also an adjective"],["skullduggery","underhand behaviour","Informal, faintly comic"],["specious","superficially plausible but actually wrong","Learn this one cold. A specious argument survives a glance and not scrutiny"],["spurious","not genuine; false","Of claims, correlations, documents"],["swindle","to cheat out of money","Money specifically"],["unfeigned","genuine, not pretended","The negative of feign"],["unscrupulous","having no moral principles","About the absence of restraint, not skill at deceiving"],["veracious","speaking truthfully","Not voracious, which means ravenously hungry"],["veracity","conformity to truth; truthfulness","Of statements and people"],["wily","full of guile and tricks",""]]},{"n":17,"t":"Abundance ↔ scarcity","a":"Includes the variety sub-axis: multifarious, motley, eclectic","w":[["abound","to exist in large numbers","The verb, intransitive: errors abound"],["all-ecompassing","",""],["burgeon","to begin to grow rapidly; to flourish","burgeon is to bud. Implies a beginning"],["burgeoning","growing rapidly","The adjective"],["copious","abundant, plentiful","The plain word. copious notes"],["cornucopia","an abundant supply of good things","From the horn of plenty. Always positive"],["dearth","a scarcity or lack","The standard antonym of plethora"],["diminutive","very small","Often of people, and can be affectionate"],["dispense","to distribute; also to administer","TRAP: dispense with means to do without, which is nearly the opposite"],["disperse","to scatter in different directions","Physical scattering, and it implies the group breaks up"],["disseminate","to spread widely, especially information","semen, seed — scattering seeds. Ideas and information"],["eclectic","drawing from a wide range of sources","Positive or neutral, and it implies deliberate selection"],["fecund","highly fertile, producing abundantly","Biological or creative"],["fruitful","producing good results","About outcome, not quantity"],["hodgepodge","a confused mixture","Negative. Disorder is the point"],["inundate","to flood; to overwhelm with a quantity","unda, wave. The recipient is overwhelmed"],["lilliputian","tiny","From Swift's Lilliput. Can imply pettiness as well as smallness"],["minuscule","extremely small","Note the spelling — from minus, not mini"],["minutia","a trivial detail","Usually plural, minutiae. It means small in importance, not small in number"],["miscellany","a collection of varied items","The noun for the collection"],["modicum","a small quantity of something desirable","a modicum of sense. Always of something you would want more of"],["motley","made up of varied and often incongruous parts","Imp fit."},{"k":"tc","n":5,"t":"The lecture did something unusual. It opened by (i)___ a principle most of the audience had never heard stated aloud, then spent an hour showing how it would (ii)___ the disciplinary boundaries the department had spent decades defending — all without once (iii)___ the evidence, which the speaker laid out fully enough for his critics to use against him.","o":[["enunciating","attenuating","rescinding"],["transcend","reinforce","delineate"],["distorting","citing","withholding"]],"a":[0,0,0],"e":"enunciate in its second sense: to state a principle formally. transcend — going beyond a boundary. distorting — laying out evidence fully is the opposite of distorting it."},{"k":"tc","n":6,"t":"He was the most (i)___ man in the department and the least effective. Every proposal met the same treatment: a list of small objections, none fatal, delivered in a tone so (ii)___ that colleagues stopped bringing him drafts — which left him free to complain, ever more (iii)___, that nobody consulted him.","o":[["captious","mettlesome","phlegmatic"],["magisterial","tentative","conciliatory"],["obstreperous","reticent","sanguine"]],"a":[0,0,0],"e":"captious — disposed to raise trivial objections. magisterial — authoritative in a way that brooks no question; this is the word's negative face, though it can also be a compliment. obstreperous — complaint that grows louder."},{"k":"se","n":7,"t":"Twenty years of unbroken success had left the firm in a state of ___ from which no quarterly warning could rouse it.","o":[["torpor","lassitude","ferment","turmoil","vigilance","disarray"]],"a":[0,1],"e":"torpor and lassitude both name inactivity and drained energy. ferment, turmoil, disarray are the reverse; vigilance is alertness."},{"k":"se","n":8,"t":"The charge was never substantiated, and the biography treats it as the ___ it plainly was.","o":[["calumny","slander","grievance","stricture","concession","oversight"]],"a":[0,1],"e":"calumny and slander both assert a damaging falsehood, which 'never substantiated' requires. grievance may be legitimate; stricture is a criticism that could be true."},{"k":"se","n":9,"t":"He would ___ for an hour about matters he had not troubled to study, and nobody had the heart to stop him.","o":[["prate","prattle","expatiate","equivocate","demur","recapitulate"]],"a":[0,1],"e":"prate and prattle both mean talking on foolishly. expatiate is neutral and implies he had studied the subject, which the sentence denies."},{"k":"se","n":10,"t":"Her replies were ___ to the point of rudeness: four words where a sentence was expected.","o":[["laconic","terse","prolix","verbose","evasive","tortuous"]],"a":[0,1],"e":"laconic and terse both mean using very few words. prolix and verbose are the reverse pair. evasive is about dodging; tortuous about twisting."},{"k":"se","n":11,"t":"The archive holds ___ documentation of the period — far more, in fact, than any historian has yet worked through.","o":[["copious","profuse","scant","sparse","fragmentary","contested"]],"a":[0,1],"e":"copious and profuse both mean abundant. scant, sparse, fragmentary run the other way."},{"k":"se","n":12,"t":"What the field suffers from is not a ___ of theory but an absence of anyone willing to test it.","o":[["dearth","paucity","plethora","welter","surplus","rejection"]],"a":[0,1],"e":"dearth and paucity both mean a shortage. plethora, welter and surplus are the reverse — note three of them, which is itself the signal."},{"k":"se","n":13,"t":"Nothing the chairman said could ___ the shareholders, who had come intending to be angry and left more so.","o":[["placate","mollify","provoke","inflame","address","reimburse"]],"a":[0,1],"e":"placate and mollify both mean calming an angry person — the object here is people, not a condition. provoke and inflame are the reverse."},{"k":"se","n":14,"t":"He wrote the novel in conditions of near ___, pawning the furniture chapter by chapter.","o":[["penury","indigence","affluence","seclusion","obscur <script>
const DATA = JSON.parse(document.getElementById('DATA').textContent);
const VERBAL = JSON.parse(document.getElementById('VERBAL').textContent);
const CLUSTER_OF = {}; DATA.forEach(c=>c.w.forEach(x=>CLUSTER_OF[x[0]]=c.n));
// pairs that sit in different clusters but are still confusable — never offered together
const CONFUSABLE = {
  insensible:['oblivious'], oblivious:['insensible'],
  specious:['implausible','spurious'], spurious:['specious'],
  mitigate:['militate'], placate:['assuage','mollify'], assuage:['placate','mollify','alleviate'],
  mollify:['placate','assuage'], alleviate:['assuage','allay','ameliorate'], allay:['alleviate','assuage'],
  prodigal:['profligate'], profligate:['prodigal'],
  laconic:['terse','taciturn'], terse:['laconic'], taciturn:['reticent','laconic'], reticent:['taciturn'],
  ardor:['fervor'], fervor:['ardor'], ardent:['fervent'], fervent:['ardent'],
  castigate:['chastise'], chastise:['castigate'], fulminate:['inveigh'], inveigh:['fulminate'],
  penury:['indigence'], indigence:['penury'], dearth:['paucity'], paucity:['dearth'],
  copious:['profuse'], profuse:['copious'], torpor:['lassitude'], lassitude:['torpor'],
  calumny:['slander'], slander:['calumny'], prate:['prattle'], prattle:['prate'],
  candid:['frank'], frank:['candid'], guileless:['artless','ingenuous'], artless:['guileless'],
  ingenuous:['guileless'], obdurate:['adamant','obstinate'], obstinate:['obdurate'],
  recalcitrant:['refractory'], refractory:['recalcitrant'], captious:['carping'], carping:['captious'],
  vapid:['insipid'], insipid:['vapid'], turgid:['tumid'], tumid:['turgid'],
  bolster:['buttress'], buttress:['bolster'], abstruse:['recondite'], recondite:['abstruse'],
  garrulous:['loquacious'], loquacious:['garrulous'], verbose:['prolix'], prolix:['verbose']
};
const app = document.getElementById('app');

/* ================= scheduler =================
   Simplified DSR model, after FSRS: each word carries
   S  stability  — days until recall probability falls to ~90%
   D  difficulty — 1 easy .. 10 hard, moves with your answers
   L  lapses     — times you have forgotten it after learning it
   Target retention 0.90. Interval = S.                            */
const DAY = 864e5, now = () => Date.now();
let P = {};                                   // word -> {S,D,L,t}
const rec = w => P[w] || null;

function grade(w, ok){
  const r = rec(w);
  if (!r){ P[w] = { S: ok ? 1 : 0.4, D: ok ? 5 : 6.5, L: 0, t: now() }; }
  else if (ok){
    const growth = 1.25 + (10 - r.D) * 0.13;   // easier words stretch further
    r.S = Math.min(400, Math.max(1, r.S * growth));
    r.D = Math.max(1, r.D - 0.18);
    r.t = now();
  } else {
    r.S = Math.max(0.35, r.S * 0.28);          // forgetting collapses stability
    r.D = Math.min(10, r.D + 1.3);
    r.L = (r.L||0) + 1;
    r.t = now();
  }
  dirty = true; queueSave();
}
const dueAt = r => r.t + r.S * DAY;
const isDue = w => { const r = rec(w); return r ? dueAt(r) <= now() : false; };

/* four states, as requested */
const NEW='new', SHAKY='shaky', LEARNING='learning', KNOWN='known';
function state(w){
  const r = rec(w);
  if (!r) return NEW;
  if ((r.L||0) >= 3 || r.D >= 7.5) return SHAKY;      // học rồi nhưng quên nhiều
  if (r.S >= 21 && (r.L||0) <= 1)  return KNOWN;      // học rồi và nhớ
  return LEARNING;                                     // học rồi quên ít
}
const LABEL = {new:'Not started', shaky:'Forgetting often', learning:'Coming along', known:'Holding'};
const COLOUR = {new:'var(--paper2)', shaky:'var(--weak)', learning:'var(--learn)', known:'var(--solid)'};

/* ================= storage =================
   Standalone build: progress lives in this browser via localStorage,
   with manual export/import so you can move it between devices.     */
const LSKEY = 'ascent-progress-v2';
let saveTimer=null, dirty=false;
function queueSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(save,600); }
function save(){
  if(!dirty) return;
  try{ localStorage.setItem(LSKEY, JSON.stringify({p:P, at:now(), v:2})); dirty=false; setSync(); }
  catch(e){ setSync('Browser storage is full or blocked — export your progress'); }
}
function load(){
  try{
    const raw = localStorage.getItem(LSKEY);
    if(!raw){ setSync(); return; }
    const d = JSON.parse(raw);
    if(d && d.p){
      if(d.v===2) P=d.p;
      else Object.entries(d.p).forEach(([w,o])=>{
        const b=o.b||0; if(!b) return;
        P[w]={S:[0,1,2,4,9,21][b]||1, D:6-b*0.6, L:0, t:now()-1};
      });
    }
  }catch(e){ setSync('Saved progress could not be read'); }
  setSync(); render();
}
function setSync(msg){
  const n = Object.keys(P).length;
  document.getElementById('sync').textContent =
    msg || (n ? `${n} words tracked in this browser` : 'Progress saves in this browser');
}
function exportProgress(){
  const blob = new Blob([JSON.stringify({p:P, at:now(), v:2}, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ascent-progress-' + new Date().toISOString().slice(0,10) + '.json';
  a.click(); URL.revokeObjectURL(a.href);
}
function importProgress(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const d = JSON.parse(fr.result);
      if(!d || !d.p) throw 0;
      P = d.p; dirty = true; save(); render();
    }catch(e){ setSync('That file was not a progress export'); }
  };
  fr.readAsText(file);
}

/* ================= data helpers ================= */
const ALL = DATA.flatMap(c => c.w.map(x => ({w:x[0], d:x[1], n:x[2], c:c.n})));
const TAUGHT = ALL.filter(x => x.d);
function tally(list){
  const t={new:0,shaky:0,learning:0,known:0};
  list.forEach(x=>t[state(x.w)]++); return t;
}
function clusterStats(c){
  const open = c.w.filter(x=>x[1]).map(x=>({w:x[0]}));
  return {...tally(open), t:open.length, n:c.w.length};
}
/* review queue: interleaved across clusters, shaky words first */
function queue(limit){
  const due = TAUGHT.filter(x=>isDue(x.w));
  const rank = x => state(x.w)===SHAKY ? 0 : 1;
  due.sort((a,b)=> rank(a)-rank(b) || dueAt(rec(a.w))-dueAt(rec(b.w)));
  const out = interleave(due);
  return limit ? out.slice(0,limit) : out;
}
function interleave(list){                     // avoid two words from one cluster in a row
  const byC = {}; list.forEach(x => (byC[x.c] ||= []).push(x));
  const keys = Object.keys(byC); const out=[];
  while(out.length < list.length){
    let placed=false;
    for(const k of keys){ if(byC[k].length){ out.push(byC[k].shift()); placed=true; } }
    if(!placed) break;
  }
  return out;
}

const GROUPS = [[1,8,'Speech — praise, attack, style'],[9,13,'Temperament'],[14,16,'Kindness, money, honesty'],
 [17,20,'Quantity and intensity'],[21,24,'Time and change'],[25,28,'Knowledge and reasoning'],
 [29,32,'Politics, law, society'],[33,35,'Discipline and vice'],[36,42,'Sensory and cultural'],
 [43,46,'Abstract verbs'],[47,47,'Trap words'],[50,56,'Skill, virtue, certainty']];

/* ================= views ================= */
let view = {name:'route'};
function render(){
  const t = tally(TAUGHT);
  document.getElementById('alt').innerHTML =
    `<b>${t.known}</b> holding · <b>${t.learning}</b> coming along · <b>${t.shaky}</b> forgetting often · ${t.new} not started`;
  ({route:routeView, cluster:clusterView, study:studyView, quiz:quizView, review:reviewView, shaky:shakyView, verbal:verbalView})[view.name]();
  window.scrollTo({top:0});
}

function routeView(){
  const t = tally(TAUGHT), q = queue().length;
  let h = profileSVG();
  h += `<div class="legend lab">
    <span><i style="background:var(--solid)"></i>holding — ${t.known}</span>
    <span><i style="background:var(--learn)"></i>coming along — ${t.learning}</span>
    <span><i style="background:var(--weak)"></i>forgetting often — ${t.shaky}</span>
    <span><i style="background:var(--paper2);border:1px solid var(--contour)"></i>not started — ${t.new}</span>
  </div>`;
  h += `<div class="acts" style="margin-top:22px">
    <button class="btn pri" id="revBtn" ${q?'':'disabled'}>Review ${q} due</button>
    <button class="btn" id="shkBtn" ${t.shaky?'':'disabled'}>Drill ${t.shaky} weak</button>
    <button class="btn" id="vbBtn">GRE questions (${VERBAL.length})</button>
  </div>`;
  h += '<div class="bands">';
  GROUPS.forEach(([a,b,label])=>{
    const cs = DATA.filter(c=>c.n>=a&&c.n<=b); if(!cs.length) return;
    h += `<div class="bandhead lab">${label}</div>`;
    cs.forEach(c=>{
      const s=clusterStats(c), open=s.t>0, pct=x=> s.t ? x/s.t*100 : 0;
      h += `<button class="st ${open?'':'locked'}" data-c="${c.n}" ${open?'':'disabled'}>
        <span class="sn">${String(c.n).padStart(2,'0')}</span>
        <span><span class="stt">${c.t}</span><span class="sax">${c.a||''}</span></span>
        <span class="meter"><span class="bar">
          <span style="width:${pct(s.known)}%;background:var(--solid)"></span>
          <span style="width:${pct(s.learning)}%;background:var(--learn)"></span>
          <span style="width:${pct(s.shaky)}%;background:var(--weak)"></span>
        </span><span class="cap">${open? s.known+'/'+s.t : s.n+' soon'}</span></span>
      </button>`;
    });
  });
  h+='</div>';
  app.innerHTML=h;
  const rb=document.getElementById('revBtn'); if(rb) rb.onclick=()=>{view={name:'review'};render();};
  const sb=document.getElementById('shkBtn'); if(sb) sb.onclick=()=>{view={name:'shaky'};render();};
  document.getElementById('vbBtn').onclick=()=>{view={name:'verbal',i:0,sel:[],done:false,score:0};render();};
  app.querySelectorAll('.st[data-c]').forEach(b=>b.onclick=()=>{view={name:'cluster',c:+b.dataset.c};render();});
}

function profileSVG(){
  const W=860,H=150,pad=6;
  const pts = DATA.map((c,i)=>{
    const s=clusterStats(c), frac = s.t ? s.known/s.t : 0;
    return [pad+i*(W-2*pad)/(DATA.length-1), H-18-frac*(H-40), s.t>0];
  });
  const line = pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const area = line+` L${pts[pts.length-1][0].toFixed(1)},${H-18} L${pts[0][0].toFixed(1)},${H-18} Z`;
  let contours='';
  for(let i=1;i<=4;i++){const y=H-18-i*(H-40)/4;
    contours+=`<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="var(--contour)" stroke-width=".7" stroke-dasharray="1 5"/>`;}
  const dots = pts.filter(p=>p[2]).map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.4" fill="var(--route)"/>`).join('');
  return `<div class="profile"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Your progress across 49 clusters, drawn as an elevation profile">
    ${contours}<path d="${area}" fill="var(--route)" opacity=".13"/>
    <path d="${line}" fill="none" stroke="var(--route)" stroke-width="1.6" stroke-linejoin="round"/>${dots}
    <line x1="${pad}" y1="${H-18}" x2="${W-pad}" y2="${H-18}" stroke="var(--contour2)" stroke-width="1"/></svg></div>`;
}

function clusterView(){
  const c=DATA.find(x=>x.n===view.c), s=clusterStats(c);
  let h=`<button class="back lab" id="bk">← Route</button>
    <h2 class="ct">${String(c.n).padStart(2,'0')} · ${c.t}</h2>
    <p class="cax">${c.a||''}</p>
    <div class="acts">
      <button class="btn pri" id="sBtn">Study ${s.t} cards</button>
      <button class="btn" id="qBtn">Quiz</button>
      <button class="btn" id="pBtn">Recall test</button>
    </div><div class="wlist">`;
  c.w.forEach(x=>{
    const st = x[1] ? state(x[0]) : NEW, r = rec(x[0]);
    const when = r ? ' · ' + (isDue(x[0]) ? 'due now' : 'in ' + Math.max(1,Math.round((dueAt(r)-now())/DAY)) + 'd') : '';
    h+=`<div class="wrow">
      <span class="dot" style="background:${x[1]?COLOUR[st]:'transparent'};${x[1]?'':'border:1px solid var(--contour)'}"></span>
      <span><span class="wd">${x[0]}</span>
        ${x[1]?`<span class="wdef">${x[1]}</span>`:'<span class="wdef">definition arrives with this cluster\u2019s lesson</span>'}
        ${x[2]?`<span class="wnote">${x[2]}</span>`:''}
        ${x[1]?`<span class="wnote">${LABEL[st]}${when}</span>`:''}</span>
    </div>`;
  });
  h+='</div>';
  app.innerHTML=h;
  document.getElementById('bk').onclick=()=>{view={name:'route'};render();};
  const deck=()=>shuffle(c.w.filter(x=>x[1]));
  document.getElementById('sBtn').onclick=()=>{view={name:'study',c:c.n,i:0,flipped:false,deck:deck()};render();};
  document.getElementById('qBtn').onclick=()=>{view={name:'quiz',c:c.n,i:0,deck:deck(),score:0,picked:null};render();};
  document.getElementById('pBtn').onclick=()=>{view={name:'study',c:c.n,i:0,flipped:false,produce:true,deck:deck()};render();};
}

function studyView(){
  const v=view,d=v.deck;
  if(v.i>=d.length) return doneScreen('Cards done', v.c);
  const x=d[v.i];
  let h=`<button class="back lab" id="bk">← Cluster</button>
    <div class="prog">${v.i+1} of ${d.length}${v.produce?' · recall the word':''}</div><div class="card" id="card">`;
  if(v.produce){
    h += v.flipped ? `<div class="cw">${x[0]}</div>${x[2]?`<div class="cn">${x[2]}</div>`:''}`
                   : `<div class="cd">${x[1]}</div><div class="hint" style="margin-top:18px">Say the word aloud, then check</div>`;
  } else {
    h += v.flipped ? `<div class="cd">${x[1]}</div>${x[2]?`<div class="cn">${x[2]}</div>`:''}`
                   : `<div class="cw">${x[0]}</div><div class="hint" style="margin-top:16px">Tap to see the meaning</div>`;
  }
  h+=`</div>`;
  h+= v.flipped
    ? `<div class="acts"><button class="btn" id="again">Missed it</button><button class="btn pri" id="got">Got it</button></div>`
    : `<div class="acts"><button class="btn" id="flip">Check</button></div>`;
  app.innerHTML=h;
  document.getElementById('bk').onclick=()=>{view={name:'cluster',c:v.c};render();};
  const flip=()=>{v.flipped=true;render();};
  document.getElementById('card').onclick=()=>{if(!v.flipped)flip();};
  if(!v.flipped) document.getElementById('flip').onclick=flip;
  else{
    document.getElementById('again').onclick=()=>{grade(x[0],false);v.i++;v.flipped=false;render();};
    document.getElementById('got').onclick=()=>{grade(x[0],true);v.i++;v.flipped=false;render();};
  }
}

function quizView(){
  const v=view,d=v.deck;
  if(v.i>=d.length) return doneScreen(`${v.score} of ${d.length} right`, v.c);
  const x=d[v.i];
  if(!v.opts){
    // Distractors must be excludable. Words inside one cluster share an axis and are
    // often near-synonyms, so distractors are drawn from OTHER clusters, minus a
    // blocklist of pairs that are confusable across cluster boundaries.
    const home = CLUSTER_OF[x[0]];
    const banned = new Set(CONFUSABLE[x[0]] || []);
    const pool = TAUGHT.filter(y => y.d && y.w!==x[0] && y.c!==home && !banned.has(y.w))
                       .map(y=>[y.w,y.d,y.n]);
    v.opts = shuffle([x, ...shuffle(pool).slice(0,3)]);
  }
  let h=`<button class="back lab" id="bk">← ${v.c?'Cluster':'Route'}</button>
    <div class="prog">${v.i+1} of ${d.length} · ${v.score} right</div>
    <p class="qp">${x[1]}</p><div class="opts">`;
  v.opts.forEach((o,i)=>{
    let cls='opt';
    if(v.picked!==null){ if(o[0]===x[0])cls+=' right'; else if(i===v.picked)cls+=' wrong'; }
    h+=`<button class="${cls}" data-i="${i}" ${v.picked!==null?'disabled':''}>${o[0]}</button>`;
  });
  h+='</div>';
  if(v.picked!==null){
    h+=`<div class="fb"><b>${x[0]}</b> — ${x[1]}${x[2]?`<br>${x[2]}`:''}</div>`;
    const wrong = v.opts.filter(o=>o[0]!==x[0]);
    h+=`<div class="why"><span class="lab whyh">The others</span>`;
    wrong.forEach(o=> h+=`<div class="wl"><b>${o[0]}</b> ${o[1]}</div>`);
    h+=`</div><div class="acts"><button class="btn pri" id="nx">Next</button></div>`;
  }
  app.innerHTML=h;
  document.getElementById('bk').onclick=()=>{view=v.c?{name:'cluster',c:v.c}:{name:'route'};render();};
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    v.picked=+b.dataset.i;
    const ok=v.opts[v.picked][0]===x[0];
    if(ok)v.score++; grade(x[0],ok); render();
  });
  const nx=document.getElementById('nx');
  if(nx) nx.onclick=()=>{v.i++;v.picked=null;v.opts=null;render();};
}

function reviewView(){
  const v=view;
  if(!v.deck){ v.deck=queue(40).map(t=>[t.w,t.d,t.n]); v.i=0; v.score=0; v.picked=null; v.c=null; }
  if(!v.deck.length) return doneScreen('Nothing due right now', null);
  if(v.i>=v.deck.length) return doneScreen(`${v.score} of ${v.deck.length} right`, null);
  quizView();
}
function shakyView(){
  const v=view;
  if(!v.deck){
    v.deck=interleave(TAUGHT.filter(x=>state(x.w)===SHAKY)).slice(0,30).map(t=>[t.w,t.d,t.n]);
    v.i=0; v.flipped=false; v.produce=true; v.c=null;
  }
  if(!v.deck.length) return doneScreen('No weak words right now', null);
  studyView();
}

function verbalView(){
  const v=view;
  if(v.i>=VERBAL.length) return doneScreen(`${v.score} of ${VERBAL.length} right`, null);
  const q=VERBAL[v.i];
  const nBlanks = q.k==='tc' ? q.o.length : 1;
  if(!v.sel.length) v.sel = q.k==='se' ? [] : Array(nBlanks).fill(-1);
  const roman=['(i)','(ii)','(iii)'];
  let h=`<button class="back lab" id="bk">← Route</button>
    <div class="prog">Question ${v.i+1} of ${VERBAL.length} · ${q.k==='tc'?'Text Completion':'Sentence Equivalence'} · ${v.score} right</div>
    <p class="qp">${q.t.replace(/___/g,'<span class="blank">______</span>')}</p>`;
  if(q.k==='se') h+=`<div class="hint lab" style="margin:-8px 0 12px">Choose the two that give the same meaning</div>`;
  q.o.forEach((set,bi)=>{
    if(q.k==='tc'&&q.o.length>1) h+=`<div class="blab lab">${roman[bi]}</div>`;
    h+='<div class="opts">';
    set.forEach((o,oi)=>{
      let cls='opt';
      if(v.done){
        const isAns = q.k==='se' ? q.a.includes(oi) : q.a[bi]===oi;
        const chose = q.k==='se' ? v.sel.includes(oi) : v.sel[bi]===oi;
        if(isAns) cls+=' right'; else if(chose) cls+=' wrong';
      } else {
        const chose = q.k==='se' ? v.sel.includes(oi) : v.sel[bi]===oi;
        if(chose) cls+=' picked';
      }
      h+=`<button class="${cls}" data-b="${bi}" data-o="${oi}" ${v.done?'disabled':''}>${o}</button>`;
    });
    h+='</div>';
  });
  if(!v.done){
    const ready = q.k==='se' ? v.sel.length===2 : v.sel.every(x=>x>=0);
    h+=`<div class="acts"><button class="btn pri" id="chk" ${ready?'':'disabled'}>Check</button></div>`;
  } else {
    h+=`<div class="fb">${q.e}</div><div class="acts"><button class="btn pri" id="nx">Next</button></div>`;
  }
  app.innerHTML=h;
  document.getElementById('bk').onclick=()=>{view={name:'route'};render();};
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const bi=+b.dataset.b, oi=+b.dataset.o;
    if(q.k==='se'){
      const k=v.sel.indexOf(oi);
      if(k>=0) v.sel.splice(k,1); else if(v.sel.length<2) v.sel.push(oi);
    } else v.sel[bi]=oi;
    render();
  });
  const chk=document.getElementById('chk');
  if(chk) chk.onclick=()=>{
    let ok;
    if(q.k==='se') ok = v.sel.length===2 && v.sel.slice().sort().join()===q.a.slice().sort().join();
    else ok = v.sel.every((x,i)=>x===q.a[i]);
    if(ok) v.score++;
    // grade every target word this item tested
    const targets = q.k==='se' ? q.a.map(i=>q.o[0][i]) : q.a.map((ai,bi)=>q.o[bi][ai]);
    targets.forEach(w=>{ if(CLUSTER_OF[w]!==undefined) grade(w, ok); });
    v.done=true; render();
  };
  const nx=document.getElementById('nx');
  if(nx) nx.onclick=()=>{v.i++;v.sel=[];v.done=false;render();};
}

function doneScreen(msg,c){
  const t=tally(TAUGHT);
  app.innerHTML=`<h2 class="ct">${msg}</h2>
    <p class="cax">Words you missed come back within a day. Words you knew stretch further out each time.</p>
    <div class="legend lab" style="margin-bottom:20px">
      <span><i style="background:var(--solid)"></i>holding ${t.known}</span>
      <span><i style="background:var(--learn)"></i>coming along ${t.learning}</span>
      <span><i style="background:var(--weak)"></i>forgetting often ${t.shaky}</span>
    </div>
    <div class="acts">${c?`<button class="btn" id="again2">Back to cluster</button>`:''}
      <button class="btn pri" id="home">Route</button></div>`;
  const a=document.getElementById('again2');
  if(a) a.onclick=()=>{view={name:'cluster',c};render();};
  document.getElementById('home').onclick=()=>{view={name:'route'};render();};
  save();
}

function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[b[i],b[j]]=[b[j],b[i]];}return b;}

document.getElementById('themeBtn').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':cur==='light'?'dark':(matchMedia('(prefers-color-scheme:dark)').matches?'light':'dark');
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem('ascent-theme',next)}catch(e){}
};
try{const t=localStorage.getItem('ascent-theme'); if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
document.getElementById('resetBtn').onclick=()=>{
  if(!confirm('Clear all progress? Export first if you want a copy.'))return;
  P={};dirty=true;save();render();
};
document.getElementById('expBtn').onclick=exportProgress;
document.getElementById('impBtn').onclick=()=>document.getElementById('impFile').click();
document.getElementById('impFile').onchange=e=>{ if(e.target.files[0]) importProgress(e.target.files[0]); };

render(); load();
</script>

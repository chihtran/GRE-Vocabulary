rd in this cluster","sự kính nhường"],["entreat","ask earnestly, beg","Neutral register","khẩn khoản xin"],["fawn","(v) show exaggerated affection or flattery","The image is a dog","nịnh bợ xum xoe"],["fawning","showing exaggerated flattery and affection","The image is a dog at your feet; always negative","xu nịnh quỵ luỵ"],["grovel","abase oneself, behave abjectly","Physical image: face to the floor","quỳ luỵ hèn hạ"],["mendicant","a beggar; living on alms","mendicant friar","kẻ ăn xin"],["obeisance","deferential respect; a bow","pay obeisance to","cái cúi chào kính cẩn"],["obsequious","excessively eager to please or obey","Highest-frequency word here. Always negative","khúm núm lấy lòng"],["officious","meddlesome, intrusively assertive","TRAP: nothing to do with official","xía vào việc không phải của mình"],["servile","slavishly submissive","n. servility","khúm núm như nô lệ"],["subservient","subordinate; excessively submissive","Two senses — one structural, one about manner","phục tùng; ở vị trí dưới"],["supplicant","one who begs humbly","","kẻ khẩn cầu"],["supplicate","(v) to beg humbly","Same root; don't confuse either with supplant","van xin hạ mình"],["sycophantic","behaving in a servile, flattering way to gain advantage","The adjective of sycophant","xu nịnh để trục lợi"],["toady","a sycophant; to behave servilely","The concrete noun for the person","kẻ bợ đỡ"],["unctuous","excessively smooth and ingratiating","From unguere, to anoint — oily","ngọt nhạt giả lả"],["wheedle","coax by flattery, often persistently","Implies working on someone over time","nỉ non dỗ ngọt"]]},{"n":3,"t":"Slander and belittling","a":"Attacks on reputation. Calumny/defame assert falsehood; disparage/belittle do not","w":[["affront","(n/v) an open insult to dignity","Public and deliberate","sự xúc phạm công khai"],["aspersion","a damaging remark","Almost always cast aspersions on","lời gièm pha"],["belittle","make something seem less important","The plainest word here","coi nhẹ, hạ thấp"],["calumny","a false statement made to damage a reputation","Falsehood is built in. v. calumniate","lời vu khống"],["canard","an unfounded rumour or story","French for duck. A story that won't die","tin đồn thất thiệt dai dẳng"],["contempt","the feeling that someone is beneath consideration","A feeling, not an act","sự khinh miệt"],["decry","publicly denounce as bad","Usually aimed at practices, not people","lên án công khai"],["defame","damage a reputation, usually falsely","Legal register. n. defamation","bôi nhọ danh dự"],["denigrate","blacken a reputation, belittle","Latin niger, black","bôi đen danh tiếng"],["deprecate","express disapproval of","≠ depreciate (lower in value). self-deprecating","tỏ ý không tán thành"],["deride","mock, ridicule","derisive = mocking · derisory = laughably small","nhạo báng"],["derision","contemptuous ridicule","The noun of deride","sự chế nhạo khinh miệt"],["detract","take away from someone's worth","Usually detract from","làm giảm giá trị"],["detraction","the act of belittling","Noun form","sự dèm pha hạ thấp"],["discredit","damage a reputation; cause to be disbelieved","Second sense applies to theories too","làm mất uy tín"],["disdain","(n/v) contempt for what is beneath you","Feeling plus its expression","khinh thường, không thèm đếm xỉa"],["disparage","speak slightingly of","Milder than defame; no claim of falsehood","nói xấu, coi rẻ"],["impugn","call into question, attack as false","impugn his motives — attacks integrity, not competence","nghi ngờ động cơ"],["invidious","likely to arouse resentment; unfairly discriminating","TRAP: ≠ envious. invidious comparison","gây ghen tức vì bất công"],["malign","(v) speak evil of · (adj) evil in influence","Dual part of speech. a malign influence","nói xấu; có hại"],["odious","repulsive, deserving hatred","Describes the object, not the attack","đáng ghét"],["opprobrium","public disgrace and harsh censure","Antonym of approbation. Usually deserved","sự ô nhục công khai"],["pejorative","expressing disapproval; a belittling word","Describes language","mang nghĩa miệt thị"],["repugnant","offensive, distasteful","Describes the object","gây ghê tởm"],["scorn","(n/v) open contempt","","sự khinh bỉ ra mặt"],["slander","a false spoken statement damaging a reputation","libel is the written form","vu khống bằng lời nói"],["spurn","reject with contempt","Rejection, not description","cự tuyệt khinh khỉnh"],["tarnish","dull or damage a reputation","Metaphor from metal","làm xỉn danh tiếng"],["vilify","write or speak about with abusive hostility","Sustained, not a single remark","bôi nhọ dai dẳng"]]},{"n":4,"t":"Rebuke and verbal attack","a":"Angry speech. Severity: admonish < reproach < castigate < excoriate < fulminate","w":[["admonish","warn or reprove gently","Mildest on the ladder; includes friendly warning","nhắc nhở nhẹ nhàng"],["berate","scold at length and angrily","","mắng mỏ dài dòng"],["castigate","punish or reprimand severely","","khiển trách nặng"],["castigation","severe reprimand","The noun of castigate","sự khiển trách nặng"],["censure","express formal, official disapproval","Institutional — a body censures a member","khiển trách chính thức"],["chasten","correct so as to humble","chastened = humbled by the experience","sửa dạy khiến biết khiêm nhường"],["chastise","rebuke or punish severely","Near-twin of castigate","trừng phạt nghiêm khắc"],["denounce","publicly condemn","Public, often political","tố cáo công khai"],["diatribe","a bitter, sustained verbal attack","A thing produced","bài đả kích cay nghiệt"],["excoriate","censure severely; literally, strip the skin from","Savage end","phê phán lột da"],["fulminate","protest thunderously","fulminate against","lên án như sấm sét"],["harangue","a lengthy aggressive lecture","Noun and verb","bài lên lớp dài dòng"],["imprecation","a spoken curse","","lời nguyền rủa"],["invective","abusive language","Uncountable — a stream of invective","lời lăng mạ"],["inveigh","speak bitterly against","inveigh against. Pairs with fulminate","công kích kịch liệt"],["lambaste","criticize harshly","","chỉ trích tơi bời"],["objurgation","harsh rebuke","Rarest here; recognition-level only","lời quở trách nặng"],["rail","complain or protest bitterly","rail against. Also a trap word, cluster 47","chửi rủa kịch liệt"],["remonstrate","protest, make objections","Reasoned objection, not abuse","phản đối có lý lẽ"],["reproach","express disapproval or disappointment","Carries hurt, not rage. above reproach","trách móc pha thất vọng"],["scathing","severely critical","a scathing review","phê phán như xát muối"],["screed","a long tedious piece of writing or speech","Usually hostile as well as long","bài viết dài lê thê"],["stricture","a severe criticism; also a limit placed on what may be done","Both senses are tested","lời phê nặng; sự hạn chế"],["tirade","a long angry speech","A thing produced, like diatribe","tràng mắng mỏ"],["upbraid","to reproach severely","","quở trách nặng lời"],["vituperative","bitter and abusive","The adjective for invective","chửi rủa thậm tệ"]]},{"n":5,"t":"Irritability and fault-finding","a":"Bad temper plus the habit of picking at small faults","w":[["abrasive","harsh in manner, wearing to deal with","Metaphor from sandpaper","thô ráp, làm người khác mệt"],["asperity","(n) harshness of tone or manner","replied with some asperity","sự gay gắt trong giọng"],["boorish","crude, ill-mannered","Implies coarseness. From boor, a peasant","thô lỗ quê kệch"],["cantankerous","bad-tempered and argumentative","Faintly comic; usually of the old","cáu bẳn hay cãi"],["captious","given to raising trivial objections","The adjective for the person","hay bắt bẻ vặt"],["carping","persistently petty in criticism","Often a noun: tired of his carping","sự chê bai vặt dai dẳng"],["choleric","quick-tempered and irritable","From the humour choler; the counterpart of phlegmatic","nóng nảy"],["churlish","rude and mean-spirited","Implies meanness, not just rudeness","thô lỗ và độc địa"],["curmudgeon","(n) a bad-tempered person","The noun for the type","ông già khó tính"],["discomfit","to throw someone off balance by defeating their plan","Not discomfort, which is physical unease","làm hỏng thế của ai"],["disgruntle","to make discontented and resentful","Almost always as disgruntled. The resentment is sullen rather than loud","làm bất mãn, hậm hực"],["finicky","excessively fussy about detail","Broader — applies to taste and habits too","kén cá chọn canh"],["fractious","irritable and difficult to control","Often of groups: a fractious coalition","hay gây, khó bảo"],["grievance","(n) a real or supposed ground for complaint","The grounds, not the complaining","nỗi bất bình có cơ sở"],["grouse","complain, gripe","Also a trap word — the bird, and the verb","cằn nhằn"],["grumble","complain in a low, muttering way","Audible but not confrontational","lầm bầm phàn nàn"],["impertinent","not showing proper respect","TRAP: also means irrelevant — the opposite of pertinent","hỗn xược; lạc đề"],["impudent","boldly disrespectful, cheeky","","xấc láo không biết ngượng"],["insolent","openly contemptuous of authority","The strongest of the three","láo xược với bề trên"],["irascible","quick to anger","The plainest word for a short fuse","nóng tính"],["irksome","causing annoyance, tiresome","Describes the task, not the person","gây khó chịu (công việc)"],["jibe","(n/v) an insulting or mocking remark","Also spelled gibe. Not jibe with = to agree","lời chế nhạo"],["nettlesome","causing irritation or difficulty","Same direction. From nettle","gai góc gây phiền"],["obstreperous","noisily and aggressively unruly","The noise is part of it","ồn ào ngỗ ngược"],["petulant","childishly sulky or bad-tempered","The childish quality is the point","hờn dỗi như trẻ con"],["pique","(n) resentment from wounded pride · (v) to stimulate","Dual sense. in a fit of pique but also piqued my interest","sự phật ý; khơi gợi"],["querulous","habitually complaining, whining","Complaint as a permanent tone of voice","hay ca cẩm rên rỉ"],["quibble","(v/n) raise a trivial objection","The specific act","bắt bẻ chuyện vặt"],["raillery","good-humoured teasing","Milder and often affectionate — the friendliest word in the cluster","lời trêu chọc thân tình"],["repine","fret or complain discontentedly","Formal, literary. Often repine at","than thân trách phận"],["restive","restless and resistant to control","Impatience under restraint, not anger","bồn chồn vì bị kìm giữ"],["splenetic","bad-tempered and spiteful","From the spleen, once thought the seat of anger","cáu bẳn hiểm độc"],["strident","loud and harsh; insistently forceful","Of voices and of demands","chát chúa gay gắt"],["truculence","aggressive defiance; readiness to fight","From trux, fierce","sự hung hăng gây chiến"],["truculent","aggressively defiant, belligerent","Stronger than the rest — this is hostility, not irritability","hung hăng thích gây sự"],["vexation","(n) the state of being annoyed","The feeling, in the person affected","nỗi bực bội"],["vexing","causing irritation","The adjective describing the thing, like irksome","gây bực mình"]]},{"n":6,"t":"Talkative ↔ concise","a":"Two poles: garrulous/prolix/voluble vs laconic/terse/pithy","w":[["banter","light, playful exchange","Positive. Compare raillery in cluster 05","lời trêu đùa thân mật"],["brevity","(n) shortness","The neutral noun","sự ngắn gọn"],["circumlocution","a roundabout way of saying something","Literally: speaking around","lối nói vòng"],["expatiate","speak or write at length on a subject","Neutral. Expatiate on a topic","nói dài về một chủ đề"],["extemporaneous","spoken without preparation","ex tempore, out of the moment","nói không chuẩn bị"],["extemporize","(v) to improvise","","ứng khẩu"],["garrulous","talkative, especially about trivia","Stronger and more negative than loquacious — the content is worthless","lắm mồm chuyện vặt"],["glib","fluent but shallow or insincere","TRAP: negative. Not merely smooth — it implies the ease conceals a lack of substance or honesty","trơn tru mà hời hợt"],["laconic","using very few words","From Laconia (Sparta). Describes the utterance, not the person's temperament","kiệm lời"],["litany","a long, repetitive recital","Originally a liturgical prayer with repeated responses. Now usually a litany of complaints — the repetition and the tedium are the point","chuỗi liệt kê lê thê"],["loquacious","talkative","The plainest word. Mildly negative","nói nhiều"],["pithy","brief and full of meaning","Positive. Brevity plus substance. From pith, the core","ngắn mà đầy ý"],["prate","talk foolishly at length","","nói nhảm dài dòng"],["prattle","chatter idly, like a child","","bi bô như trẻ nhỏ"],["prolix","tediously lengthy","Near-identical to verbose. Both judge the text, not the speaker","dài dòng lê thê"],["raconteur","a skilled, entertaining storyteller","Positive. French","người kể chuyện có duyên"],["ramble","talk at length without direction","The problem is structure, not volume","nói lan man"],["recapitulate","summarize the main points again","Not simple repetition — it restates in condensed form. Recap","tóm lược lại"],["reiterate","say again","re- + iterate, to repeat","nhắc lại y như cũ"],["reticent","reserved; unwilling to speak about something","A choice about a specific matter, not a general trait","kín tiếng về một chuyện"],["riposte","a quick, sharp retort","From fencing — the counter-thrust after a parry","lời đáp trả sắc lẹm"],["succinct","expressed briefly and clearly","A compliment, like pithy","ngắn gọn rõ ràng"],["taciturn","habitually silent, uncommunicative","A permanent trait. From tacere, to be silent — cf. tacit","ít nói do bản tính"],["terse","brief and to the point","Can tip into curt — the one word here that may be negative","cộc lốc ngắn gọn"],["verbose","using more words than needed","","dài dòng"],["vocal","expressing opinions freely and loudly; relating to the voice","Two senses. A vocal critic says so openly — nothing to do with singing","lên tiếng mạnh; thuộc giọng nói"],["voluble","speaking fluently and at length","Not necessarily negative. From volvere, to roll — the words roll out easily","nói trôi chảy liến thoắng"]]},{"n":7,"t":"Inflated and empty language","a":"Inflation and emptiness — in language, and in how a person presents themselves","w":[["affectation","behaviour adopted to impress","An assumed manner, not a natural one","điệu bộ giả tạo"],["aphorism","a short pointed saying containing a truth","POSITIVE. A real insight, briefly put","cách ngôn súc tích"],["apothegm","a terse instructive saying","Near-twin of aphorism. Also positive","châm ngôn ngắn gọn"],["banal","commonplace, unoriginal","The plainest word here","tầm thường sáo mòn"],["bedizen","to dress up gaudily","Archaic; the excess is the point","trang sức loè loẹt"],["bombastic","inflated, pompous in speech","From bombast, cotton padding used to stuff clothing. The image is padding","khoa trương rỗng tuếch"],["bravado","a show of boldness meant to impress","The boldness is display, not courage — that is the whole word","vẻ gan dạ giả tạo"],["bromide","a trite, soothing remark","Originally a sedative — a phrase administered to calm rather than inform","câu sáo rỗng ru ngủ"],["cant","insincere pious or moralistic talk; also, jargon of a group","Two live senses. Also a trap word — see cluster 47","lời đạo đức giả; tiếng lóng nghề"],["derivative","unoriginal, copied from elsewhere","TRAP: the everyday maths sense is irrelevant. This is a criticism","thiếu độc đáo, sao chép"],["doggerel","crude, badly made verse","The verse-specific word","thơ vè vụng về"],["egoism","the doctrine or habit of self-interest","Note: egoism ≠ egotism. Egoism is philosophical; egotism is talking about yourself","chủ nghĩa vị kỷ"],["egotistical","excessively self-referential","The everyday one","hay nói về mình"],["exaggeration","a statement that represents something as greater than it is","Hyperbole is deliberate exaggeration used as a device; this is the plain word","sự phóng đại"],["fatuous","silly and self-satisfied","Foolishness plus complacency — that combination is the word","ngớ ngẩn mà tự mãn"],["flamboyant","showy, extravagant","From flame — flame-shaped","phô trương sặc sỡ"],["flaunt","to display ostentatiously","Not flout, which means to defy openly","khoe khoang phô ra"],["florid","ornate, elaborately decorated","flos, flower. Also means flushed red in the face","rườm rà hoa mỹ; đỏ ửng"],["fulsome","excessive to the point of insincerity","TRAP: does not mean \"full\" or \"generous.\" Fulsome praise is praise that has become unpleasant","tâng bốc quá hoá giả"],["gloat","to dwell on your own success or another's failure","The satisfaction in another's loss is the distinguishing part","hả hê trước thất bại của người"],["grandiloquent","using lofty, extravagant language","grand + loqui, to speak","nói lời đao to búa lớn"],["hackneyed","worn out by overuse","From hackney, a horse hired out until exhausted","mòn sáo vì dùng nhiều"],["haughty","arrogantly superior","From haut, high","kiêu kỳ ngạo mạn"],["homily","a moralizing lecture; a sermon","Not necessarily hollow, but usually used dismissively","bài giảng đạo đức"],["humdrum","monotonous, dull","","tẻ nhạt lặp đi lặp lại"],["insipid","dull, without flavour or interest","Literally tasteless — in- + sapidus, flavourful","nhạt nhẽo"],["megalomania","delusion of one's own power or greatness","The extreme end","hoang tưởng tự đại"],["monotonous","unvarying, tediously uniform","mono + tonos, one tone","đều đều tẻ ngắt"],["moralizing","preaching about right and wrong, often tiresomely","Close to didactic, and equally dismissive","lên lớp đạo đức"],["mundane","ordinary, of the everyday world","mundus, world. Less pejorative than banal","tầm thường đời thường"],["narcissism","excessive self-admiration","","tự yêu mình thái quá"],["ornate","heavily decorated","Neutral for architecture, negative for prose","chạm trổ cầu kỳ"],["ostentatious","showily displaying wealth or knowledge","ostendere, to show. The display is the point","phô của cải ra"],["overweening","arrogant, presumptuous","overweening ambition","ngạo mạn quá đáng"],["platitude","a flat, overused remark offered as insight","The commonest word in this group","câu sáo rỗng ra vẻ sâu sắc"],["pomposity","self-important solemnity","","vẻ trịnh trọng tự đại"],["pompous","self-important and grandly solemn","The adjective of pomposity","tự cao trịnh trọng"],["ponderous","heavy, laboured, dull","pondus, weight. Prose that moves slowly under its own mass","nặng nề lê thê"],["posturing","adopting a stance for effect","Behaviour rather than speech","làm điệu bộ cho người xem"],["presumptuous","overstepping what is warranted","Taking a liberty you have not earned","tự tiện quá phận"],["pretentious","claiming more importance than is warranted","","làm ra vẻ hơn thực chất"],["prosaic","dull, unimaginative","From prose — the opposite of poetic","khô khan thiếu chất thơ"],["sanctimonious","making a show of moral superiority","The adjective that goes with cant","làm ra vẻ đạo đức"],["self-aggrandizement","the act of increasing one's own power or importance","Almost always a criticism","sự tự đề cao bản thân"],["sensational","designed to excite or shock","TRAP: in GRE register this is negative — sensational journalism, not \"excellent\"","giật gân câu khách"],["tautology","saying the same thing twice in different words","a free gift, an added bonus","lặp ý bằng chữ khác"],["tedious","tiresome through length or dullness","","chán vì dài dòng"],["tedium","the state of being tediously dull","The noun of tedious","sự buồn tẻ"],["trite","overused and therefore without force","The plain word for stale","sáo mòn"],["tumid","swollen; inflated in style","Same root as tumour. Near-twin of turgid","sưng phồng; văn phong phô trương"],["turgid","swollen; pompously overblown","Literally swollen (a turgid river). Watch: turgid ≠ turbid, which means muddy","phồng rộp, khoa trương"],["vacuous","empty of thought","vacuus, empty. Vacuous is about the mind; vapid about the effect","rỗng tuếch"],["vapid","offering nothing of interest","From vapidus, flat, of wine that has lost its sparkle","nhạt như nước ốc"],["vaunt","to boast about","a much-vaunted reform — often ironic","khoe khoang"]]},{"n":8,"t":"Clear ↔ obscure ↔ evasive","a":"Three tiers, not two. Evasion is deliberate obscurity","w":[["abstruse","hard to understand","abs- + trudere, to push away","khó hiểu vì sâu"],["accessible","easy to approach or understand","Of writing, implies no specialist knowledge needed","dễ tiếp cận, dễ hiểu"],["ambiguous","open to more than one interpretation","May or may not be deliberate — the one word here that can be innocent","mơ hồ, hai nghĩa"],["arcane","mysterious, known to few","arca, a chest — knowledge kept in a box","bí ẩn, ít người biết"],["articulate","(adj) expressing oneself clearly · (v) to express","Dual part of speech, and the verb also means to connect at a joint","diễn đạt rõ ràng"],["befuddled","confused, muddled","","bối rối lú lẫn"],["byzantine","excessively complicated, especially of systems","From the administration of the Byzantine empire. Usually of bureaucracy","rắc rối chằng chịt"],["circuitous","indirect, roundabout","The route rather than the knot","vòng vo xa hơn cần thiết"],["coherent","logically connected, holding together","co- + haerere, to stick. Not the same as clear: a coherent argument can be hard","mạch lạc, gắn kết"],["confound","to confuse or bewilder; also, to defeat expectations","Two senses. Confound the sceptics = prove them wrong","làm bối rối; phủ nhận dự đoán"],["conundrum","a confusing problem or riddle","The problem","câu đố hóc búa có lời giải"],["convoluted","excessively complex and twisted","con- + volvere, to roll up","rối rắm khó theo"],["cryptic","having a hidden or puzzling meaning","From krypto, hidden","khó hiểu, ẩn ý"],["decipher","to work out the meaning of something obscure or coded","The verb of getting out","giải mã, đọc ra"],["delineate","to describe or outline precisely","de- + linea, line. The image is drawing an outline","phác hoạ rõ đường nét"],["digression","a wandering away from the subject","A departure, not a confusion","sự lạc đề"],["disjointed","lacking connection between its parts","The exact opposite of coherent","rời rạc"],["elucidate","to make clear, throw light on","e- + lux. The active verb of clarifying","làm sáng tỏ"],["elusive","difficult to catch, grasp, or define","Can apply to concepts as well as people","khó nắm bắt"],["enigmatic","puzzling, mysterious","From enigma","bí ẩn khó đoán"],["enunciate","to pronounce clearly; to state a principle formally","Two senses, both about making something distinct","phát âm rõ; nêu nguyên tắc"],["equivocate","to use ambiguous language to avoid commitment","equi- + vocare, equal voices. The point is avoiding commitment, not confusion","nói nước đôi để né"],["erroneous","based on or containing error; incorrect","Of beliefs and assumptions, not of people. An erroneous conclusion","sai, nhầm lẫn"],["esoteric","understood only by a small initiated group","The difficulty is specialist knowledge","chỉ giới trong nghề mới hiểu"],["evasive","avoiding a direct answer","","lảng tránh câu hỏi"],["explicable","able to be explained","Note inexplicable is the commoner form","giải thích được"],["explicate","to explain in detail, unfold","ex- + plicare, to unfold. More systematic than elucidate","phân tích cặn kẽ"],["fathom","to understand after effort","cannot fathom. Originally a measure of depth","hiểu ra sau khi vật lộn"],["flummoxed","completely baffled","Informal register","bó tay không hiểu nổi"],["hermetic","sealed and airtight; also obscure and hard to penetrate","From Hermes Trismegistus","kín như bưng; khó thâm nhập"],["impenetrable","impossible to understand or get into","","không thể thâm nhập"],["indeterminate","not fixed or settled","Of a value or outcome, not a person","chưa định được"],["inscrutable","impossible to interpret or read","Usually of faces and intentions, not texts","khó dò, không đọc được"],["intelligible","able to be understood","Weaker than lucid — it means merely possible to understand","có thể hiểu được"],["limn","to depict or describe","Rare and literary. Same family as illuminate","khắc hoạ, mô tả"],["lucid","clear and easy to follow","lux, light. Also means mentally sound — a lucid interval","sáng sủa dễ theo"],["nonplussed","so surprised as to be at a loss","TRAP: it does not mean unbothered. American usage has drifted, but the GRE uses the original: at a loss for how to react","sững người không biết phản ứng"],["obfuscate","to deliberately make unclear","ob- + fuscus, dark. The clearest case of intent","cố tình làm tối nghĩa"],["opaque","not transparent; impossible to see through","The physical metaphor for obscurity","đục, không nhìn xuyên được"],["predicament","a difficult situation hard to escape","","tình thế khó xử"],["quagmire","a situation that is hard to get out of","","vũng lầy khó thoát"],["quandary","a state of uncertainty about what to do","The state you are in — a quandary is about a decision, a conundrum about a puzzle","thế tiến thoái lưỡng nan"],["recondite","deep and obscure","The difficulty is depth. Near-twin of abstruse","thâm sâu khó hiểu"],["tortuous","full of twists and turns","TRAP: ≠ torturous, which means painful. A tortuous argument winds; a torturous one hurts","quanh co ngoằn ngoèo"]]},{"n":9,"t":"Calm → unfeeling → torpid","a":"Declining responsiveness to stimulus. Very high SE frequency","w":[["abeyance","temporary suspension","A noun and a state. Held in abeyance — of rules, claims, activity","sự tạm đình chỉ"],["aloof","distant, uninvolved","Physical or social distance","xa cách, tách biệt"],["apathy","absence of interest or concern","a- + pathos, without feeling","sự thờ ơ"],["aplomb","self-confident composure under pressure","handled the interruption with aplomb","sự điềm tĩnh tự tin"],["blasé","unimpressed through overfamiliarity","The cause is having seen it before","chai lì vì quen quá"],["callous","insensitive to others' suffering","The moral word here — hardened, from callus","chai sạn trước nỗi đau người khác"],["cavalier","offhand, dismissive of things that deserve care","Negative. a cavalier attitude to safety","xem nhẹ điều đáng coi trọng"],["complacent","smugly satisfied, unaware of deficiency","TRAP: ≠ complaisant from cluster 02. Complacent is about yourself; complaisant is about pleasing others","tự mãn, không thấy khiếm khuyết"],["dawdle","to move or act slowly, wasting time","The verb","lề mề nấn ná"],["dilatory","tending to delay","Of a person or a process. dilatory tactics","chậm trễ dây dưa"],["dispassionate","not influenced by emotion; impartial","A compliment, unlike apathy","khách quan không cảm tính"],["distrait","inattentive, with the mind plainly elsewhere","French; not the same as absent-minded by nature","đãng trí, tâm trí để đâu"],["dormant","temporarily inactive, sleeping","dormire, to sleep. A dormant volcano is not extinct","ngủ yên, có thể thức dậy"],["ennui","listless boredom arising from lack of interest","French. Boredom with a philosophical flavour","nỗi chán chường rỗng rễnh"],["equable","even-tempered, not given to swings","Describes the disposition. Also used of climate","điềm đạm không thất thường"],["equanimity","evenness of mind under strain","aequus + animus, level mind. The noun everyone should know","sự bình thản giữa sóng gió"],["fatigue","extreme tiredness; also weakening of metal under stress","Two senses","sự mệt lử; mỏi kim loại"],["halcyon","calm and peaceful","Almost always of a past time — halcyon days. From the kingfisher","yên bình (của thời đã qua)"],["impassive","showing no emotion","About the surface. An impassive face may conceal a great deal","mặt không biểu cảm"],["imperturbable","not capable of being upset","in- + perturbare. The strongest of these","không gì làm nao núng"],["indolent","habitually lazy","The moral version. Indolence is a fault; lassitude is a condition","lười biếng"],["inert","without power to move or act","Chemically or physically incapable, not merely resting","trơ, không thể hoạt động"],["insensible","unaware, unresponsive","TRAP: ≠ insensitive. Insensible of the danger means unaware of it","không nhận biết được"],["insouciant","free from concern, carefree","Lighter than nonchalant, and often approving","vô tư nhẹ nhõm"],["inured","accustomed to something unpleasant","inured to hardship. Reached by exposure, not by nature","đã quen với gian khổ"],["languid","slow, relaxed, lacking vigour","Can be almost positive — languid elegance","uể oải mà duyên"],["lassitude","weariness, lack of energy","Physical or mental fatigue","sự bơ phờ kiệt sức"],["lethargic","sluggish, lacking energy","","lờ đờ thiếu sinh khí"],["lull","a temporary pause in activity","a lull in the fighting","quãng lặng tạm thời"],["nonchalant","casually unconcerned","Neutral or mildly positive — coolness","thản nhiên như không"],["oblivious","unaware","Of surroundings or of facts","không để ý tới"],["passive","accepting without resisting","","thụ động chấp nhận"],["phlegmatic","unemotional, hard to excite","From the humour phlegm. Closer to a temperament than a moment","lạnh nhạt khó kích động"],["placid","calm, untroubled","Can tip slightly negative — placid implies nothing is happening","điềm tĩnh, phẳng lặng"],["poise","composed self-assurance","Includes bearing, not just calm","sự đĩnh đạc tự chủ"],["quiescent","at rest, inactive","The medical and technical word for the same","đang lặng, không hoạt động"],["serene","calm and untroubled, with an air of dignity","","thanh thản đường bệ"],["sluggish","slow-moving, unresponsive","","chậm chạp uể oải"],["somnolent","drowsy, sleepy","Describes the person — the mirror of soporific","buồn ngủ"],["soporific","causing sleep or drowsiness","Direction of fit: describes the thing, not the person. A soporific lecture","gây buồn ngủ"],["stoic","enduring hardship without complaint","The endurance is the point. From the philosophical school","chịu đựng không than"],["stolid","showing no emotion or interest; dull","Impassive plus the suggestion of dullness","lì lợm vô cảm"],["stupefy","to make someone unable to think clearly","The verb of producing the state","làm sững sờ không nghĩ nổi"],["subdued","quiet and restrained, often after something","Implies a previous state that was livelier","trầm xuống, dịu hẳn"],["supine","lying face up; failing to act through weakness","The second sense is the tested one — a supine legislature is one that will not resist","nằm ngửa; nhu nhược không phản kháng"],["tepid","lukewarm; unenthusiastic","a tepid response","hờ hững nhạt nhẽo"],["torpor","a state of physical or mental inactivity","The noun for the condition. Also used of hibernating animals","trạng thái lờ đờ"],["tranquil","peaceful, quiet","Usually of places and conditions","yên tĩnh"],["weary","tired, worn out","","mệt rã rời"]]},{"n":10,"t":"Obstinacy and dogmatism","a":"Refusal to yield, plus the ideological version. Docile and tractable sit here as the opposite pole","w":[["acolyte","a devoted follower or assistant","Originally an altar attendant. Implies subordination and learning","môn đồ trung thành"],["adamant","refusing to be persuaded","From adamas, the hardest substance — the root of diamond. The mildest here, and closest to neutral: being adamant can be admirable","kiên quyết không lay chuyển"],["apologist","someone who defends a position or institution","TRAP: nothing to do with apologising. An apologist makes the case for something, usually something unpopular","người biện hộ"],["contumacious","stubbornly disobedient to authority","Legal register — contempt of court is contumacious conduct","ngoan cố chống lệnh toà"],["defy","to resist openly; to be impossible for","Two senses. Defy an order, and also defy description","thách thức, ngang nhiên chống"],["disciple","a follower of a teacher or doctrine","discere, to learn. Neutral to positive","môn đồ"],["docile","easily managed and willing to be taught","The opposite pole from intractable","ngoan ngoãn dễ bảo"],["doctrinaire","applying a theory rigidly without regard to circumstances","About applying a theory regardless of whether it fits. Stronger and more specific than dogmatic","giáo điều áp dụng máy móc"],["dogmatic","asserting opinions as if they were certainties","About the manner of holding beliefs","võ đoán, áp đặt ý mình"],["froward","difficult to deal with, contrary","Archaic. The opposite of toward — turned away","ngang bướng khó chiều"],["headstrong","determined to have one's own way","Suggests youth, and not having thought it through","bướng bỉnh nông nổi"],["hidebound","unwilling to change because bound by convention","The image is dried leather, too stiff to flex. The rigidity is habitual, not commanded","cố chấp theo lệ cũ"],["ideologue","someone whose positions follow a doctrine rather than evidence","The person, where dogmatic describes a manner","kẻ giáo điều theo chủ thuyết"],["imperious","arrogantly commanding, expecting obedience","From imperium, command. Watch: ≠ imperial (of an empire) and ≠ imperative (urgently necessary)","hống hách bắt phải nghe"],["implacable","impossible to appease or placate","in- + placare. Note what it is not: not merely stubborn, but unable to be calmed — of hostility, opposition, an enemy","không thể nguôi giận"],["intractable","not easily controlled or solved","Also used of problems, not just people — an intractable dispute","khó trị, khó giải"],["intransigence","refusal to compromise","The noun","sự không chịu nhượng bộ"],["intransigent","refusing to compromise","The negotiation word","không chịu thoả hiệp"],["magisterial","authoritative, in a manner that brooks no question","Two faces: it can praise (a magisterial study) or criticize (a magisterial manner). Context decides","uy nghiêm không cho cãi"],["martinet","someone who demands rigid adherence to rules","A noun, and a person. From Jean Martinet, a French drillmaster","kẻ khắt khe luật lệ"],["obdurate","stubbornly refusing to change","ob- + durus, hard. Negative, and often about refusing to feel pity","chai lì không mủi lòng"],["obstinate","stubborn, especially unreasonably","The plain word","bướng bỉnh"],["ossify","to become rigid and fixed, to stop developing","os, bone — literally to turn to bone. A verb, and used of institutions","hoá xương, cứng nhắc lại"],["partisan","a committed supporter of a party or cause; biased toward one side","Not always negative: a partisan can be a party member or a resistance fighter","người ủng hộ một phe"],["peremptory","allowing no refusal or discussion","a peremptory dismissal. The tone that closes off reply","dứt khoát không cho cãi"],["recalcitrant","resisting authority or control","re- + calcitrare, to kick back. The image is a mule","bướng bỉnh chống đối"],["refractory","stubbornly resistant to control or treatment","Near-twin of recalcitrant. Also technical: a refractory material resists heat","cứng đầu khó trị; chịu nhiệt"],["wayward","wilful and unpredictable, straying from what is expected","Adds unpredictability: a wayward child wanders rather than defies","ương ngạnh đi chệch"],["willful","deliberately doing what one wants despite instruction","The deliberateness is the point. Also spelled wilful","cố ý làm trái lời"],["zealot","a fanatical adherent","Originally a Jewish sect resisting Rome. Implies action, not just belief","kẻ cuồng tín"]]},{"n":11,"t":"Reckless ↔ brave ↔ hesitant ↔ cowardly","a":"A four-position scale, not a synonym pile","w":[["ambivalence","holding two contradictory feelings at once","Not uncertainty, and not indifference: both feelings are present and strong","sự giằng co hai chiều"],["ambivalent","holding two opposed feelings about the same thing at once","Not uncertainty and not indifference: both feelings are present and strong","vừa muốn vừa không"],["apprehension","anxiety about a future event","Also means understanding — apprehension of the facts. Two senses","nỗi lo trước; sự nắm bắt"],["assertive","confident in stating one's position","The mildest, and about speech rather than danger","quả quyết bày tỏ ý mình"],["audacious","daring, often to the point of impudence","Two faces: an audacious plan can be admiring; audacious behaviour is not","táo bạo đến trơ tráo"],["brazen","shameless, boldly defiant of propriety","From brass — brass-faced. The shamelessness is the point, not the courage","trơ trẽn trắng trợn"],["craven","contemptibly cowardly","Strong condemnation","hèn nhát đáng khinh"],["daunt","to make someone lose courage","undaunted is the commoner form","làm nhụt chí"],["daunting","intimidating, discouraging","Describes the task","đáng ngán, làm nản"],["demur","to raise an objection; to hesitate","Mild — a demurral is a polite objection, not a refusal","phản đối nhẹ, ngần ngại"],["diffidence","lack of self-confidence; shyness","Not indifference, which is not caring","sự rụt rè"],["diffident","lacking self-confidence, modest to a fault","TRAP: ≠ indifferent. Diffidence is shyness, not disinterest","rụt rè thiếu tự tin"],["disconcerting","unsettling, throwing one off balance","Describes the thing; compare discomfit from cluster 08","làm mất bình tĩnh"],["effrontery","insolent boldness; shameless nerve","The noun for brazen behaviour. had the effrontery to ask","sự trơ tráo"],["flustered","agitated and unable to collect oneself","Composure lost under pressure, not fear of danger","cuống quýt mất bình tĩnh"],["foolhardy","recklessly bold without regard to danger","The judgment failure is explicit in the word","liều mạng bất chấp"],["formidable","inspiring respect through size, power or difficulty","Can admire as well as intimidate","đáng gờm"],["fraught","filled with something undesirable; tense","fraught with danger, or simply a fraught meeting. Not itself a fear word — it describes a situation charged with it","đầy rẫy điều bất lợi"],["fret","to worry persistently about small things","The verb","lo lắng vụn vặt"],["impetuous","acting suddenly on impulse","The speed is the fault","bốc đồng hấp tấp"],["impulsive","acting without forethought","Plainer than impetuous","bốc đồng thiếu suy nghĩ"],["intrepid","fearless and enduring","in- + trepidus, not trembling. Built on trepidation, negated","gan dạ bền gan"],["irresolute","unable to decide","","do dự không quyết"],["mettle","spirit and resilience under test","prove your mettle. Not metal — though the words share an origin","khí phách khi bị thử thách"],["mettlesome","spirited, courageous","The adjective","có khí phách"],["perturb","to make anxious or unsettled","The verb of doing it to someone","làm bất an"],["plucky","brave in a determined way, especially against odds","Implies the underdog — plucky is never used of the strong","gan lì trước thế yếu"],["precipitate (adj)","done with excessive haste","Not precipitous, which means steep. The verb sense sits in the trap cluster","vội vã hấp tấp"],["precipitous","dangerously steep","Constantly swapped with the above","dốc đứng nguy hiểm"],["pusillanimous","cowardly, lacking courage","pusillus + animus, a small spirit. The literary word","nhát gan, chí nhỏ"],["quail","to lose courage and shrink back","Careful: this one faces the other way — quail is what the frightened person does. Also a bird","co rúm vì sợ"],["reluctance","unwillingness or hesitation to do something","Milder than refusal. Takes to: reluctance to commit","sự ngần ngại, không muốn"],["skittish","nervous and easily startled","From horses. Implies liability to bolt","nhát, dễ giật mình"],["temerity","reckless boldness in overstepping what is proper","Usually ironic — had the temerity to disagree. It is not courage","sự liều lĩnh quá phận"],["timorous","timid, showing fear","Same root as timid","nhút nhát sợ sệt"],["tremulous","trembling; timid","Physical shaking, or a shaking voice","run rẩy"],["trepidation","apprehension about something about to happen","with some trepidation. Anticipatory","nỗi lo trước khi việc xảy ra"],["vacillate","to waver between options","The verb for the behaviour","do dự đổi ý liên tục"],["valor","courage in the face of danger, especially in battle","Formal register","lòng dũng cảm nơi trận mạc"]]},{"n":12,"t":"Enthusiasm and sociability","a":"Energy plus warmth. Overlaps 52 EMOTION; this cluster is dispositional","w":[["alacrity","brisk and cheerful readiness","accepted with alacrity. Speed plus willingness — both halves matter","sự sốt sắng nhanh nhẹn"],["amenity","a pleasant feature or facility","Usually plural: the amenities. A thing, not a feeling","tiện nghi"],["amicable","characterized by friendliness","Usually of arrangements, not people — an amicable settlement","thân thiện, hoà hảo"],["ardent","passionate, intensely devoted","an ardent supporter. Root is ardere, to burn","nồng nhiệt"],["ardor","intense warmth of feeling; passion","The noun","nhiệt huyết"],["avid","keenly interested, eager","an avid reader. Root is avidus, greedy","háo hức, ham thích"],["avuncular","kind and friendly toward someone younger","Literally uncle-like. Carries a generational tilt","ân cần như chú bác"],["blithe","happy and carefree","Watch the second sense: blithe disregard means casual to the point of carelessness. Not always a compliment","vui vẻ vô tư"],["boisterous","noisily energetic and rough","The noise is the point, and it can be a mild criticism","ồn ào náo nhiệt"],["buoyant","cheerful and optimistic","The image is floating — it resists being pushed down","lạc quan, nổi lên được"],["congenial","pleasant and agreeable; suited to one's taste","Two senses: a congenial person is pleasant company; a congenial task suits you","dễ chịu, hợp ý"],["convivial","friendly and lively, especially around food and drink","con- + vivere, living together. The setting is a gathering","vui vẻ đầm ấm bên bàn tiệc"],["cordial","warm and friendly","Can be formal — cordial relations between states","nồng hậu"],["droll","amusing in an odd or understated way","The oddness is the point, not the volume of the joke","hài một cách kỳ khôi"],["ebullient","overflowing with enthusiasm","e- + bullire, to boil over","sôi nổi tràn trề"],["ecstatic","overwhelmingly joyful","Stronger than elated","ngây ngất sung sướng"],["effervescence","bubbling liveliness","The noun. Same image as fizzing water","sự sủi bọt, hoạt bát"],["euphoria","intense happiness or elation","Stronger than cheerfulness; often temporary","trạng thái hưng phấn cao"],["exhilarating","making one feel very happy and animated","Describes the thing, not the person","làm phấn chấn"],["facetious","treating serious matters with inappropriate humour","Negative. The inappropriateness is built in","đùa cợt không đúng lúc"],["fervent","showing intense feeling","The common adjective","nhiệt thành"],["fervid","intensely enthusiastic","Slightly stronger than fervent, and can tip into overheated","sục sôi nhiệt huyết"],["fervor","great warmth and intensity of feeling","Near-twin of ardor. Root fervere, to boil","nhiệt huyết mãnh liệt"],["gambol","to run or skip about playfully","Physical. The image is a lamb","nhảy nhót tung tăng"],["geniality","friendliness and cheerfulness of manner","The noun","sự niềm nở"],["gratify","to give pleasure or satisfaction","gratified by the response","làm hài lòng"],["gregarious","sociable, fond of company","From grex, a flock — the same root as congregate and segregate","thích tụ tập đông người"],["heady","exhilarating; intoxicating","Describes the experience, not the person — a heady atmosphere","gây lâng lâng, choáng ngợp"],["jocose","playful, given to joking","Neutral to positive","hay pha trò"],["jocund","cheerful and light-hearted","Literary register","vui tươi nhẹ nhõm"],["levity","lack of seriousness, lightness of manner","Often a mild criticism — levity at the wrong moment. Opposite of gravity","sự thiếu nghiêm túc"],["panache","flamboyant confidence of style","French. Originally a plume on a helmet","phong thái hào hoa"],["regale","to entertain, especially with talk","regaled us with stories. Also means to feast someone","chiêu đãi bằng chuyện kể"],["sanguine","optimistic, confident about the future","From the humour blood. Not the same as cheerful — sanguine is about expectation","lạc quan về kết cục"],["scintillating","brilliantly lively, sparkling","Usually of conversation or wit. From scintilla, a spark","lấp lánh sắc sảo"],["verve","energy and enthusiasm, especially in performance","Implies style, not just energy","khí lực đầy phong cách"],["vitality","energy and liveliness","The noun for the quality itself","sức sống"],["vivacious","lively and animated","From vivere, to live. Often of manner and conversation","hoạt bát sinh động"],["zealous","filled with eager devotion to a cause","Connects to zealot in cluster 10 — but zealous is the neutral-to-positive adjective, where zealot is a fanatic","nhiệt thành hết mình"]]},{"n":13,"t":"Gloom, bitterness, mourning","a":"Three sub-groups: embittered, grieving, appalling","w":[["abject","utterly wretched; also servile","Two senses. abject poverty is wretched; abject apology is grovelling","khốn khổ cùng cực; hèn hạ"],["bereave","to deprive of a loved one by death","The root of bereft","cướp đi người thân"],["bereft","deprived of something, especially by death","Takes of. The loss is the cause","mất mát, trống rỗng"],["crestfallen","dejected after a disappointment","Requires a prior hope — the image is a bird's crest dropping","ỉu xìu sau thất vọng"],["dirge","a mournful song for the dead","A song","khúc bi ai"],["dolorous","expressing great sorrow","Literary","não nề"],["elegy","a poem of serious reflection, typically a lament for the dead","A poem, and more meditative than a dirge","bài thơ bi ca"],["glum","dejected, sullen","Informal register","ỉu xìu rầu rĩ"],["hapless","unlucky, and pitiably so","The misfortune is undeserved — that is what separates it from unlucky","xui xẻo đáng thương"],["harrowing","acutely distressing","From the farm harrow, which tears up ground. Describes the experience","gây đau đớn day dứt"],["jaundiced","soured by resentment or cynicism","From the yellow of jaundice. a jaundiced view — the judgment is distorted by bitterness","nhìn đời chua chát"],["lament","(v) to mourn; (n) an expression of grief","Both parts of speech","than khóc; khúc ai ca"],["lugubrious","mournful in an exaggerated, gloomy way","Also negative: the mournfulness is overdone, often comically so","buồn thảm quá lố"],["macabre","disturbing, concerned with death","The subject matter is death","rùng rợn, ám ảnh cái chết"],["mawkish","sentimental in a sickly way","","uỷ mị đến phát ngán"],["misanthrope","one who hates humankind","The noun for the person","kẻ ghét loài người"],["misanthropic","hating humankind","The adjective","ghét loài người"],["misogynist","one who hates women","miso-, hate, same prefix","kẻ ghét phụ nữ"],["morose","sullen and ill-humoured","The plain word. Gloom with a closed door","cau có rầu rĩ"],["nostalgia","sentimental longing for the past","The object is always the past","nỗi hoài niệm"],["obsequy","a funeral rite","Usually plural, obsequies. Not obsequious, which means fawning","nghi lễ tang"],["plaintive","sounding sad and mournful","Describes a sound — a plaintive cry, a plaintive melody","nghe ai oán"],["poignant","evoking a keen sense of sadness, and moving","A compliment when applied to art. From pungere, to prick","chạm vào lòng, buồn mà đẹp"],["rue","(v) to regret bitterly","rue the day. Also a bitter herb","hối tiếc cay đắng"],["sardonic","mocking in a bitter, scornful way","The mockery is the point. From Sardinia, via a plant said to cause a rictus grin","cười khẩy cay đắng"],["saturnine","gloomy and taciturn by temperament","From the planet Saturn. A disposition, not a mood","u uất trầm mặc"],["sentimental","appealing to shallow emotion","The one negative here. It means the feeling is unearned","uỷ mị, tình cảm rẻ tiền"],["wistful","yearning with gentle sadness","Longing for something out of reach, and the longing is sweet","nhớ nhung man mác"],["woeful","full of sorrow; also lamentably bad","Second sense is common: a woeful performance means very poor","thê lương; tệ hại"]]},{"n":14,"t":"Soothing and relieving","a":"Largest synonym chain in the list: allay = assuage = mitigate = mollify = placate","w":[["affability","friendly, easy to talk to; the quality of being so","The noun is affability, the adjective affable. Warmth without familiarity","sự dễ gần, hoà nhã"],["allay","to diminish or put to rest","Takes fears and doubts as well as pain. allay concerns","làm dịu (lo sợ)"],["alleviate","to make suffering less severe","levis, light — to lighten. The plainest of these","làm giảm nhẹ (đau khổ)"],["ameliorate","to make a bad situation better","melior, better. Improves the situation, not just the feeling","cải thiện tình hình"],["analgesic","(n/adj) a painkiller","Specifically pain","thuốc giảm đau"],["anodyne","inoffensive to the point of saying nothing","","nhạt nhẽo vô thưởng vô phạt"],["appease","to pacify by giving in to demands","Carries the concession. Historically loaded — appeasement","xoa dịu bằng nhượng bộ"],["assuage","to make an unpleasant feeling less intense","Also means to satisfy — assuage hunger. Two uses","làm dịu (cảm giác)"],["beneficence","active kindness; doing good","bene + facere. The noun","lòng làm điều thiện"],["benign","gentle and kindly; also harmless","Two senses: a benign smile, a benign tumour","lành tính, hiền hoà"],["boon","a thing that is helpful and beneficial","A noun. a boon to farmers","điều lợi lớn"],["cathartic","providing emotional release","From Greek katharsis, purging","giải toả cảm xúc"],["coddle","to treat with excessive care","Negative. Over-protection","nuông chiều quá mức"],["commiserate","to express sympathy with someone","Does not fix anything — it is shared feeling, not intervention","chia buồn, đồng cảm"],["conciliatory","intended to overcome hostility","An adjective, describing a gesture or tone","nhằm làm hoà"],["convalescent","recovering from illness","Describes the person recovering, not the remedy","đang hồi phục"],["detente","an easing of hostility between states","French. Diplomatic register, usually of nations","sự hoà hoãn"],["emollient","(n/adj) softening; a skin-softening substance","Figuratively, an emollient remark softens a dispute","chất làm mềm"],["innocuous","harmless, causing no offence","in- + nocere, not to harm. About the absence of harm, not the presence of kindness","vô hại"],["magnanimity","generosity of spirit, especially toward a rival","magnus + animus, great soul. Implies you could have been harsh and were not","sự độ lượng với kẻ bại"],["mediate","to intervene between parties to produce agreement","The third party is the point","làm trung gian hoà giải"],["mollify","to soften someone's anger","mollis, soft. Emphasises softening","làm nguôi giận"],["nostrum","a quack remedy; a pet scheme offered as a cure-all","Latin: our own","thuốc lang băm; phương thuốc vạn năng giả"],["pacify","to bring peace to a person or a region","Two scales: you can pacify a child or a province","vỗ về, bình định"],["palliate","to relieve symptoms without curing the cause","The root of palliative care","giảm triệu chứng không chữa gốc"],["placate","to make someone less angry","The plain word","làm dịu cơn giận"],["propitiate","to win favour from someone offended, especially a deity","Implies an offering. More formal than the rest","làm nguôi lòng bằng lễ vật"],["reconcile","to restore friendly relations; also to make consistent","Two live senses — reconcile two people, or reconcile two accounts","hoà giải; làm cho khớp"],["remedial","intended to correct a deficiency","remedial classes. Fixing a shortfall","nhằm khắc phục thiếu sót"],["salubrious","health-giving","Usually of air, climate, surroundings","tốt cho sức khoẻ"],["salutary","producing a beneficial effect, often through being unpleasant","The twist: a salutary lesson is a useful one you did not enjoy","có ích dù khó chịu"],["solicitous","showing attentive concern","Can tip negative — solicitous to the point of fussing","quan tâm chu đáo"],["succor","(n/v) help given in time of distress","Old-fashioned register. came to their succor","sự cứu giúp lúc hoạn nạn"]]},{"n":15,"t":"Greed ↔ thrift ↔ waste ↔ poverty","a":"Four poles. Prodigal and profligate mean wasteful, not merely wandering","w":[["acquisitive","keen to gather possessions","The mildest of the greed words, and it can be neutral","ham thu gom"],["affluent","wealthy","Neutral","giàu có"],["avarice","extreme greed for wealth","The noun, and the strongest","lòng tham của cải"],["avaricious","greedy for money","The adjective","tham tiền"],["covet","to yearn to possess something belonging to another","The object belongs to someone else — that is the whole word","thèm muốn thứ của người"],["covetous","eagerly desirous of what another has","","thèm khát của người"],["destitute","entirely without money or resources","Stronger than impecunious","trắng tay, khốn cùng"],["exorbitant","unreasonably high, of a price","ex orbita, off the track","cao cắt cổ"],["exploitative","taking unfair advantage","Broader than money — labour, resources, people","bóc lột"],["extravagant","spending much more than needed","Also means exceeding reasonable bounds generally","tiêu xài quá mức"],["frugality","economy in spending","Positive or neutral. A virtue","sự tằn tiện đáng khen"],["gouge","to overcharge grossly","The verb for doing it to customers","chém đẹp, chặt chém"],["impecunious","having little money","im- + pecunia, money. Mildest — short of cash rather than destitute","túng thiếu"],["indigence","poverty, need","Formal register. the indigent = the poor","cảnh bần hàn"],["lavish","(adj) very generous or extravagant; (v) to give in abundance","Can be a compliment — lavish praise, a lavish production","hào phóng xa hoa; ban phát dồi dào"],["lucrative","producing a great deal of profit","Neutral to positive — a lucrative contract","sinh lợi lớn"],["lucre","money, especially when regarded as sordid","Negative, and almost always in filthy lucre","đồng tiền bẩn"],["mercenary","motivated solely by money","Also a noun: a soldier for hire","chỉ vì tiền; lính đánh thuê"],["miserly","hoarding money, unwilling to spend any","Strongly negative","hà tiện giữ khư khư"],["opportunistic","exploiting chances without regard to principle","About timing rather than money specifically","cơ hội chủ nghĩa"],["parsimonious","unwilling to spend; extremely sparing","Negative. Stinginess dressed as economy","keo kiệt"],["penurious","mean with money; also extremely poor","Two senses, and they conflict. See below","bủn xỉn; túng quẫn"],["penury","extreme poverty","The noun. Unlike penurious, it means only poverty","cảnh bần cùng"],["prodigal","recklessly wasteful","Not \"wandering.\" The prodigal son was wasteful, not lost. It also has a second sense: lavishly abundant","hoang phí"],["profligate","wasteful, and often dissolute","Adds moral looseness to the waste","phung phí và trác táng"],["rapacious","aggressively grasping","rapere, to seize. Implies predation, not just desire","tham lam cướp đoạt"],["remuneration","payment for work or services","Formal and neutral. Note the spelling — not renumeration","thù lao"],["spendthrift","a person who wastes money freely","A noun, where prodigal and profligate are adjectives","kẻ tiêu hoang"],["squander","to spend or use wastefully","The verb","phung phí"],["stinginess","unwillingness to give or spend","The plain noun where parsimony and penury are the formal ones","tính bủn xỉn"],["stinting","restricting supply; sparing","Usually in the negative: without stinting means generously","hạn chế, dè sẻn"],["usury","lending at unreasonably high interest","Historically a crime; now the term for predatory lending","cho vay nặng lãi"],["venal","open to bribery; corruptible","Not venial, which means a forgivable sin. A venal official takes money","có thể mua chuộc"]]},{"n":16,"t":"Deceit ↔ honesty","a":"Largest cluster after TRAP. Artless/ingenuous mean naive, not clumsy","w":[["artful","clever at attaining an end, often by deceit","TRAP: the opposite of artless. Artful = crafty; artless = innocent","tinh ranh, lắm mưu"],["artless","without guile; natural and sincere","TRAP: does not mean clumsy. The opposite of artful","chân chất, không mưu mẹo"],["beguile","to charm in a way that may deceive","Can be almost positive — beguiling is attractive","quyến rũ, có thể lừa"],["bogus","not genuine","Informal","giả mạo"],["candid","truthful and straightforward","Positive","thẳng thắn trung thực"],["candor","frankness; openness in speech","The noun of candid","sự thẳng thắn"],["chicanery","the use of trickery, especially legal or political","The noun for the whole practice","mánh khoé lươn lẹo"],["collude","to cooperate secretly for a deceitful purpose","Requires two or more parties","thông đồng"],["concoct","to devise or invent, often a story","Same root as cooking something up","bịa ra, pha chế"],["conspire","to plan together secretly to do something wrong","","âm mưu cùng nhau"],["counterfeit","a forged imitation","Physical objects — currency, goods","hàng giả"],["cozen","to trick or deceive","Archaic, literary","lừa gạt"],["crafty","cunning, skilled at deceiving","Plain word","xảo quyệt"],["cunning","skilled at achieving ends by deceit","","lắm mưu, ranh mãnh"],["deluded","holding a belief that is plainly false","Of the person, where delusion is the belief","đang ôm niềm tin sai"],["delusion","a false belief held despite evidence","The victim's state, not the deceiver's product","ảo tưởng sai lầm"],["devious","showing a skilful use of underhand tactics","de- + via, off the road","quanh co, lắt léo"],["disingenuous","insincere; feigning ignorance or innocence","The negative of ingenuous — it fakes the innocence","giả vờ ngây thơ"],["dissemble","to conceal one's true motives or feelings","Hiding what is there","che giấu tình cảm thật"],["distort","to misrepresent","","bóp méo"],["dupe","(n) one easily deceived; (v) to deceive","Both parts of speech","kẻ cả tin; lừa gạt"],["duplicitous","deceitful; saying one thing and doing another","duplex, twofold — two faces","hai mặt"],["fabricate","to invent, especially falsely","","bịa đặt"],["fallacious","based on a mistaken belief; logically unsound","The logic is faulty","ngụy biện, sai logic"],["feign","to pretend; to simulate","Displaying what is not there. The mirror of dissemble","giả vờ có"],["feint","a deceptive movement, especially in combat","From fencing. A mock attack","đòn nghi binh"],["fidelity","faithfulness; also accuracy of reproduction","Two senses","lòng trung thành; độ trung thực"],["frank","open and honest in speech","Can be blunt","thẳng thắn bộc trực"],["guileless","innocent, without cunning","","ngây thơ không mưu mẹo"],["gullible","easily deceived","The adjective for the disposition","cả tin dễ bị lừa"],["hypocrite","one who professes beliefs they do not hold","The gap is between stated and actual conviction","kẻ đạo đức giả"],["illusory","seeming real but having no substance","The appearance was never real in the first place","tưởng thật mà không có thực"],["implausible","not believable","Note the difference from specious: implausible fails on sight; specious passes","khó tin"],["ingenuous","innocent and unsuspecting","TRAP: not ingenious, which means clever","ngây thơ cả tin"],["insidious","proceeding harmfully in a gradual, concealed way","The stealth and the gradualness are the point. Often of diseases and influences","hại ngầm không ai hay"],["intrigue","(n) secret plotting; (v) to plot, or to fascinate","Two verb senses — the fascination sense is unrelated to deceit","mưu đồ; làm tò mò"],["inveigle","to persuade by deception or flattery","Takes into — inveigle someone into doing something","dụ dỗ bằng mẹo"],["machiavellian","cunning and unscrupulous in politics","From Machiavelli. Political register","xảo quyệt trong chính trị"],["machinations","scheming plots","Usually plural, and sinister","những mưu đồ đen tối"],["malinger","to feign illness to avoid work","Very specific, and it comes up","giả bệnh trốn việc"],["mendacious","lying, habitually dishonest","About a person or statement, and it means actually untrue","dối trá quen thói"],["mendacity","untruthfulness","The noun","tính giả dối"],["meretricious","showily attractive but of no real value","From meretrix, a prostitute — flashy and hollow","loè loẹt mà rỗng"],["naive","lacking experience or judgment","Not a moral fault; just untested","ngây thơ thiếu kinh nghiệm"],["perfidious","deliberately faithless, treacherous","Betrayal of trust is the specific element","phản trắc"],["perfidy","treachery; deliberate breach of faith","The noun of perfidious","sự phản bội"],["phony","not genuine","Informal","đồ giả"],["ploy","a cunning manoeuvre to gain advantage","More strategic than a ruse","nước cờ mưu mẹo"],["poseur","one who pretends to be what they are not","The deceiver, not the victim — listed here because it is the flip side","kẻ ra vẻ"],["pretense","a false show intended to deceive","Also spelled pretence","sự giả vờ"],["prevaricate","to speak evasively; to avoid the truth","Not quite lying — it is dodging","nói vòng né sự thật"],["probity","complete honesty and integrity","Formal and strong. The noun for incorruptibility","sự liêm chính"],["ruse","a trick intended to deceive","","mưu mẹo đánh lừa"],["sham","a thing that is not what it purports to be","Also an adjective","đồ giả hiệu"],["skullduggery","underhand behaviour","Informal, faintly comic","trò khuất tất"],["specious","superficially plausible but actually wrong","Learn this one cold. A specious argument survives a glance and not scrutiny","nghe xuôi tai mà sai"],["spurious","not genuine; false","Of claims, correlations, documents","giả, không xác thực"],["subterfuge","a trick used to avoid something or conceal a purpose","From sub + fugere, to flee under","mưu mẹo lẩn tránh"],["swindle","to cheat out of money","Money specifically","lừa lấy tiền"],["unfeigned","genuine, not pretended","The negative of feign","chân thật không giả"],["unscrupulous","having no moral principles","About the absence of restraint, not skill at deceiving","bất chấp đạo lý"],["veracious","speaking truthfully","Not voracious, which means ravenously hungry","nói thật"],["veracity","conformity to truth; truthfulness","Of statements and people","tính chân thực"],["wily","full of guile and tricks","","lắm mưu ma chước quỷ"]]},{"n":17,"t":"Abundance ↔ scarcity","a":"Includes the variety sub-axis: multifarious, motley, eclectic","w":[["abound","to exist in large numbers","The verb, intransitive: errors abound","có rất nhiều"],["all-encompassing","including everything, leaving nothing out","","bao trùm tất cả"],["burgeon","to begin to grow rapidly; to flourish","burgeon is to bud. Implies a beginning","đâm chồi, bùng phát"],["burgeoning","growing rapidly","The adjective","đang phát triển nhanh"],["copious","abundant, plentiful","The plain word. copious notes","dồi dào"],["cornucopia","an abundant supply of good things","From the horn of plenty. Always positive","sừng đầy ắp của cải"],["dearth","a scarcity or lack","The standard antonym of plethora","sự khan hiếm"],["diminutive","very small","Often of people, and can be affectionate","bé tí"],["dispense","to distribute; also to administer","TRAP: dispense with means to do without, which is nearly the opposite","phân phát; miễn trừ"],["disperse","to scatter in different directions","Physical scattering, and it implies the group breaks up","phân tán"],["disseminate","to spread widely, especially information","semen, seed — scattering seeds. Ideas and information","phổ biến rộng rãi"],["eclectic","drawing from a wide range of sources","Positive or neutral, and it implies deliberate selection","chắt lọc từ nhiều nguồn"],["ecumenical","universal in scope; promoting unity across groups","Not only religious: ecumenical in its appeal","bao trùm rộng khắp"],["exiguous","scanty; meagre in amount","Formal register","ít ỏi"],["fecund","highly fertile, producing abundantly","Biological or creative","phì nhiêu, sai quả"],["fruitful","producing good results","About outcome, not quantity","cho kết quả tốt"],["hodgepodge","a confused mixture","Negative. Disorder is the point","mớ hổ lốn"],["inundate","to flood; to overwhelm with a quantity","unda, wave. The recipient is overwhelmed","làm ngập tràn"],["lilliputian","tiny","From Swift's Lilliput. Can imply pettiness as well as smallness","tí hon"],["meager","too small in quantity to be adequate","Also spelled meagre","ít ỏi không đủ"],["minuscule","extremely small","Note the spelling — from minus, not mini","cực nhỏ"],["minutia","a trivial detail","Usually plural, minutiae. It means small in importance, not small in number","chi tiết vụn vặt"],["miscellany","a collection of varied items","The noun for the collection","tuyển tập tạp"],["modicum","a small quantity of something desirable","a modicum of sense. Always of something you would want more of","một chút ít"],["motley","made up of varied and often incongruous parts","Implies mismatch — a motley crew. Originally the jester's parti-coloured cloth","chắp vá không ăn nhập"],["multifaceted","having many aspects","Usually of a problem or a person","nhiều mặt"],["multifarious","having great variety","The formal word for many-kinds","đa dạng nhiều loại"],["myriad","a very large number","From the Greek for ten thousand","vô số"],["paucity","smallness of number or quantity","Formal. a paucity of evidence","sự ít ỏi"],["plethora","an excess; an overabundance","Strictly it means too many, though loose usage has softened it. On the GRE, take the excess sense","sự thừa mứa"],["prodigious","remarkably large in extent or degree","Impressiveness is built in. Not merely a lot — enough to astonish","to lớn đáng kinh ngạc"],["profuse","plentiful, poured out freely","profuse apologies — the freeness is the point","tuôn ra dồi dào"],["proliferate","to increase rapidly in number","Reproduction or multiplication is the image","sinh sôi nhanh"],["propagate","to spread and multiply; to transmit","Used of plants, ideas, and signals","nhân rộng, truyền đi"],["rampant","flourishing unchecked and out of control","Negative: nothing good is ever described this way","lan tràn không kiểm soát"],["replenish","to fill up again","Restoring what was depleted, not adding beyond","bổ sung lại cho đầy"],["saturate","to soak thoroughly; to fill until no more can be absorbed","Also figurative: a market saturated with competitors","làm bão hoà, thấm đẫm"],["scant","barely sufficient","Also a verb: to scant something is to skimp on it","ít ỏi vừa đủ"],["scarcity","a shortage of something needed","The plain noun","sự thiếu hụt"],["sparse","thinly scattered","Distribution as well as amount — sparse population","thưa thớt"],["sundry","various, of different kinds","Usually sundry items, all and sundry","linh tinh đủ loại"],["welter","a confused mass; a turmoil","Negative, and it implies you cannot see through it","mớ hỗn độn"]]},{"n":18,"t":"Increase ↔ decrease","a":"Direction only. Pair with 19 for magnitude of harm","w":[["abate","to lessen in intensity","Works both transitively and intransitively — the storm abated","dịu đi, giảm bớt"],["abridge","to shorten a text while keeping its substance; to curtail a right","Two senses, and the legal one appears in constitutional passages","lược bớt; hạn chế (quyền)"],["accentuate","to make more noticeable","Emphasis, not size — accentuate a feature","làm nổi bật"],["accretion","growth by gradual accumulation of layers","The noun, and the image is geological","sự bồi tụ từng lớp"],["accrue","to accumulate over time, especially benefits or interest","Gradual and automatic — interest accrues","tích luỹ dần"],["aggrandize","to increase power, wealth, or status","Usually negative, and often reflexive: self-aggrandizing","phóng đại quyền lực bản thân"],["amplify","to increase in volume or extent; to expand on","Two senses — amplify a signal, or amplify a remark by explaining it","khuếch đại"],["apogee","the highest point","Astronomically, the point furthest from Earth","điểm viễn địa; đỉnh điểm"],["attenuate","to make thinner or weaker","tenuis, thin. Weakening by thinning, often of a signal or an effect","làm mỏng, làm yếu đi"],["augment","to make greater by adding","The plain word","tăng thêm"],["bolster","to support or strengthen","Originally a cushion. Props something up","chống đỡ, củng cố"],["buttress","to strengthen, especially an argument","From architecture — the external support on a wall","chống đỡ (lập luận)"],["crescendo","a gradual increase in loudness","TRAP: strictly the increase, not the peak. \"Reached a crescendo\" is common and disputed","sự to dần"],["curtail","to cut short; to reduce","Cutting something off before its full extent — curtail a visit","cắt ngắn lại"],["distend","to swell from internal pressure","Physical and usually unpleasant — a distended stomach","phình trương"],["dwindling","steadily shrinking","The adjective, and it implies gradual loss","teo dần"],["enhance","to improve in quality or value","Quality, not quantity. Enhancing something makes it better, not bigger","nâng cao chất lượng"],["escalate","to increase rapidly, especially a conflict","Implies a spiral — escalating tensions","leo thang"],["exacerbate","to make a bad situation worse","The object must already be bad. You cannot exacerbate a success","làm tình hình xấu thêm"],["mitigate","to make a bad thing less severe","The mirror. Also legal: mitigating circumstances","làm giảm nhẹ điều xấu"],["nadir","the lowest point","Astronomical: the point directly underfoot. Both are Arabic in origin","điểm thấp nhất"],["outstrip","to surpass; to grow faster than","The odd one — this is increase, but relative: demand outstrips supply","vượt lên trên"],["plummet","to fall steeply and suddenly","Speed and steepness are the point","rơi thẳng đứng"],["regress","to return to an earlier, worse state","Backwards, not merely smaller","thụt lùi về trạng thái cũ"],["retrench","to reduce spending or scale back","Financial and organizational — a company retrenches","cắt giảm chi tiêu"],["subside","to become less intense; to sink","Of floodwater, noise, anger, swelling","lắng xuống"],["transcend","to go beyond the limits of","Not a quantity word — it means exceeding a category, not a number","vượt lên trên giới hạn"],["underscore","to emphasise; to make more evident","Literally to underline. Emphasis, not strength","nhấn mạnh"],["wane","to decrease gradually","From the moon. Its pair is wax — the GRE uses the phrase wax and wane","tàn dần như trăng khuyết"],["zenith","the highest point","Astronomical: the point directly overhead","đỉnh điểm"]]},{"n":19,"t":"Weakening, harm, destruction","a":"Enervate means to drain, not to energize","w":[["abysmal","extremely bad","Usually not about sadness at all — an abysmal result is simply terrible","tệ hại cùng cực"],["adverse","unfavourable, working against you","Not averse, which means unwilling","bất lợi"],["blighted","spoiled or ruined, especially by decay","","tàn lụi, hư hoại"],["calamitous","causing great damage or distress","","tai hại"],["cataclysm","a violent upheaval or disaster","The noun","biến động dữ dội"],["cataclysmic","violently destructive, changing everything","","huỷ diệt, đảo lộn tất cả"],["catastrophic","involving sudden great damage","","thảm khốc"],["conflagration","a large destructive fire","Also used of a war","đám cháy lớn"],["debase","to reduce in quality or value","Originally of coinage","làm giảm giá trị"],["debilitating","causing weakness and loss of strength","","làm suy nhược"],["deleterious","causing harm, especially gradually","Formal register; often of effects","gây hại dần dần"],["desiccate","to dry out completely","Figuratively: to drain of vitality","làm khô kiệt"],["deteriorate","to become progressively worse in quality or condition","No agent needed, unlike impair or vitiate. A building, a relationship or a condition deteriorates by itself","xuống cấp, tệ dần đi"],["detrimental","causing damage or harm","","gây hại"],["devastating","causing severe damage; emotionally shattering","Of events and of criticism. A devastating review leaves nothing standing","tàn phá; choáng người"],["dismantle","to take apart piece by piece","","tháo dỡ từng phần"],["dross","worthless residue; rubbish","Originally the scum on molten metal","cặn bã vô giá trị"],["effete","worn out, no longer able to produce","Not effeminate, though often misused so","kiệt sức, hết sức sáng tạo"],["egregious","outstandingly bad","Once meant outstandingly good; that sense is dead","tệ đến mức nổi bật"],["emaciated","abnormally thin from hunger or illness","","gầy trơ xương"],["enervate","to drain of energy","TRAP: does not mean to energize","rút cạn sinh lực"],["enfeeble","to make weak","The verb of feeble","làm cho yếu đi"],["eradicate","to destroy completely, root and branch","From radix, root","nhổ tận gốc"],["execrable","utterly detestable, extremely bad","The most extreme adjective here","tệ đến mức đáng nguyền rủa"],["extirpate","to root out and destroy entirely","Stronger and more formal than eradicate","tiêu diệt tận gốc"],["feeble","weak, lacking strength","","yếu ớt"],["fester","to worsen while left untreated","Of wounds and of resentments","mưng mủ; âm ỉ tệ thêm"],["fiasco","a complete and humiliating failure","Italian, and faintly comic","thất bại ê chề"],["frailty","weakness of body or of character","","sự yếu đuối"],["futile","pointless, incapable of success","","vô ích"],["impair","to weaken or damage the function of","","làm suy giảm chức năng"],["jeopardize","to put at risk","","đặt vào vòng nguy hiểm"],["malignant","very harmful; actively malevolent","Medical and moral. The opposite of benign in both senses","độc hại; hiểm độc"],["neutralize","to render ineffective","","vô hiệu hoá"],["noxious","harmfu ed horizontal band along a wall","","dải trang trí ngang tường"],["hieroglyphic","written in pictorial characters; hard to decipher","Two senses","chữ tượng hình; khó giải"],["incarnate","embodied in flesh; personified","Evil incarnate","hiện thân bằng xương thịt"],["menagerie","a collection of wild animals; a varied assortment","Second sense is figurative","bầy thú tạp; đám hỗn tạp"],["mnemonic","a device that aids memory","","mẹo giúp nhớ"],["necromancy","communication with the dead; black magic","","thuật gọi hồn"],["neologism","a newly coined word","","từ mới đặt ra"],["onomatopoeia","a word that imitates the sound it denotes","","từ tượng thanh"],["patois","a regional dialect of the common people","","phương ngữ bình dân"],["phoenix","a mythical bird reborn from its own ashes","","phượng hoàng tái sinh"],["preamble","an introductory statement","From pre + ambulare, walking before","lời mở đầu"],["preternatural","beyond what is natural; uncannily exceptional","","siêu phàm khác thường"],["puissant","powerful","Archaic and literary","hùng mạnh"],["rebus","a puzzle in which pictures stand for words","","câu đố bằng hình"],["reprise","a repeated passage or performance","","đoạn tái hiện"],["rococo","elaborately ornate, of eighteenth-century style","Often used dismissively","rườm rà kiểu rococo"],["rubric","a heading or set of rules governing conduct","Originally written in red ink","tiêu đề; bộ quy tắc"],["schematic","presented as a simplified diagram or outline","","dạng sơ đồ giản lược"],["simile","a comparison using like or as","Contrast metaphor, which omits them","phép so sánh có như"],["staccato","made up of short sharp detached sounds","From music; used of speech too","ngắt quãng gọn từng tiếng"],["stygian","extremely dark and gloomy","From the river Styx","tối tăm âm u"],["sylvan","relating to woods and forests","","thuộc rừng cây"],["syntactical","relating to the arrangement of words in a sentence","Also spelled syntactic. Of grammar, not of meaning","thuộ

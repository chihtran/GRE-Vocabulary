<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GRE Vocabulary Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFCF8; --paper2:#F1F3EC; --contour:#CEC5AE; --contour2:#A2957A;
  --ink:#1F2320; --ink2:#5C6459; --route:#3A6480; --route-l:#6F97AE;
  --learn:#C08A3E; --solid:#4E7346; --weak:#A8453A;
  --rule:#E4E6DA;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){@media (prefers-color-scheme:dark){
  --paper:#161A19; --paper2:#1E2422; --contour:#3A4440; --contour2:#4E5A54;
  --ink:#E4E7E0; --ink2:#9AA49B; --route:#7FAAC6; --route-l:#4A6C82;
  --learn:#D6A055; --solid:#6E9A63; --weak:#C4655A; --rule:#2C3330;
}}
:root[data-theme="dark"]{
  --paper:#161A19; --paper2:#1E2422; --contour:#3A4440; --contour2:#4E5A54;
  --ink:#E4E7E0; --ink2:#9AA49B; --route:#7FAAC6; --route-l:#4A6C82;
  --learn:#D6A055; --solid:#6E9A63; --weak:#C4655A; --rule:#2C3330;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"Source Serif 4",Georgia,serif;font-size:17px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.lab{font-family:"Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.02em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--route);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* shell */
.wrap{max-width:860px;margin:0 auto;padding:0 18px 90px}
header.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);
  border-bottom:1px solid var(--rule);margin:0 -18px 22px;padding:14px 18px 11px;
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
}
.brand{font-family:"Barlow Condensed",sans-serif;font-size:26px;font-weight:600;line-height:1.05;letter-spacing:.01em}
.alt{font-family:"Barlow Condensed",sans-serif;font-size:15px;color:var(--ink2);margin-left:auto}
.alt b{color:var(--ink);font-weight:600}

/* profile */
.profile{position:relative;margin:4px 0 26px}
.profile svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-family:"Barlow Condensed",sans-serif;font-size:14px;color:var(--ink2);margin-top:2px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:baseline}

/* stations */
.bands{display:flex;flex-direction:column;gap:2px}
.bandhead{font-family:"Barlow Condensed",sans-serif;font-size:14px;color:var(--contour2);
  border-bottom:1px solid var(--rule);padding:16px 0 4px;margin-bottom:6px}
.st{
  display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;
  width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);
  padding:11px 2px;
}
.st:hover .sn{color:var(--route)}
.sn{font-family:"Barlow Condensed",sans-serif;font-size:19px;color:var(--contour2);font-variant-numeric:tabular-nums}
.stt{display:block;font-family:"Barlow Condensed",sans-serif;font-size:18px;line-height:1.2}
.sax{display:block;font-size:13.5px;color:var(--ink2);line-height:1.4;margin-top:3px}
.meter{width:96px}
.meter .bar{height:5px;background:var(--paper2);border-radius:3px;overflow:hidden;display:flex}
.meter .bar span{display:block;height:100%}
.meter .cap{font-family:"Barlow Condensed",sans-serif;font-size:12.5px;color:var(--ink2);text-align:right;margin-top:3px;font-variant-numeric:tabular-nums}
.locked .stt,.locked .sn{color:var(--contour)}

/* cluster */
.back{font-family:"Barlow Condensed",sans-serif;background:none;border:0;padding:6px 0;color:var(--route);font-size:16px}
h2.ct{font-family:"Barlow Condensed",sans-serif;font-size:31px;font-weight:600;margin:6px 0 2px;line-height:1.05}
.cax{color:var(--ink2);font-size:15px;margin:0 0 18px;max-width:62ch}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.btn{font-family:"Barlow Condensed",sans-serif;font-size:17px;padding:9px 20px;border:1px solid var(--ink);
  background:none;border-radius:2px}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.wlist{border-top:1px solid var(--rule)}
.wrow{display:grid;grid-template-columns:10px 1fr;gap:12px;padding:10px 2px;border-bottom:1px solid var(--rule);align-items:baseline}
.dot{width:9px;height:9px;border-radius:50%;background:var(--paper2);margin-top:7px}
.wd{display:block;font-family:"Barlow Condensed",sans-serif;font-size:19px;line-height:1.25}
.wdef{display:block;font-size:15px;color:var(--ink2);margin-top:2px;line-height:1.45}
.wrow>span>span{display:block}
.wnote{display:block;font-size:13.5px;color:var(--contour2);margin-top:4px;line-height:1.4}

/* card */
.card{border:1px solid var(--rule);background:var(--paper2);border-radius:3px;padding:30px 24px;min-height:230px;
  display:flex;flex-direction:column;justify-content:center;text-align:center;margin-bottom:16px}
.cw{font-family:"Barlow Condensed",sans-serif;font-size:42px;line-height:1.05}
.cd{display:block;font-size:19px;margin-top:14px;max-width:46ch;margin-left:auto;margin-right:auto}
.cn{display:block;font-size:14.5px;color:var(--ink2);margin-top:12px;max-width:50ch;margin-left:auto;margin-right:auto}
.hint{font-family:"Barlow Condensed",sans-serif;color:var(--ink2);font-size:15px}
.prog{font-family:"Barlow Condensed",sans-serif;font-size:14px;color:var(--ink2);margin-bottom:10px;font-variant-numeric:tabular-nums}

/* quiz */
.qp{font-size:19px;margin:6px 0 18px;max-width:58ch}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.opt{font-family:"Barlow Condensed",sans-serif;font-size:19px;text-align:left;padding:12px 15px;
  border:1px solid var(--rule);background:var(--paper2);border-radius:2px}
.opt:hover:not(:disabled){border-color:var(--route)}
.opt.right{border-color:var(--solid);background:color-mix(in srgb,var(--solid) 12%,var(--paper2))}
.opt.wrong{border-color:var(--weak);background:color-mix(in srgb,var(--weak) 12%,var(--paper2))}
.fb{border-left:3px solid var(--route);padding:2px 0 2px 14px;font-size:15.5px;color:var(--ink2);margin-bottom:16px}
.fb b{color:var(--ink);font-family:"Barlow Condensed",sans-serif;font-size:18px}
.why{border-top:1px solid var(--rule);padding-top:10px;margin-bottom:16px}
.whyh{display:block;color:var(--contour2);font-size:14px;margin-bottom:6px}
.wl{font-size:14.5px;color:var(--ink2);margin-bottom:4px}
.wl b{font-family:"Barlow Condensed",sans-serif;font-size:17px;color:var(--ink);margin-right:6px}
.opt.picked{border-color:var(--route);background:color-mix(in srgb,var(--route) 10%,var(--paper2))}
.blank{border-bottom:1.5px solid var(--route);padding:0 2px;color:var(--route)}
.blab{color:var(--contour2);font-size:14px;margin:12px 0 5px}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-family:"Barlow Condensed",sans-serif;font-size:15px;color:var(--ink2);margin-bottom:4px}
.field textarea,.field input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper2);
  border:1px solid var(--rule);border-radius:2px;padding:9px 11px;resize:vertical}
.field textarea{min-height:72px;line-height:1.45}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.seg button{font-family:"Barlow Condensed",sans-serif;font-size:16px;padding:7px 14px;border:1px solid var(--rule);
  background:var(--paper2);border-radius:2px}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.orow{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:center;margin-bottom:6px}
.mark{font-family:"Barlow Condensed",sans-serif;font-size:14px;width:34px;padding:6px 0;border:1px solid var(--rule);
  background:var(--paper2);border-radius:2px;text-align:center}
.mark.on{background:var(--solid);color:var(--paper);border-color:var(--solid)}
.note{font-size:14px;color:var(--ink2);margin:-6px 0 14px;line-height:1.45}
.err{color:var(--weak);font-size:14.5px;margin-bottom:12px}
.tag{font-family:"Barlow Condensed",sans-serif;font-size:12.5px;color:var(--route);border:1px solid var(--route);
  border-radius:2px;padding:1px 6px;margin-left:8px}
.del{font-family:"Barlow Condensed",sans-serif;background:none;border:0;color:var(--weak);font-size:14px;padding:0}
.tbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:15;background:var(--paper);
  border-bottom:1px solid var(--rule);margin:0 -18px 16px;padding:9px 18px;display:flex;align-items:center;gap:14px}
.clock{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-variant-numeric:tabular-nums}
.clock.low{color:var(--weak)}
.tmeta{font-family:"Barlow Condensed",sans-serif;font-size:14px;color:var(--ink2);margin-left:auto}
.nav{display:flex;flex-wrap:wrap;gap:4px;margin:16px 0 20px}
.nav button{font-family:"Barlow Condensed",sans-serif;font-size:13px;width:29px;height:29px;padding:0;
  border:1px solid var(--rule);background:var(--paper2);border-radius:2px;font-variant-numeric:tabular-nums}
.nav button.ans{background:var(--route);color:var(--paper);border-color:var(--route)}
.nav button.here{outline:2px solid var(--ink);outline-offset:1px}
.rev{border-bottom:1px solid var(--rule);padding:14px 0}
.rev .rq{font-size:16px;line-height:1.5;margin-bottom:8px}
.rev .ra{font-family:"Barlow Condensed",sans-serif;font-size:15.5px;margin-bottom:3px}
.rev .ra.bad{color:var(--weak)}
.rev .ra.good{color:var(--solid)}
.rev .re{font-size:14.5px;color:var(--ink2);line-height:1.45;margin-top:5px}
.big{font-family:"Barlow Condensed",sans-serif;font-size:56px;line-height:1;margin:6px 0 2px}

.empty{color:var(--ink2);padding:26px 0;max-width:56ch}
footer{border-top:1px solid var(--rule);margin-top:34px;padding-top:12px;
  font-family:"Barlow Condensed",sans-serif;font-size:14px;color:var(--contour2);
  display:flex;gap:16px;flex-wrap:wrap}
footer button{background:none;border:0;color:var(--contour2);padding:0;text-decoration:underline}
@media(max-width:560px){
  .brand{font-size:22px}
  .alt{margin-left:0;width:100%}
  .cw{font-size:34px}.meter{width:72px}h2.ct{font-size:26px}
  .st{grid-template-columns:28px 1fr auto;gap:9px}
}
</style>
</head>
<body>
<div class="wrap">
<header class="top">

<main id="app"></main>
<footer>
  <span id="sync">Progress saves in this browser</span>

  <button id="impBtn">Import</button>

</footer>

ed objection, not abuse"],["reproach","express disapproval or disappointment","Carries hurt, not rage. above reproach"],["scathing","severely critical","a scathing review"],["stricture","a severe criticism; also a restriction","Two senses — check context"],["tirade","a long angry speech","A thing produced, like diatribe"],["vituperative","bitter and abusive","The adjective for invective"]]},{"n":5,"t":"Irritability and fault-finding","a":"Bad temper plus the habit of picking at small faults","w":[["abrasive","harsh in manner, wearing to deal with","Metaphor from sandpaper"],["asperity","(n) harshness of tone or manner","replied with some asperity"],["boorish","crude, ill-mannered","Implies coarseness. From boor, a peasant"],["cantankerous","bad-tempered and argumentative","Faintly comic; usually of the old"],["captious","given to raising trivial objections","The adjective for the person"],["carping","persistently petty in criticism","Often a noun: tired of his carping"],["churlish","rude and mean-spirited","Implies meanness, not just rudeness"],["curmudgeon","(n) a bad-tempered person","The noun for the type"],["discomfit","to unsettle or disconcert someone","TRAP: not discomfort. To throw someone off balance"],["finicky","excessively fussy about detail","Broader — applies to taste and habits too"],["fractious","irritable and difficult to control","Often of groups: a fractious coalition"],["gaffe","(n) a social blunder","The event, not the person"],["gauche","socially awkward, tactless","French for left. Awkwardness, not malice"],["gawky","physically awkward, ungainly","Physical, where gauche is social"],["grievance","(n) a real or supposed ground for complaint","The grounds, not the complaining"],["grouse","complain, gripe","Also a trap word — the bird, and the verb"],["grumble","complain in a low, muttering way","Audible but not confrontational"],["impertinent","not showing proper respect","TRAP: also means irrelevant — the opposite of pertinent"],["impudent","boldly disrespectful, cheeky",""],["insolent","openly contemptuous of authority","The strongest of the three"],["irascible","quick to anger","The plainest word for a short fuse"],["irksome","causing annoyance, tiresome","Describes the task, not the person"],["jibe","(n/v) an insulting or mocking remark","Also spelled gibe. Not jibe with = to agree"],["nettlesome","causing irritation or difficulty","Same direction. From nettle"],["obstreperous","noisily and aggressively unruly","The noise is part of it"],["petulant","childishly sulky or bad-tempered","The childish quality is the point"],["pique","(n) resentment from wounded pride · (v) to stimulate","Dual sense. in a fit of pique but also piqued my interest"],["querulous","habitually complaining, whining","Complaint as a permanent tone of voice"],["quibble","(v/n) raise a trivial objection","The specific act"],["raillery","good-humoured teasing","Milder and often affectionate — the friendliest word in the cluster"],["repine","fret or complain discontentedly","Formal, literary. Often repine at"],["restive","restless and resistant to control","Impatience under restraint, not anger"],["truculence","aggressive defiance; readiness to fight","From trux, fierce"],["truculent","aggressively defiant, belligerent","Stronger than the rest — this is hostility, not irritability"],["vexation","(n) the state of being annoyed","The feeling, in the person affected"]]},{"n":6,"t":"Talkative ↔ concise","a":"Two poles: garrulous/prolix/voluble vs laconic/terse/pithy","w":[["banter","light, playful exchange","Positive. Compare raillery in cluster 05"],["brevity","(n) shortness","The neutral noun"],["expatiate","speak or write at length on a subject","Neutral. Expatiate on a topic"],["extemporaneous","spoken without preparation","ex tempore, out of the moment"],["extemporize","(v) to improvise",""],["garrulous","talkative, especially about trivia","Stronger and more negative than loquacious — the content is worthless"],["glib","fluent but shallow or insincere","TRAP: negative. Not merely smooth — it implies the ease conceals a lack of substance or honesty"],["laconic","using very few words","From Laconia (Sparta). Describes the utterance, not the person's temperament"],["litany","a long, repetitive recital","Originally a liturgical prayer with repeated responses. Now usually a litany of complaints — the repetition and the tedium are the point"],["loquacious","talkative","The plainest word. Mildly negative"],["pithy","brief and full of meaning","Positive. Brevity plus substance. From pith, the core"],["prate","talk foolishly at length",""],["prattle","chatter idly, like a child",""],["prolix","tediously lengthy","Near-identical to verbose. Both judge the text, not the speaker"],["raconteur","a skilled, entertaining storyteller","Positive. French"],["ramble","talk at length without direction","The problem is structure, not volume"],["recapitulate","summarize the main points again","Not simple repetition — it restates in condensed form. Recap"],["reiterate","say again","re- + iterate, to repeat"],["reticent","reserved; unwilling to speak about something","A choice about a specific matter, not a general trait"],["riposte","a quick, sharp retort","From fencing — the counter-thrust after a parry"],["taciturn","habitually silent, uncommunicative","A permanent trait. From tacere, to be silent — cf. tacit"],["terse","brief and to the point","Can tip into curt — the one word here that may be negative"],["verbose","using more words than needed",""],["voluble","speaking fluently and at length","Not necessarily negative. From volvere, to roll — the words roll out easily"]]},{"n":7,"t":"Inflated and empty language","a":"Two diseases of speech: swollen (bombastic, florid) and hollow (banal, vapid)","w":[["affectation","behaviour adopted to impress","An assumed manner, not a natural one"],["aphorism","a short pointed saying containing a truth","POSITIVE. A real insight, briefly put"],["apothegm","a terse instructive saying","Near-twin of aphorism. Also positive"],["banal","commonplace, unoriginal","The plainest word here"],["bombastic","inflated, pompous in speech","From bombast, cotton padding used to stuff clothing. The image is padding"],["bravado","a show of boldness meant to impress","The boldness is display, not courage — that is the whole word"],["bromide","a trite, soothing remark","Originally a sedative — a phrase administered to calm rather than inform"],["cant","insincere pious or moralistic talk; also, jargon of a group","Two live senses. Also a trap word — see cluster 47"],["derivative","unoriginal, copied from elsewhere","TRAP: the everyday maths sense is irrelevant. This is a criticism"],["doggerel","crude, badly made verse","The verse-specific word"],["egoism","the doctrine or habit of self-interest","Note: egoism ≠ egotism. Egoism is philosophical; egotism is talking about yourself"],["egotistical","excessively self-referential","The everyday one"],["fatuous","silly and self-satisfied","Foolishness plus complacency — that combination is the word"],["flamboyant","showy, extravagant","From flame — flame-shaped"],["florid","ornate, elaborately decorated","flos, flower. Also means flushed red in the face"],["fulsome","excessive to the point of insincerity","TRAP: does not mean \"full\" or \"generous.\" Fulsome praise is praise that has become unpleasant"],["gloat","to dwell on your own success or another's failure","The satisfaction in another's loss is the distinguishing part"],["grandiloquent","using lofty, extravagant language","grand + loqui, to speak"],["hackneyed","worn out by overuse","From hackney, a horse hired out until exhausted"],["haughty","arrogantly superior","From haut, high"],["homily","a moralizing lecture; a sermon","Not necessarily hollow, but usually used dismissively"],["humdrum","monotonous, dull",""],["insipid","dull, without flavour or interest","Literally tasteless — in- + sapidus, flavourful"],["megalomania","delusion of one's own power or greatness","The extreme end"],["monotonous","unvarying, tediously uniform","mono + tonos, one tone"],["mundane","ordinary, of the everyday world","mundus, world. Less pejorative than banal"],["narcissism","excessive self-admiration",""],["ornate","heavily decorated","Neutral for architecture, negative for prose"],["ostentatious","showily displaying wealth or knowledge","ostendere, to show. The display is the point"],["overweening","arrogant, presumptuous","overweening ambition"],["platitude","a flat, overused remark offered as insight","The commonest word in this group"],["pomposity","self-important solemnity",""],["ponderous","heavy, laboured, dull","pondus, weight. Prose that moves slowly under its own mass"],["posturing","adopting a stance for effect","Behaviour rather than speech"],["presumptuous","overstepping what is warranted","Taking a liberty you have not earned"],["pretentious","claiming more importance than is warranted",""],["prosaic","dull, unimaginative","From prose — the opposite of poetic"],["sanctimonious","making a show of moral superiority","The adjective that goes with cant"],["sensational","designed to excite or shock","TRAP: in GRE register this is negative — sensational journalism, not \"excellent\""],["tautology","saying the same thing twice in different words","a free gift, an added bonus"],["tedious","tiresome through length or dullness",""],["tumid","swollen; inflated in style","Same root as tumour. Near-twin of turgid"],["turgid","swollen; pompously overblown","Literally swollen (a turgid river). Watch: turgid ≠ turbid, which means muddy"],["vacuous","empty of thought","vacuus, empty. Vacuous is about the mind; vapid about the effect"],["vapid","offering nothing of interest","From vapidus, flat, of wine that has lost its sparkle"],["vaunt","to boast about","a much-vaunted reform — often ironic"]]},{"n":8,"t":"Clear ↔ obscure ↔ evasive","a":"Three tiers, not two. Evasion is deliberate obscurity","w":[["abstruse","hard to understand","abs- + trudere, to push away"],["accessible","easy to approach or understand","Of writing, implies no specialist knowledge needed"],["ambiguous","open to more than one interpretation","May or may not be deliberate — the one word here that can be innocent"],["arcane","mysterious, known to few","arca, a chest — knowledge kept in a box"],["articulate","(adj) expressing oneself clearly · (v) to express","Dual part of speech, and the verb also means to connect at a joint"],["befuddled","confused, muddled",""],["byzantine","excessively complicated, especially of systems","From the administration of the Byzantine empire. Usually of bureaucracy"],["circuitous","indirect, roundabout","The route rather than the knot"],["coherent","logically connected, holding together","co- + haerere, to stick. Not the same as clear: a coherent argument can be hard"],["confound","to confuse or bewilder; also, to defeat expectations","Two senses. Confound the sceptics = prove them wrong"],["conundrum","a confusing problem or riddle","The problem"],["convoluted","excessively complex and twisted","con- + volvere, to roll up"],["decipher","to work out the meaning of something obscure or coded","The verb of getting out"],["delineate","to describe or outline precisely","de- + linea, line. The image is drawing an outline"],["digression","a wandering away from the subject","A departure, not a confusion"],["disjointed","lacking connection between its parts","The exact opposite of coherent"],["elucidate","to make clear, throw light on","e- + lux. The active verb of clarifying"],["elusive","difficult to catch, grasp, or define","Can apply to concepts as well as people"],["enigmatic","puzzling, mysterious","From enigma"],["enunciate","to pronounce clearly; to state a principle formally","Two senses, both about making something distinct"],["equivocate","to use ambiguous language to avoid commitment","equi- + vocare, equal voices. The point is avoiding commitment, not confusion"],["esoteric","understood only by a small initiated group","The difficulty is specialist knowledge"],["evasive","avoiding a direct answer",""],["explicable","able to be explained","Note inexplicable is the commoner form"],["explicate","to explain in detail, unfold","ex- + plicare, to unfold. More systematic than elucidate"],["fathom","to understand after effort","cannot fathom. Originally a measure of depth"],["flummoxed","completely baffled","Informal register"],["impenetrable","impossible to understand or get into",""],["indeterminate","not fixed or settled","Of a value or outcome, not a person"],["inscrutable","impossible to interpret or read","Usually of faces and intentions, not texts"],["intelligible","able to be understood","Weaker than lucid — it means merely possible to understand"],["limn","to depict or describe","Rare and literary. Same family as illuminate"],["lucid","clear and easy to follow","lux, light. Also means mentally sound — a lucid interval"],["nonplussed","so surprised as to be at a loss","TRAP: it does not mean unbothered. American usage has drifted, but the GRE uses the original: at a loss for how to react"],["obfuscate","to deliberately make unclear","ob- + fuscus, dark. The clearest case of intent"],["opaque","not transparent; impossible to see through","The physical metaphor for obscurity"],["quandary","a state of uncertainty about what to do","The state you are in — a quandary is about a decision, a conundrum about a puzzle"],["recondite","deep and obscure","The difficulty is depth. Near-twin of abstruse"],["tortuous","full of twists and turns","TRAP: ≠ torturous, which means painful. A tortuous argument winds; a torturous one hurts"]]},{"n":9,"t":"Calm → unfeeling → torpid","a":"Declining responsiveness to stimulus. Very high SE frequency","w":[["abeyance","temporary suspension","A noun and a state. Held in abeyance — of rules, claims, activity"],["aloof","distant, uninvolved","Physical or social distance"],["apathy","absence of interest or concern","a- + pathos, without feeling"],["aplomb","self-confident composure under pressure","handled the interruption with aplomb"],["blasé","unimpressed through overfamiliarity","The cause is having seen it before"],["callous","insensitive to others' suffering","The moral word here — hardened, from callus"],["cavalier","offhand, dismissive of things that deserve care","Negative. a cavalier attitude to safety"],["complacent","smugly satisfied, unaware of deficiency","TRAP: ≠ complaisant from cluster 02. Complacent is about yourself; complaisant is about pleasing others"],["dawdle","to move or act slowly, wasting time","The verb"],["dilatory","tending to delay","Of a person or a process. dilatory tactics"],["distrait","distracted, inattentive","French. Attention is elsewhere, not absent"],["dormant","temporarily inactive, sleeping","dormire, to sleep. A dormant volcano is not extinct"],["ennui","listless boredom arising from lack of interest","French. Boredom with a philosophical flavour"],["equable","even-tempered, not given to swings","Describes the disposition. Also used of climate"],["equanimity","evenness of mind under strain","aequus + animus, level mind. The noun everyone should know"],["halcyon","calm and peaceful","Almost always of a past time — halcyon days. From the kingfisher"],["impassive","showing no emotion","About the surface. An impassive face may conceal a great deal"],["imperturbable","not capable of being upset","in- + perturbare. The strongest of these"],["indolent","habitually lazy","The moral version. Indolence is a fault; lassitude is a condition"],["inert","without power to move or act","Chemically or physically incapable, not merely resting"],["insensible","unaware, unresponsive","TRAP: ≠ insensitive. Insensible of the danger means unaware of it"],["insouciant","free from concern, carefree","Lighter than nonchalant, and often approving"],["inured","accustomed to something unpleasant","inured to hardship. Reached by exposure, not by nature"],["languid","slow, relaxed, lacking vigour","Can be almost positive — languid elegance"],["lassitude","weariness, lack of energy","Physical or mental fatigue"],["lethargic","sluggish, lacking energy",""],["lull","a temporary pause in activity","a lull in the fighting"],["nonchalant","casually unconcerned","Neutral or mildly positive — coolness"],["oblivious","unaware","Of surroundings or of facts"],["passive","accepting without resisting",""],["phlegmatic","unemotional, hard to excite","From the humour phlegm. Closer to a temperament than a moment"],["placid","calm, untroubled","Can tip slightly negative — placid implies nothing is happening"],["poise","composed self-assurance","Includes bearing, not just calm"],["quiescent","at rest, inactive","The medical and technical word for the same"],["serene","calm and untroubled, with an air of dignity",""],["sluggish","slow-moving, unresponsive",""],["somnolent","drowsy, sleepy","Describes the person — the mirror of soporific"],["soporific","causing sleep or drowsiness","Direction of fit: describes the thing, not the person. A soporific lecture"],["stoic","enduring hardship without complaint","The endurance is the point. From the philosophical school"],["stolid","showing no emotion or interest; dull","Impassive plus the suggestion of dullness"],["stupefy","to make someone unable to think clearly","The verb of producing the state"],["subdued","quiet and restrained, often after something","Implies a previous state that was livelier"],["supine","lying face up; failing to act through weakness","The second sense is the tested one — a supine legislature is one that will not resist"],["tepid","lukewarm; unenthusiastic","a tepid response"],["torpor","a state of physical or mental inactivity","The noun for the condition. Also used of hibernating animals"],["tranquil","peaceful, quiet","Usually of places and conditions"],["weary","tired, worn out",""]]},{"n":10,"t":"Obstinacy and dogmatism","a":"Refusal to yield, plus the ideological version: doctrinaire, ideologue, zealot","w":[["acolyte","a devoted follower or assistant","Originally an altar attendant. Implies subordination and learning"],["adamant","refusing to be persuaded","From adamas, the hardest substance — the root of diamond. The mildest here, and closest to neutral: being adamant can be admirable"],["apologist","someone who defends a position or institution","TRAP: nothing to do with apologising. An apologist makes the case for something, usually something unpopular"],["contumacious","stubbornly disobedient to authority","Legal register — contempt of court is contumacious conduct"],["disciple","a follower of a teacher or doctrine","discere, to learn. Neutral to positive"],["doctrinaire","applying a theory rigidly without regard to circumstances","About applying a theory regardless of whether it fits. Stronger and more specific than dogmatic"],["dogmatic","asserting opinions as if they were certainties","About the manner of holding beliefs"],["froward","difficult to deal with, contrary","Archaic. The opposite of toward — turned away"],["headstrong","determined to have one's own way","Suggests youth, and not having thought it through"],["hidebound","unwilling to change because bound by convention","The image is dried leather, too stiff to flex. The rigidity is habitual, not commanded"],["ideologue","someone driven by an ideology rather than by evidence","The person"],["imperious","arrogantly commanding, expecting obedience","From imperium, command. Watch: ≠ imperial (of an empire) and ≠ imperative (urgently necessary)"],["implacable","impossible to appease or placate","in- + placare. Note what it is not: not merely stubborn, but unable to be calmed — of hostility, opposition, an enemy"],["intractable","not easily controlled or solved","Also used of problems, not just people — an intractable dispute"],["intransigence","refusal to compromise","The noun"],["intransigent","refusing to compromise","The negotiation word"],["magisterial","authoritative, in a manner that brooks no question","Two faces: it can praise (a magisterial study) or criticize (a magisterial manner). Context decides"],["martinet","someone who demands rigid adherence to rules","A noun, and a person. From Jean Martinet, a French drillmaster"],["obdurate","stubbornly refusing to change","ob- + durus, hard. Negative, and often about refusing to feel pity"],["obstinate","stubborn, especially unreasonably","The plain word"],["ossify","to become rigid and fixed, to stop developing","os, bone — literally to turn to bone. A verb, and used of institutions"],["partisan","can be neutral — a supporter, not necessarily a bigot",""],["peremptory","allowing no refusal or discussion","a peremptory dismissal. The tone that closes off reply"],["recalcitrant","resisting authority or control","re- + calcitrare, to kick back. The image is a mule"],["refractory","stubbornly resistant to control or treatment","Near-twin of recalcitrant. Also technical: a refractory material resists heat"],["wayward","wilful and unpredictable, straying from what is expected","Adds unpredictability: a wayward child wanders rather than defies"],["willful","deliberately doing what one wants despite instruction","The deliberateness is the point. Also spelled wilful"],["zealot","a fanatical adherent","Originally a Jewish sect resisting Rome. Implies action, not just belief"]]},{"n":11,"t":"Reckless ↔ brave ↔ hesitant ↔ cowardly","a":"A four-position scale, not a synonym pile","w":[["ambivalence","holding two contradictory feelings at once","Not uncertainty, and not indifference: both feelings are present and strong"],["ambivalent","pulled both ways — not uncertain, not indifferent",""],["apprehension","anxiety about a future event","Also means understanding — apprehension of the facts. Two senses"],["assertive","confident in stating one's position","The mildest, and about speech rather than danger"],["audacious","daring, often to the point of impudence","Two faces: an audacious plan can be admiring; audacious behaviour is not"],["brazen","shameless, boldly defiant of propriety","From brass — brass-faced. The shamelessness is the point, not the courage"],["craven","contemptibly cowardly","Strong condemnation"],["daunt","to make someone lose courage","undaunted is the commoner form"],["daunting","intimidating, discouraging","Describes the task"],["demur","to raise an objection; to hesitate","Mild — a demurral is a polite objection, not a refusal"],["diffidence","lack of self-confidence; shyness","Not indifference, which is not caring"],["diffident","lacking self-confidence, modest to a fault","TRAP: ≠ indifferent. Diffidence is shyness, not disinterest"],["disconcerting","unsettling, throwing one off balance","Describes the thing; compare discomfit from cluster 08"],["effrontery","insolent boldness; shameless nerve","The noun for brazen behaviour. had the effrontery to ask"],["flustered","agitated and unable to collect oneself","Composure lost under pressure, not fear of danger"],["foolhardy","recklessly bold without regard to danger","The judgment failure is explicit in the word"],["fraught","filled with something undesirable; tense","fraught with danger, or simply a fraught meeting. Not itself a fear word — it describes a situation charged with it"],["fret","to worry persistently about small things","The verb"],["impetuous","acting suddenly on impulse","The speed is the fault"],["impulsive","acting without forethought","Plainer than impetuous"],["intrepid","fearless and enduring","in- + trepidus, not trembling. Built on trepidation, negated"],["irresolute","unable to decide",""],["mettle","spirit and resilience under test","prove your mettle. Not metal — though the words share an origin"],["mettlesome","spirited, courageous","The adjective"],["perturb","to make anxious or unsettled","The verb of doing it to someone"],["plucky","brave in a determined way, especially against odds","Implies the underdog — plucky is never used of the strong"],["precipitate (adj)","done with excessive haste","a precipitate decision"],["precipitous","dangerously steep","Constantly swapped with the above"],["pusillanimous","cowardly, lacking courage","pusillus + animus, a small spirit. The literary word"],["quail","to lose courage and shrink back","Careful: this one faces the other way — quail is what the frightened person does. Also a bird"],["skittish","nervous and easily startled","From horses. Implies liability to bolt"],["temerity","reckless nerve — not courage, and usually ironic",""],["timorous","timid, showing fear","Same root as timid"],["tremulous","trembling; timid","Physical shaking, or a shaking voice"],["trepidation","apprehension about something about to happen","with some trepidation. Anticipatory"],["vacillate","to waver between options","The verb for the behaviour"],["valor","courage in the face of danger, especially in battle","Formal register"]]},{"n":12,"t":"Enthusiasm and sociability","a":"Energy plus warmth. Overlaps 52 EMOTION; this cluster is dispositional","w":[["alacrity","brisk and cheerful readiness","accepted with alacrity. Speed plus willingness — both halves matter"],["amenity","a pleasant feature or facility","Usually plural: the amenities. A thing, not a feeling"],["amicable","characterized by friendliness","Usually of arrangements, not people — an amicable settlement"],["ardent","passionate, intensely devoted","an ardent supporter. Root is ardere, to burn"],["ardor","intense warmth of feeling; passion","The noun"],["avid","keenly interested, eager","an avid reader. Root is avidus, greedy"],["avuncular","kind and friendly toward someone younger","Literally uncle-like. Carries a generational tilt"],["blithe","happy and carefree","Watch the second sense: blithe disregard means casual to the point of carelessness. Not always a compliment"],["boisterous","noisily energetic and rough","The noise is the point, and it can be a mild criticism"],["buoyant","cheerful and optimistic","The image is floating — it resists being pushed down"],["congenial","pleasant and agreeable; suited to one's taste","Two senses: a congenial person is pleasant company; a congenial task suits you"],["convivial","friendly and lively, especially around food and drink","con- + vivere, living together. The setting is a gathering"],["cordial","warm and friendly","Can be formal — cordial relations between states"],["droll","amusing in an odd or understated way","The oddness is the point, not the volume of the joke"],["ebullient","overflowing with enthusiasm","e- + bullire, to boil over"],["effervescence","bubbling liveliness","The noun. Same image as fizzing water"],["euphoria","intense happiness or elation","Stronger than cheerfulness; often temporary"],["exhilarating","making one feel very happy and animated","Describes the thing, not the person"],["facetious","treating serious matters with inappropriate humour","Negative. The inappropriateness is built in"],["felicitous","well chosen, apt; also happy","Two senses, and the tested one is \"apt\" — a felicitous phrase is a well-judged one"],["fervent","showing intense feeling","The common adjective"],["fervid","intensely enthusiastic","Slightly stronger than fervent, and can tip into overheated"],["fervor","great warmth and intensity of feeling","Near-twin of ardor. Root fervere, to boil"],["gambol","to run or skip about playfully","Physical. The image is a lamb"],["geniality","friendliness and cheerfulness of manner","The noun"],["gratify","to give pleasure or satisfaction","gratified by the response"],["gregarious","sociable, fond of company","From grex, a flock — the same root as congregate and segregate"],["heady","exhilarating; intoxicating","Describes the experience, not the person — a heady atmosphere"],["jocose","playful, given to joking","Neutral to positive"],["jocund","cheerful and light-hearted","Literary register"],["levity","lack of seriousness, lightness of manner","Often a mild criticism — levity at the wrong moment. Opposite of gravity"],["panache","flamboyant confidence of style","French. Originally a plume on a helmet"],["regale","to entertain, especially with talk","regaled us with stories. Also means to feast someone"],["sanguine","optimistic, confident about the future","From the humour blood. Not the same as cheerful — sanguine is about expectation"],["scintillating","brilliantly lively, sparkling","Usually of conversation or wit. From scintilla, a spark"],["verve","energy and enthusiasm, especially in performance","Implies style, not just energy"],["vitality","energy and liveliness","The noun for the quality itself"],["vivacious","lively and animated","From vivere, to live. Often of manner and conversation"],["zealous","filled with eager devotion to a cause","Connects to zealot in cluster 10 — but zealous is the neutral-to-positive adjective, where zealot is a fanatic"]]},{"n":13,"t":"Gloom, bitterness, mourning","a":"Three sub-groups: embittered, grieving, appalling","w":[["abject","utterly wretched; also servile","Two senses. abject poverty is wretched; abject apology is grovelling"],["abysmal","extremely bad","Usually not about sadness at all — an abysmal result is simply terrible"],["bereft","deprived of something, especially by death","Takes of. The loss is the cause"],["crestfallen","dejected after a disappointment","Requires a prior hope — the image is a bird's crest dropping"],["dirge","a mournful song for the dead","A song"],["elegy","a poem of serious reflection, typically a lament for the dead","A poem, and more meditative than a dirge"],["glum","dejected, sullen","Informal register"],["hapless","unlucky, and pitiably so","The misfortune is undeserved — that is what separates it from unlucky"],["harrowing","acutely distressing","From the farm harrow, which tears up ground. Describes the experience"],["jaundiced","soured by resentment or cynicism","From the yellow of jaundice. a jaundiced view — the judgment is distorted by bitterness"],["lament","(v) to mourn; (n) an expression of grief","Both parts of speech"],["lugubrious","mournful in an exaggerated, gloomy way","Also negative: the mournfulness is overdone, often comically so"],["macabre","disturbing, concerned with death","The subject matter is death"],["misanthrope","one who hates humankind","The noun for the person"],["misanthropic","hating humankind","The adjective"],["misogynist","one who hates women","miso-, hate, same prefix"],["morose","sullen and ill-humoured","The plain word. Gloom with a closed door"],["nostalgia","sentimental longing for the past","The object is always the past"],["obsequy","a funeral rite","Usually plural, obsequies. Not obsequious, which means fawning"],["plaintive","sounding sad and mournful","Describes a sound — a plaintive cry, a plaintive melody"],["poignant","evoking a keen sense of sadness, and moving","A compliment when applied to art. From pungere, to prick"],["rue","(v) to regret bitterly","rue the day. Also a bitter herb"],["sardonic","mocking in a bitter, scornful way","The mockery is the point. From Sardinia, via a plant said to cause a rictus grin"],["saturnine","gloomy and taciturn by temperament","From the planet Saturn. A disposition, not a mood"],["sentimental","appealing to shallow emotion","The one negative here. It means the feeling is unearned"],["wistful","yearning with gentle sadness","Longing for something out of reach, and the longing is sweet"],["woeful","full of sorrow; also lamentably bad","Second sense is common: a woeful performance means very poor"]]},{"n":14,"t":"Soothing and relieving","a":"Largest synonym chain in the list: allay = assuage = mitigate = mollify = placate","w":[["allay","to diminish or put to rest","Takes fears and doubts as well as pain. allay concerns"],["alleviate","to make suffering less severe","levis, light — to lighten. The plainest of these"],["ameliorate","to make a bad situation better","melior, better. Improves the situation, not just the feeling"],["analgesic","(n/adj) a painkiller","Specifically pain"],["anodyne","inoffensive to the point of saying nothing",""],["appease","to pacify by giving in to demands","Carries the concession. Historically loaded — appeasement"],["assuage","to make an unpleasant feeling less intense","Also means to satisfy — assuage hunger. Two uses"],["beneficence","active kindness; doing good","bene + facere. The noun"],["benign","gentle and kindly; also harmless","Two senses: a benign smile, a benign tumour"],["boon","a thing that is helpful and beneficial","A noun. a boon to farmers"],["cathartic","providing emotional release","From Greek katharsis, purging"],["coddle","to treat with excessive care","Negative. Over-protection"],["commiserate","to express sympathy with someone","Does not fix anything — it is shared feeling, not intervention"],["conciliatory","intended to overcome hostility","An adjective, describing a gesture or tone"],["convalescent","recovering from illness","Describes the person recovering, not the remedy"],["detente","an easing of hostility between states","French. Diplomatic register, usually of nations"],["emollient","(n/adj) softening; a skin-softening substance","Figuratively, an emollient remark softens a dispute"],["innocuous","harmless, causing no offence","in- + nocere, not to harm. About the absence of harm, not the presence of kindness"],["magnanimity","generosity of spirit, especially toward a rival","magnus + animus, great soul. Implies you could have been harsh and were not"],["mediate","to intervene between parties to produce agreement","The third party is the point"],["mollify","to soften someone's anger","mollis, soft. Emphasises softening"],["pacify","to bring peace to a person or a region","Two scales: you can pacify a child or a province"],["placate","to make someone less angry","The plain word"],["propitiate","to win favour from someone offended, especially a deity","Implies an offering. More formal than the rest"],["reconcile","to restore friendly relations; also to make consistent","Two live senses — reconcile two people, or reconcile two accounts"],["remedial","intended to correct a deficiency","remedial classes. Fixing a shortfall"],["salubrious","health-giving","Usually of air, climate, surroundings"],["salutary","producing a beneficial effect, often through being unpleasant","The twist: a salutary lesson is a useful one you did not enjoy"],["solicitous","showing attentive concern","Can tip negative — solicitous to the point of fussing"],["succor","(n/v) help given in time of distress","Old-fashioned register. came to their succor"]]},{"n":15,"t":"Greed ↔ thrift ↔ waste ↔ poverty","a":"Four poles. Prodigal and profligate mean wasteful, not merely wandering","w":[["acquisitive","keen to acquire things","Mildest here, and can be neutral — an acquisitive museum"],["affluent","wealthy","Neutral"],["avarice","extreme greed for wealth","The noun, and the strongest"],["avaricious","greedy for money","The adjective"],["covet","to yearn to possess something belonging to another","The object belongs to someone else — that is the whole word"],["covetous","eagerly desirous of what another has",""],["exorbitant","unreasonably high, of a price","ex orbita, off the track"],["exploitative","taking unfair advantage","Broader than money — labour, resources, people"],["extravagant","spending much more than needed","Also means exceeding reasonable bounds generally"],["frugality","economy in spending","Positive or neutral. A virtue"],["gouge","to overcharge grossly","The verb for doing it to customers"],["impecunious","having little money","im- + pecunia, money. Mildest — short of cash rather than destitute"],["indigence","poverty, need","Formal register. the indigent = the poor"],["lavish","(adj) very generous or extravagant; (v) to give in abundance","Can be a compliment — lavish praise, a lavish production"],["lucrative","producing a great deal of profit","Neutral to positive — a lucrative contract"],["lucre","money, especially when regarded as sordid","Negative, and almost always in filthy lucre"],["mercenary","motivated solely by money","Also a noun: a soldier for hire"],["miserly","hoarding money, unwilling to spend any","Strongly negative"],["opportunistic","exploiting chances without regard to principle","About timing rather than money specifically"],["parsimonious","unwilling to spend; extremely sparing","Negative. Stinginess dressed as economy"],["penurious","mean with money; also extremely poor","Two senses, and they conflict. See below"],["penury","extreme poverty","The noun. Unlike penurious, it means only poverty"],["prodigal","recklessly wasteful","Not \"wandering.\" The prodigal son was wasteful, not lost. It also has a second sense: lavishly abundant"],["profligate","wasteful, and often dissolute","Adds moral looseness to the waste"],["rapacious","aggressively grasping","rapere, to seize. Implies predation, not just desire"],["remuneration","payment for work or services","Formal and neutral. Note the spelling — not renumeration"],["spendthrift","(n) one who spends wastefully","A person, where the others are adjectives or verbs"],["squander","to spend or use wastefully","The verb"],["stinting","restricting supply; sparing","Usually in the negative: without stinting means generously"],["usury","lending at unreasonably high interest","Historically a crime; now the term for predatory lending"],["venal","open to bribery; corruptible","Not venial, which means a forgivable sin. A venal official takes money"]]},{"n":16,"t":"Deceit ↔ honesty","a":"Largest cluster after TRAP. Artless/ingenuous mean naive, not clumsy","w":[["artful","clever at attaining an end, often by deceit","TRAP: the opposite of artless. Artful = crafty; artless = innocent"],["artless","without guile; natural and sincere","TRAP: does not mean clumsy. The opposite of artful"],["beguile","to charm in a way that may deceive","Can be almost positive — beguiling is attractive"],["bogus","not genuine","Informal"],["candid","truthful and straightforward","Positive"],["chicanery","the use of trickery, especially legal or political","The noun for the whole practice"],["collude","to cooperate secretly for a deceitful purpose","Requires two or more parties"],["concoct","to devise or invent, often a story","Same root as cooking something up"],["conspire","to plan together secretly to do something wrong",""],["counterfeit","a forged imitation","Physical objects — currency, goods"],["cozen","to trick or deceive","Archaic, literary"],["crafty","cunning, skilled at deceiving","Plain word"],["cunning","skilled at achieving ends by deceit",""],["delusion","a false belief held despite evidence","The victim's state, not the deceiver's product"],["devious","showing a skilful use of underhand tactics","de- + via, off the road"],["disingenuous","insincere; feigning ignorance or innocence","The negative of ingenuous — it fakes the innocence"],["dissemble","to conceal one's true motives or feelings","Hiding what is there"],["distort","to misrepresent",""],["dupe","(n) one easily deceived; (v) to deceive","Both parts of speech"],["duplicitous","deceitful; saying one thing and doing another","duplex, twofold — two faces"],["fabricate","to invent, especially falsely",""],["fallacious","based on a mistaken belief; logically unsound","The logic is faulty"],["feign","to pretend; to simulate","Displaying what is not there. The mirror of dissemble"],["feint","a deceptive movement, especially in combat","From fencing. A mock attack"],["fidelity","faithfulness; also accuracy of reproduction","Two senses"],["frank","open and honest in speech","Can be blunt"],["guileless","innocent, without cunning",""],["gullible","easily deceived","The adjective for the disposition"],["hypocrite","one who professes beliefs they do not hold","The gap is between stated and actual conviction"],["illusory","based on illusion; not real","The appearance was never real"],["implausible","not believable","Note the difference from specious: implausible fails on sight; specious passes"],["ingenuous","innocent and unsuspecting","TRAP: not ingenious, which means clever"],["insidious","proceeding harmfully in a gradual, concealed way","The stealth and the gradualness are the point. Often of diseases and influences"],["intrigue","(n) secret plotting; (v) to plot, or to fascinate","Two verb senses — the fascination sense is unrelated to deceit"],["inveigle","to persuade by deception or flattery","Takes into — inveigle someone into doing something"],["machiavellian","cunning and unscrupulous in politics","From Machiavelli. Political register"],["machinations","scheming plots","Usually plural, and sinister"],["malinger","to feign illness to avoid work","Very specific, and it comes up"],["mendacious","lying, habitually dishonest","About a person or statement, and it means actually untrue"],["mendacity","untruthfulness","The noun"],["naive","lacking experience or judgment","Not a moral fault; just untested"],["perfidious","deliberately faithless, treacherous","Betrayal of trust is the specific element"],["perfidy","treachery; deliberate breach of faith","The noun of perfidious"],["phony","not genuine","Informal"],["ploy","a cunning manoeuvre to gain advantage","More strategic than a ruse"],["poseur","one who pretends to be what they are not","The deceiver, not the victim — listed here because it is the flip side"],["prevaricate","to speak evasively; to avoid the truth","Not quite lying — it is dodging"],["probity","complete honesty and integrity","Formal and strong. The noun for incorruptibility"],["ruse","a trick intended to deceive",""],["sham","a thing that is not what it purports to be","Also an adjective"],["skullduggery","underhand behaviour","Informal, faintly comic"],["specious","superficially plausible but actually wrong","Learn this one cold. A specious argument survives a glance and not scrutiny"],["spurious","not genuine; false","Of claims, correlations, documents"],["swindle","to cheat out of money","Money specifically"],["unfeigned","genuine, not pretended","The negative of feign"],["unscrupulous","having no moral principles","About the absence of restraint, not skill at deceiving"],["veracious","speaking truthfully","Not voracious, which means ravenously hungry"],["veracity","conformity to truth; truthfulness","Of statements and people"],["wily","full of guile and tricks",""]]},{"n":17,"t":"Abundance ↔ scarcity","a":"Includes the variety sub-axis: multifarious, motley, eclectic","w":[["abound","to exist in large numbers","The verb, intransitive: errors abound"],["all-encompassing","including everything, leaving nothing out",""],["burgeon","to begin to grow rapidly; to flourish","burgeon is to bud. Implies a beginning"],["burgeoning","growing rapidly","The adjective"],["copious","abundant, plentiful","The plain word. copious notes"],["cornucopia","an abundant supply of good things","From the horn of plenty. Always positive"],["dearth","a scarcity or lack","The standard antonym of plethora"],["diminutive","very small","Often of people, and can be affectionate"],["dispense","to distribute; also to administer","TRAP: dispense with means to do without, which is nearly the opposite"],["disperse","to scatter in different directions","Physical scattering, and it implies the group breaks up"],["disseminate","to spread widely, especially information","semen, seed — scattering seeds. Ideas and information"],["eclectic","drawing from a wide range of sources","Positive or neutral, and it implies deliberate selection"],["fecund","highly fertile, producing abundantly","Biological or creative"],["fruitful","producing good results","About outcome, not quantity"],["hodgepodge","a confused mixture","Negative. Disorder is the point"],["inundate","to flood; to overwhelm with a quantity","unda, wave. The recipient is overwhelmed"],["lilliputian","tiny","From Swift's Lilliput. Can imply pettiness as well as smallness"],["minuscule","extremely small","Note the spelling — from minus, not mini"],["minutia","a trivial detail","Usually plural, minutiae. It means small in importance, not small in number"],["miscellany","a collection of varied items","The noun for the collection"],["modicum","a small quantity of something desirable","a modicum of sense. Always of something you would want more of"],["motley","made up of varied and often incongruous parts","Implies mismatch — a motley crew. Originally the jester's parti-coloured cloth"],["multifaceted","having many aspects","Usually of a problem or a person"],["multifarious","having great variety","The formal word for many-kinds"],["paucity","smallness of number or quantity","Formal. a paucity of evidence"],["plethora","an excess; an overabundance","Strictly it means too many, though loose usage has softened it. On the GRE, take the excess sense"],["prodigious","remarkably large in extent or degree","Impressiveness is built in. Not merely a lot — enough to astonish"],["profuse","plentiful, poured out freely","profuse apologies — the freeness is the point"],["proliferate","to increase rapidly in number","Reproduction or multiplication is the image"],["propagate","to spread and multiply; to transmit","Used of plants, ideas, and signals"],["rampant","negative — nothing good is rampant",""],["replenish","to fill up again","Restoring what was depleted, not adding beyond"],["scant","barely sufficient","Also a verb: to scant something is to skimp on it"],["sparse","thinly scattered","Distribution as well as amount — sparse population"],["sundry","various, of different kinds","Usually sundry items, all and sundry"],["welter","a confused mass; a turmoil","Negative, and it implies you cannot see through it"]]},{"n":18,"t":"Increase ↔ decrease","a":"Direction only. Pair with 19 for magnitude of harm","w":[["abate","to lessen in intensity","Works both transitively and intransitively — the storm abated"],["accentuate","to make more noticeable","Emphasis, not size — accentuate a feature"],["accretion","growth by gradual accumulation of layers","The noun, and the image is geological"],["accrue","to accumulate over time, especially benefits or interest","Gradual and automatic — interest accrues"],["aggrandize","to increase power, wealth, or status","Usually negative, and often reflexive: self-aggrandizing"],["amplify","to increase in volume or extent; to expand on","Two senses — amplify a signal, or amplify a remark by explaining it"],["attenuate","to make thinner or weaker","tenuis, thin. Weakening by thinning, often of a signal or an effect"],["augment","to make greater by adding","The plain word"],["bolster","to support or strengthen","Originally a cushion. Props something up"],["buttress","to strengthen, especially an argument","From architecture — the external support on a wall"],["crescendo","a gradual increase in loudness","TRAP: strictly the increase, not the peak. \"Reached a crescendo\" is common and disputed"],["curtail","to cut short; to reduce","Cutting something off before its full extent — curtail a visit"],["distend","to swell from internal pressure","Physical and usually unpleasant — a distended stomach"],["dwindling","steadily shrinking","The adjective, and it implies gradual loss"],["enhance","to improve in quality or value","Quality, not quantity. Enhancing something makes it better, not bigger"],["escalate","to increase rapidly, especially a conflict","Implies a spiral — escalating tensions"],["exacerbate","to make a bad situation worse","The object must already be bad. You cannot exacerbate a success"],["mitigate","to make a bad thing less severe","The mirror. Also legal: mitigating circumstances"],["nadir","the lowest point","Astronomical: the point directly underfoot. Both are Arabic in origin"],["outstrip","to surpass; to grow faster than","The odd one — this is increase, but relative: demand outstrips supply"],["plummet","to fall steeply and suddenly","Speed and steepness are the point"],["regress","to return to an earlier, worse state","Backwards, not merely smaller"],["retrench","to reduce spending or scale back","Financial and organizational — a company retrenches"],["subside","to become less intense; to sink","Of floodwater, noise, anger, swelling"],["transcend","to go beyond the limits of","Not a quantity word — it means exceeding a category, not a number"],["underscore","to emphasise; to make more evident","Literally to underline. Emphasis, not strength"],["wane","to decrease gradually","From the moon. Its pair is wax — the GRE uses the phrase wax and wane"],["zenith","the highest point","Astronomical: the point directly overhead"]]},{"n":19,"t":"Weakening, harm, destruction","a":"Enervate means to drain, not to energize","w":[["adverse","unfavourable, working against you","Not averse, which means unwilling"],["blighted","spoiled or ruined, especially by decay",""],["calamitous","causing great damage or distress",""],["cataclysm","a violent upheaval or disaster","The noun"],["cataclysmic","violently destructive, changing everything",""],["catastrophic","involving sudden great damage",""],["conflagration","a large destructive fire","Also used of a war"],["debase","to reduce in quality or value","Originally of coinage"],["debilitating","causing weakness and loss of strength",""],["deleterious","causing harm, especially gradually","Formal register; often of effects"],["desiccate","to dry out completely","Figuratively: to drain of vitality"],["detrimental","causing damage or harm",""],["dismantle","to take apart piece by piece",""],["dross","worthless residue; rubbish","Originally the scum on molten metal"],["effete","worn out, no longer able to produce","Not effeminate, though often misused so"],["egregious","outstandingly bad","Once meant outstandingly good; that sense is dead"],["emaciated","abnormally thin from hunger or illness",""],["enervate","to drain of energy","TRAP: does not mean to energize"],["eradicate","to destroy completely, root and branch","From radix, root"],["extirpate","to root out and destroy entirely","Stronger and more formal overable","Of land, and of creative periods"],["fitful","occurring in irregular bursts","Of sleep and of effort"],["immutable","unchangeable",""],["incessant","never stopping",""],["inchoate","just begun, not yet fully formed","Not chaotic, though often misused so"],["ingrained","firmly fixed by long habit",""],["interminable","endless, tediously long",""],["intermittent","stopping and starting at intervals",""],["inveterate","long established and unlikely to change","Of habits and habitual people: an inveterate liar"],["latent","present but not yet visible or active",""],["makeshift","a temporary substitute, improvised",""],["momentary","lasting only a moment",""],["nascent","just coming into existence",""],["omnipresent","present everywhere at once",""],["perennial","lasting or recurring year after year",""],["perpetuate","to make something continue indefinitely","Usually of something unwanted"],["pervasive","spread throughout every part",""],["recrudescent","breaking out again after a period of quiet","Of diseases and conflicts"],["sporadic","occurring at irregular intervals, scattered",""],["temporal","relating to time; or worldly rather than spiritual","Two senses"],["transient","lasting only a short time; also a person passing through",""],["transitory","not permanent",""],["ubiquitous","found everywhere",""],["universal","applying to all cases",""],["viable","capable of working or surviving",""]]},{"n":22,"t":"Old, outdated, original","a":"Pristine means primal, not merely clean","w":[["anachronism","something placed in the wrong time period",""],["anachronistic","belonging to a different period than the one shown",""],["antecedent","a thing that came before","Also the noun a pronoun refers back to"],["antedate","to come before in time",""],["antediluvian","extremely old-fashioned","Literally: before the Flood"],["archaic","belonging to an earlier period, no longer current",""],["artifact","an object made by a human, especially from the past","Also: a distortion introduced by the method of observation"],["atavism","a reversion to an ancestral type or earlier behaviour",""],["commence","to begin",""],["defunct","no longer existing or functioning",""],["desuetude","a state of disuse","Usually: fallen into desuetude"],["erstwhile","former","An adjective: his erstwhile ally"],["immaculate","perfectly clean and unspoiled",""],["interregnum","a gap between two reigns or governments",""],["obsolete","out of date, superseded",""],["onetime","former",""],["precursor","a forerunner, something that comes before",""],["primordial","existing from the very beginning",""],["pristine","in original unspoiled condition","Also: characteristic of earlier times"],["residual","remaining after most has gone",""],["stem from","to originate in",""],["unprecedented","never having happened before",""],["vestigial","a small remnant of something once larger","From vestige, a trace"]]},{"n":23,"t":"Foresight and warning","a":"Prediction plus prudence. Very common in RC","w":[["auspicious","promising a good outcome","From bird-omens; opposite inauspicious"],["chary","cautious, unwilling to risk","Usually chary of"],["circumspect","cautious, looking around before acting",""],["clairvoyant","able to perceive what others cannot",""],["exigency","an urgent need or demand","The noun"],["exigent","pressing, requiring immediate action",""],["forebode","to be an omen of something bad",""],["foreseeable","able to be predicted",""],["harbinger","a sign of something to come","Often of something bad"],["imminent","about to happen","Not eminent (distinguished) or immanent (inherent)"],["ineluctable","impossible to avoid",""],["minatory","threatening",""],["myopic","short-sighted, lacking foresight",""],["ominous","suggesting something bad is coming",""],["portend","to be a warning sign of",""],["prefigure","to be an early indication of",""],["premeditate","to plan in advance","Usually of a wrong act"],["premonition","a feeling that something is about to happen"," e",""],["intermediary","a go-between",""],["intertwined","twisted together, mutually dependent",""],["juxtapose","to place side by side for contrast",""],["marginalize","to push to the edge of importance",""],["microcosm","a small thing that represents a larger whole",""],["monolithic","large, uniform and unchanging",""],["nexus","a connection or central link",""],["omit","to leave out",""],["polarize","to divide into two sharply opposed groups",""],["proxy","someone authorised to act for another",""],["ramification","a consequence branching out from an action",""],["relegate","to consign to a lower position",""],["repercussion","an indirect consequence, usually unwelcome",""],["schism","a split within a group over doctrine",""],["sever","to cut off completely",""],["subordinate","lower in rank; to treat as less important",""],["subsume","to absorb into something larger",""],["supersede","to replace, making the earlier thing obsolete",""],["supplant","to take the place of, often by force","Not supplicate, which means to beg"],["surrogate","a substitute standing in for another",""],["tantamount","equivalent in effect","Takes to"],["unravel","to come apart; to solve by untangling",""]]},{"n":47,"t":"Trap words A–D","a":"Common words with a second GRE meaning. Part 1 of 3","w":[["abide","to tolerate; to remain","Abide by = comply with"],["abstract","to remove or summarise","The verb sense, not the adjective"],["accord","to grant; agreement","Of one's own accord"],["adhere","to stick to; to follow a rule faithfully",""],["affected","pretended, artificial","Not simply influenced"],["appropriate","to take for one's own use","The verb, stressed differently from the adjective"],["arrest","to stop or check","Arrest the decline, not only to detain"],["arresting","striking enough to stop you looking away",""],["attribute","a quality; to assign a cause to",""],["august","majestic, inspiring reverence","The adjective, stressed on the second syllable"],["base","morally low, contemptible","The adjective, not the foundation"],["benchmark","a standard against which others are measured",""],["bridle","to restrain; also to show resentment","Two opposed-feeling senses"],["broach","to raise a subject for discussion","Not brooch"],["brook","to tolerate","Almost always negative: would brook no delay"],["canon","a body of accepted works or rules","Not cannon"],["cardinal","of primary importance","A cardinal rule"],["champion","to support a cause vigorously","The verb"],["check","to restrain or slow","Hold in check"],["coin","to invent a word or phrase",""],["complement","something that completes","Not compliment, which is praise"],["compound","to make worse by adding to","Compound the problem"],["compromise","to weaken or expose to danger","Compromise the investigation, not only to settle"],["construe","to interpret in a particular way",""],["contend","to assert; to compete","Two senses, both tested"],["content","satisfied; the substance of something","Stress differs between the senses"],["convention","an accepted practice; a formal assembly",""],["countenance","to tolerate or approve; the face","The verb sense is the tested one"],["curb","to restrain",""],["deliberate","to consider carefully","The verb, with a different final vowel from the adjective"],["dictate","to prescribe authoritatively; a guiding principle",""],["diffuse","spread out, not concentrated; to spread","Not defuse, which means to make safe"],["discount","to disregard as unimportant","Discount a theory"],["discretion","freedom to decide; also tact","At the court's discretion"]]},{"n":47,"t":"Trap words E–P","a":"Common words with a second GRE meaning. Part 2 of 3","w":[["disinterested","impartial, having no stake","NOT uninterested, which means bored"],["dismiss","to reject from consideration",""],["divorced","separated from, having no connection","Divorced from reality"],["document","to provide evidence for","The verb"],["documentary","consisting of documents; factual","Documentary ving high moral qualities",""]]},{"n":52,"t":"Reactive emotion","a":"Momentary reactions, unlike the dispositional clusters 12 and 13","w":[["aghast","filled with sudden shock and horror",""],["chagrin","annoyance at having failed or been humiliated",""],["distressed","suffering anxiety or pain",""],["elated","very happy and excited",""],["euphoric","intensely happy, often briefly",""],["exasperated","intensely irritated by persistent annoyance",""],["hysterical","uncontrollably emotional",""],["indignant","angry at something perceived as unjust","The injustice is what separates it from plain anger"],["ire","anger","The formal noun"],["relish","to enjoy greatly; keen enjoyment",""],["resent","to feel bitter about unfair treatment",""],["umbrage","offence taken at a perceived slight","Usually: take umbrage"]]},{"n":53,"t":"Argument quality","a":"Cogent vs specious vs tendentious. Directly tested in RC","w":[["cogent","logically compelling",""],["compelling","forcing attention or agreement",""],["eloquent","fluent and persuasive in expression",""],["polemical","strongly attacking an opinion","A polemic argues against"],["rhetoric","the art of persuasion; also empty persuasive language","Two senses, one neutral and one dismissive"],["sophistry","clever reasoning that is actually false",""],["tendentious","promoting a particular view rather than being impartial",""],["trenchant","vigorous and incisive in expression",""]]},{"n":54,"t":"Important ↔ trivial","a":"Includes the excess sub-group: superfluous, redundant, gratuitous","w":[["frivolous","not serious enough to deserve attention",""],["gratuitous","unnecessary and uncalled for; also free of charge",""],["imperative","essential, urgently necessary","Not imperious, which means domineering"],["incidental","occurring as a minor accompaniment",""],["indispensable","absolutely necessary",""],["paltry","contemptibly small in amount",""],["passable","adequate but not good",""],["redundant","no longer needed; also unnecessarily repetitive",""],["remarkable","worthy of attention, unusual",""],["superfluous","more than is needed",""],["trifling","unimportant, trivial",""],["trivial","of little value or importance",""],["utterly","completely, absolutely",""]]},{"n":55,"t":"Certain ↔ probable ↔ speculative","a":"The hedging vocabulary of academic writing","w":[["circumstantial","based on indirect evidence","Circumstantial evidence implies but does not prove"],["conclusive","settling the matter decisively",""],["conjectural","based on guesswork",""],["conviction","a firmly held belief; also a formal finding of guilt",""],["credible","believable","Not credulous, which means too ready to believe"],["dubious","doubtful; also of questionable character",""],["fallible","capable of being mistaken",""],["feasible","able to be done",""],["incontrovertible","impossible to deny or dispute",""],["indefinite","not clearly fixed or limited",""],["ironclad","impossible to break or contradict",""],["plausible","seeming reasonable, though possibly untrue","The doubt is often implied"],["speculate","to form a theory without firm evidence",""],["tentative","provisional, not final",""],["verisimilitude","the appearance of being true",""],["veritable","genuine, used for emphasis","A veritable flood"]]},{"n":56,"t":"Endurance ↔ giving up","a":"Resolute, dogged, indefatigable vs falter, capitulate, relent","w":[["capitulate","to surrender on agreed terms",""],["dogged","persistent, refusing to give up",""],["falter","to lose strength or resolve",""],["fortitude","courage in bearing pain or adversity",""],["indefatigable","tireless, never giving up",""],["languish","to grow weak; to be left in a neglected state",""],["perseverance","continued effort despite difficulty",""],["pertinacious","stubbornly persistent",""],["prevail","to prove more powerful; also to be widespread","Two senses"],["relent","to become less severe; to give way",""],["resilient","able to recover quickly from difficulty",""],["resolute","firmly determined",""],["stalwart","loyal, reliable and hard-working",""],["steadfast","firm and unwavering in purpose",""],["surmount","to overcome an obstacle",""],["withstand","to resist successfully",""]]}]

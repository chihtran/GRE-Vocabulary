<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GRE Vocabulary Practice</title>
<style>
:root{
  --display:'Helvetica Neue Condensed','HelveticaNeue-CondensedBold','Arial Narrow','Roboto Condensed',Inter,system-ui,sans-serif;
  --body:Georgia,'Iowan Old Style','Times New Roman',serif;
  --paper:#FFFFFF; --paper2:#F4F5F1; --contour:#CFCBBF; --contour2:#94917F;
  --ink:#1A1C19; --ink2:#5A5E57; --route:#3A6480; --route-l:#6F97AE;
  --learn:#C08A3E; --solid:#4E7346; --weak:#A8453A;
  --rule:#E6E6E0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){@media (prefers-color-scheme:dark){
  --paper:#161A19; --paper2:#1E2422; --contour:#3A4440; --contour2:#4E5A54;
  --ink:#E4E7E0; --ink2:#9AA49B; --route:#7FAAC6; --route-l:#4A6C82;
  --learn:#D6A055; --solid:#6E9A63; --weak:#C4655A; --rule:#2C3330;
}}
:root[data-theme="dark"]{
  --paper:#161A19; --paper2:#1E2422; --contour:#3A4440; --contour2:#4E5A54;
  --ink:#E4E7E0; --ink2:#9AA49B; --route:#7FAAC6; --route-l:#4A6C82;
  --learn:#D6A055; --solid:#6E9A63; --weak:#C4655A; --rule:#2C3330;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:17px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.lab{font-family:var(--display);letter-spacing:.02em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--route);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* shell */
.wrap{max-width:860px;margin:0 auto;padding:0 18px 90px}
header.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);
  border-bottom:1px solid var(--rule);margin:0 -18px 22px;padding:14px 18px 11px;
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
}
.brand{font-family:var(--display);font-size:26px;font-weight:600;line-height:1.05;letter-spacing:.01em}
.alt{font-family:var(--display);font-size:15px;color:var(--ink2);margin-left:auto}
.alt b{color:var(--ink);font-weight:600}

/* profile */
.profile{position:relative;margin:4px 0 26px}
.profile svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--display);font-size:14px;color:var(--ink2);margin-top:2px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:baseline}

/* stations */
.bands{display:flex;flex-direction:column;gap:2px}
.bandhead{font-family:var(--display);font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--contour2);border-bottom:1px solid var(--rule);padding:15px 0 4px;margin-bottom:8px}
.st{
  display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;
  width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);
  padding:11px 2px;
}
.st:hover .sn{color:var(--route)}
.sn{font-family:var(--display);font-size:19px;color:var(--contour2);font-variant-numeric:tabular-nums}
.stt{display:block;font-family:var(--display);font-size:18px;line-height:1.2}
.sax{display:block;font-size:13.5px;color:var(--ink2);line-height:1.4;margin-top:3px}
.meter{width:96px}
.meter .bar{height:5px;background:var(--paper2);border-radius:3px;overflow:hidden;display:flex}
.meter .bar span{display:block;height:100%}
.meter .cap{font-family:var(--display);font-size:12.5px;color:var(--ink2);text-align:right;margin-top:3px;font-variant-numeric:tabular-nums}
.locked .stt,.locked .sn{color:var(--contour)}

/* cluster */
.back{font-family:var(--display);background:none;border:0;padding:6px 0;color:var(--route);font-size:16px}
h2.ct{font-family:var(--display);font-size:31px;font-weight:600;margin:6px 0 2px;line-height:1.05}
.cax{color:var(--ink2);font-size:15px;margin:0 0 18px;max-width:62ch}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.btn{font-family:var(--display);font-size:17px;padding:9px 20px;border:1px solid var(--ink);
  background:none;border-radius:2px}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.wlist{border-top:1px solid var(--rule)}
.wrow{display:grid;grid-template-columns:10px 1fr;gap:12px;padding:10px 2px;border-bottom:1px solid var(--rule);align-items:baseline}
.dot{width:9px;height:9px;border-radius:50%;background:var(--paper2);margin-top:7px}
.wd{display:block;font-family:var(--display);font-size:19px;line-height:1.25}
.wdef{display:block;font-size:15px;color:var(--ink2);margin-top:2px;line-height:1.45}
.wrow>span>span{display:block}
.wvi{display:block;font-size:14.5px;color:var(--route);margin-top:2px;line-height:1.4}
.cvi{display:block;font-size:17px;color:var(--route);margin-top:8px}
.vi{color:var(--route)}
.wnote{display:block;font-size:13.5px;color:var(--contour2);margin-top:4px;line-height:1.4}

/* card */
.card{border:1px solid var(--rule);background:var(--paper2);border-radius:3px;padding:30px 24px;min-height:230px;
  display:flex;flex-direction:column;justify-content:center;text-align:center;margin-bottom:16px}
.cw{font-family:var(--display);font-size:42px;line-height:1.05}
.cd{display:block;font-size:19px;margin-top:14px;max-width:46ch;margin-left:auto;margin-right:auto}
.cn{display:block;font-size:14.5px;color:var(--ink2);margin-top:12px;max-width:50ch;margin-left:auto;margin-right:auto}
.hint{font-family:var(--display);color:var(--ink2);font-size:15px}
.prog{font-family:var(--display);font-size:14px;color:var(--ink2);margin-bottom:10px;font-variant-numeric:tabular-nums}

/* quiz */
.qp{font-size:19px;margin:6px 0 18px;max-width:58ch}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.opt{font-family:var(--display);font-size:19px;text-align:left;padding:12px 15px;
  border:1px solid var(--rule);background:var(--paper2);border-radius:2px}
.opt:hover:not(:disabled){border-color:var(--route)}
.opt.right{border-color:var(--solid);background:color-mix(in srgb,var(--solid) 12%,var(--paper2))}
.opt.wrong{border-color:var(--weak);background:color-mix(in srgb,var(--weak) 12%,var(--paper2))}
.fb{border-left:3px solid var(--route);padding:2px 0 2px 14px;font-size:15.5px;color:var(--ink2);margin-bottom:16px}
.fb b{color:var(--ink);font-family:var(--display);font-size:18px}
.why{border-top:1px solid var(--rule);padding-top:10px;margin-bottom:16px}
.whyh{display:block;color:var(--contour2);font-size:14px;margin-bottom:6px}
.wl{font-size:14.5px;color:var(--ink2);margin-bottom:4px}
.wl b{font-family:var(--display);font-size:17px;color:var(--ink);margin-right:6px}
.ogl{font-family:var(--body);font-size:13.5px;line-height:1.45;color:var(--ink2);margin:-6px 0 10px;padding:0 4px}
.opt.def{font-family:var(--body);font-size:16px;line-height:1.4;padding:11px 14px}
.opt.picked{border-color:var(--route);background:color-mix(in srgb,var(--route) 10%,var(--paper2))}
.blank{border-bottom:1.5px solid var(--route);padding:0 2px;color:var(--route)}
.blab{color:var(--contour2);font-size:14px;margin:12px 0 5px}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-family:var(--display);font-size:15px;color:var(--ink2);margin-bottom:4px}
.field textarea,.field input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper2);
  border:1px solid var(--rule);border-radius:2px;padding:9px 11px;resize:vertical}
.field textarea{min-height:72px;line-height:1.45}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.seg button{font-family:var(--display);font-size:16px;padding:7px 14px;border:1px solid var(--rule);
  background:var(--paper2);border-radius:2px}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.orow{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:center;margin-bottom:6px}
.mark{font-family:var(--display);font-size:14px;width:34px;padding:6px 0;border:1px solid var(--rule);
  background:var(--paper2);border-radius:2px;text-align:center}
.mark.on{background:var(--solid);color:var(--paper);border-color:var(--solid)}
.note{font-size:14px;color:var(--ink2);margin:-6px 0 14px;line-height:1.45}
.err{color:var(--weak);font-size:14.5px;margin-bottom:12px}
.tag{font-family:var(--display);font-size:12.5px;color:var(--route);border:1px solid var(--route);
  border-radius:2px;padding:1px 6px;margin-left:8px}
.del{font-family:var(--display);background:none;border:0;color:var(--weak);font-size:14px;padding:0}
.tbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:15;background:var(--paper);
  border-bottom:1px solid var(--rule);margin:0 -18px 16px;padding:9px 18px;display:flex;align-items:center;gap:14px}
.clock{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.clock.low{color:var(--weak)}
.tmeta{font-family:var(--display);font-size:14px;color:var(--ink2);margin-left:auto}
.nav{display:flex;flex-wrap:wrap;gap:4px;margin:16px 0 20px}
.nav button{font-family:var(--display);font-size:13px;width:29px;height:29px;padding:0;
  border:1px solid var(--rule);background:var(--paper2);border-radius:2px;font-variant-numeric:tabular-nums}
.nav button.ans{background:var(--route);color:var(--paper);border-color:var(--route)}
.nav button.here{outline:2px solid var(--ink);outline-offset:1px}
.rev{border-bottom:1px solid var(--rule);padding:14px 0}
.rev .rq{font-size:16px;line-height:1.5;margin-bottom:8px}
.rev .ra{font-family:var(--display);font-size:15.5px;margin-bottom:3px}
.rev .ra.bad{color:var(--weak)}
.rev .ra.good{color:var(--solid)}
.rev .re{font-size:14.5px;color:var(--ink2);line-height:1.45;margin-top:5px}
.big{font-family:var(--display);font-size:56px;line-height:1;margin:6px 0 2px}
.azbar{display:flex;flex-wrap:wrap;gap:3px;margin:10px 0 16px}
.azbar button{font-family:var(--display);font-size:14px;width:26px;height:26px;padding:0;
  border:1px solid var(--rule);background:var(--paper2);border-radius:2px}
.azbar button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.search{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--rule);
  background:var(--paper2);border-radius:2px;color:var(--ink);margin-bottom:4px}
.cl{font-family:var(--display);font-size:12.5px;color:var(--contour2);margin-left:7px}
.passage{font-size:16px;line-height:1.62;border-left:3px solid var(--rule);padding:2px 0 2px 16px;margin:4px 0 18px}
.synq{font-family:var(--display);font-size:17px;color:var(--ink);margin:0 0 14px}
.synq u{text-underline-offset:3px}
.subq{font-family:var(--display);font-size:13.5px;color:var(--contour2);margin-bottom:6px}
.qrow{border-bottom:1px solid var(--rule);padding:12px 2px}
.qtxt{font-size:15.5px;line-height:1.45}
.qmeta{font-family:var(--display);font-size:13.5px;color:var(--ink2);margin-top:5px}
.qmeta b{color:var(--ink)}
.qbad{color:var(--weak)}
.qdet{font-size:14.5px;color:var(--ink2);line-height:1.45;margin-top:7px;
  border-left:2px solid var(--rule);padding-left:12px}

.empty{color:var(--ink2);padding:26px 0;max-width:56ch}
footer{border-top:1px solid var(--rule);margin-top:34px;padding-top:12px;
  font-family:var(--display);font-size:14px;color:var(--contour2);
  display:flex;gap:16px;flex-wrap:wrap}
footer button{background:none;border:0;color:var(--contour2);padding:0;text-decoration:underline}
@media(max-width:560px){
  .brand{font-size:22px}
  .alt{margin-left:0;width:100%}
  .cw{font-size:34px}.meter{width:72px}h2.ct{font-size:26px}
  .st{grid-template-columns:28px 1fr auto;gap:9px}
}
.essay{font-size:16.5px;line-height:1.66;margin:0 0 16px}
.model{border-left:3px solid var(--rule);padding:2px 0 2px 16px;margin:0 0 14px;
  font-size:16px;line-height:1.66;color:var(--ink)}
.type{width:100%;min-height:200px;font-family:var(--body);font-size:16px;line-height:1.6;
  padding:12px;border:1px solid var(--contour);border-radius:3px;background:var(--paper2);
  color:var(--ink);resize:vertical}
.type:focus{outline:none;border-color:var(--route)}
.tstat{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--display);font-size:12.5px;
  color:var(--contour2);margin:8px 0 2px}
.tstat b{color:var(--ink);font-size:14px}
.diffb{background:color-mix(in srgb,var(--weak) 22%,transparent);border-radius:2px}
.diffg{color:var(--ink2)}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <span class="brand">GRE Vocabulary Practice</span>
  <span class="alt lab" id="alt"></span>
</header>
<main id="app"></main>
<footer>
  <span id="sync">Progress saves in this browser</span>
  <span style="color:var(--route)">build 111 · 28 Sep</span>
  <button id="themeBtn">Switch theme</button>
  <button id="expBtn">Export progress</button>
  <button id="impBtn">Import</button>
  <button id="resetBtn">Reset</button>
</footer>
</div>

<script id="ESSAYS" type="application/json">
[{"n":1,"title":"Technology","kind":"Statement","prompt":"As people rely more and more on technology to solve problems, the ability of humans to think for themselves will surely deteriorate.","ps":["Contemporary problem-solving relies increasingly on technological tools — calculators, navigation systems, search engines, automated analysis. From this dependence the statement infers a coming deterioration in the human capacity for independent thought. The inference is intuitive but ultimately unpersuasive: although reliance on technology can weaken particular low-level skills, it does not diminish the capacity for independent reasoning, and in many domains it demonstrably enlarges it.","The statement's logic is not without merit. Cognitive skills, like physical ones, tend to weaken when they go unused, and technology frequently removes the occasion to use them. Routine arithmetic has declined wherever calculators are available, and the ability to navigate unaided has diminished among those who depend on GPS. If independent thought were simply the aggregate of such discrete competencies, each delegated task would indeed represent a measurable loss.","This account, however, conflates the delegation of routine tasks with the erosion of thought itself. Offloading mechanical operations does not vacate the mind; it redirects attention toward problems that cannot be automated. Climate science illustrates the point: the computational power that performs the underlying calculations allows researchers to concentrate on the genuinely difficult work of selecting variables, evaluating assumptions, and interpreting results. Reliance on the tool does not lower the cognitive demand placed on the researcher but raises it, relocating skill to a higher level of abstraction rather than eliminating it.","Technology further generates novel problems that require, rather than displace, original reasoning. The emergence of social media produced questions concerning misinformation, privacy, and collective behavior that no previous generation confronted, and addressing them has forced formerly separate disciplines together, as engineering is brought into dialogue with ethics and epidemiology with network theory. Such demands expand the scope of human reasoning rather than contract it. It would be an overstatement to deny any risk: uncritical dependence can foster passivity. But that danger is a function of how a tool is used, not of its use as such — the same search engine that permits laziness also enables inquiry far beyond what earlier resources allowed.","The statement is therefore valid only in a limited sense: specific, unexercised skills do atrophy. As a general claim about human cognition it is unwarranted. Historically, major technologies — from the printing press to vaccination — have expanded rather than narrowed the range of problems available to human thought. The pertinent question is not whether reliance on technology is advisable, but whether the capacity it frees will be directed toward more consequential forms of reasoning."]},{"n":2,"title":"Great Nation","kind":"Claim + Reason","prompt":"Claim: The surest indicator of a great nation must be the achievements of its rulers, artists, and scientists. Reason: Great achievements by a nation's rulers, artists, or scientists will ensure a good life for the majority of that nation's people.","ps":["The claim identifies national greatness with the achievements of a nation's rulers, artists, and scientists, and grounds this in the premise that such achievements ensure a good life for the majority. Both parts are questionable, but the reason is the weaker, since it assumes a connection between elite accomplishment and mass welfare that history does not support.","The claim itself has a surface plausibility: cultural and scientific achievements are durable and visible, and they are what later ages remember. Yet they measure the peaks a society produces rather than its general condition. Ancient Egypt produced monuments that still command admiration, but did so with a population that was overwhelmingly impoverished and unfree. A standard that counted only the pyramids would have to disregard the lives of nearly everyone who built them, which suggests that achievement alone cannot define greatness.","The reason is more seriously flawed, because achievement and widespread welfare do not reliably move together. The Soviet Union produced world-class scientists and launched the first human into orbit while much of its population endured shortages of basic goods. The accomplishment was genuine; the promised benefit to the majority did not follow. This single case is sufficient to refute the reason's causal premise: a state can achieve the spectacular precisely by concentrating resources that might otherwise have raised ordinary living standards. The pattern recurs wherever prestige projects are pursued for their own sake: a government may fund a celebrated space program or national monument while schools and clinics decay, so that the achievement, far from guaranteeing a good life, documents the diversion of resources away from it. Achievement and welfare are thus not merely distinct; they can stand in direct competition, which is the reverse of what the reason asserts.","It is true that elite achievement sometimes diffuses outward — a vaccine or a public-works program can improve many lives at once. But this observation actually concedes the opposing standard, for here the achievement matters because of its effect on people's welfare, not in itself. The reason thus quietly presupposes the very criterion — general well-being — that it claims to derive from achievement, which exposes the circularity at its core.","Claim and reason therefore fail together. If an indicator of national greatness is wanted, it is better sought where the reason inadvertently points: in how the majority of a nation's people actually live. Achievements deserve admiration, but a society that produces marvels atop widespread deprivation has demonstrated its priorities rather than its greatness."]},{"n":3,"title":"Courses Outside The Major","kind":"Two Views","prompt":"View 1: Universities should require every student to take a variety of courses outside the student's field of study. View 2: Universities should not force students to take any courses other than those that prepare them for jobs in their chosen fields.","ps":["Universities must decide how far to extend a student's required study beyond the chosen field. One view holds that every student should take a range of courses outside the major; the other holds that required study should be confined to career preparation. Each view captures a legitimate concern, but the first aligns more closely with the purpose of a university education.","The case for required breadth rests on the way significant problems and durable careers actually operate. Few consequential challenges fall within a single discipline: an engineer designing an algorithm that screens job applicants needs statistics and ethics as much as code, and a physician must weigh cost, culture, and communication alongside biology. Requiring an engineering student to study moral philosophy is therefore not a diversion from training but a component of it, since the problems she will face are not purely technical. Breadth cultivates the adaptability that long careers demand. The point is not merely that extra subjects are enriching but that narrow training ages quickly: the specific techniques a student masters may be obsolete within a decade, whereas the capacity to learn an unfamiliar field, acquired by being made to do so, retains its value. A curriculum confined to immediate job skills optimizes for a student's first position at the expense of every one that follows.","The opposing view deserves a serious hearing rather than dismissal. Students pay heavily for their education and frequently incur debt; time devoted to courses far from their goals can feel bought at considerable cost. A student committed to accounting may reasonably resent a mandatory seminar that delays her credential while adding to her loans. Where such requirements produce only reluctant attendance and quickly forgotten material, critics are right that they serve institutional ideals more than students' interests.","Yet this objection tells against poorly designed breadth, not against breadth as such. The appropriate response is to construct outside requirements that visibly connect to students' futures — quantitative reasoning, writing, ethics pertinent to their fields — rather than to abandon the aim. A university that trained only for a first job would betray its function, for it exists to prepare people for decades of changing work rather than to certify them for a single role. View 2's genuine warning, that breadth must not be imposed carelessly, ultimately reinforces View 1.","I therefore side with requiring courses outside the major, conditional on their being designed with evident purpose. The objective is not to disperse a student's attention but to widen it, so that the degree outlasts the particular labor market into which the student happens to graduate."]},{"n":4,"title":"Field By Job Availability","kind":"Recommendation","prompt":"College students should base their choice of a field of study on the availability of jobs in that field.","ps":["The recommendation to choose a field of study according to the availability of jobs is neither sound nor unsound in the abstract; its merit depends on the student's circumstances. In some situations it is prudent and even necessary, while in others it undermines the very preparation it is meant to secure.","The recommendation is most defensible where a student's resources are limited and the consequences of unemployment are severe. A first-generation student carrying substantial debt cannot treat a degree as a luxury; for her, a field with strong demand — nursing, accounting, software development — converts several costly years into dependable income and repaid loans. Here, attention to job availability is not cynical but responsible, since the burden of choosing an unemployable field would fall most heavily on the person least able to absorb it. Under such conditions, following the recommendation is clearly advantageous.","The same advice becomes damaging, however, when it overrides genuine aptitude in pursuit of a labor market that refuses to stand still. Students who force themselves into a \"safe\" field they neither enjoy nor excel at frequently underperform and disengage, finishing less employable than if they had developed a real strength. The market they pursued may also shift: many who entered apparently secure fields a decade ago found those roles reshaped by automation by graduation. A capable graduate with genuine skill, by contrast, tends to adapt across several careers. Chasing current openings can thus leave a student both dissatisfied and, paradoxically, less secure. The deeper difficulty is that job availability is a snapshot of the present projected onto a future it cannot predict; fields contract and expand on timescales shorter than a career, so a choice optimized for today's openings is frequently mismatched to the market a graduate actually enters.","What distinguishes the two cases is whether job data functions as a constraint or as the entire decision. The availability of jobs is essential information and should bound a student's choices, excluding paths with no viable future. It should not displace the more demanding questions of what a student is suited to and can sustain over decades, since aptitude and persistence are what ultimately generate employability.","The recommendation is accordingly sound as a filter and hazardous as a compass. A student who weighs the labor market alongside aptitude, rather than surrendering to it, will decide far better than one who follows either interest or income alone."]},{"n":5,"title":"Preserve Wilderness","kind":"Policy","prompt":"Nations should pass laws to preserve any remaining wilderness areas in their natural state, even if these areas could be developed for economic gain.","ps":["A law preserving remaining wilderness would produce consequences that are, on the whole, worth pursuing — though the absolute scope implied by \"any\" introduces complications. Implemented rigidly, the policy would secure substantial long-term benefits while imposing costs sharp enough that its wisdom depends on how the law is drafted.","The principal consequence of implementation is the protection of benefits that markets routinely undervalue. Wilderness sequesters carbon, filters water, and sustains species whose loss is irreversible; once a forest or wetland is developed, no subsequent decision can restore it. A binding law matters precisely because these benefits are diffuse and future-oriented, whereas development profits are concentrated and immediate. Absent such a law, the immediate reliably prevails — which is how so much wilderness has already been lost. Codifying protection prevents a sequence of individually reasonable decisions from accumulating into an irreversible collective loss. This asymmetry — reversible gains set against irreversible losses — is what justifies removing the decision from case-by-case bargaining: a benefit that can never be recovered warrants protection stronger than ordinary cost-benefit calculation, which systematically underweights whatever lies beyond the current generation's horizon.","An unqualified ban on developing any wilderness would, however, generate consequences its proponents may not intend. A nation might hold mineral or agricultural land essential to feeding or employing its population yet be legally forbidden to use it, displacing development toward countries with weaker protections — so that the global loss continues while its costs are merely relocated. Applied inflexibly, the rule could even obstruct infrastructure that reduces harm elsewhere, such as transmission lines for renewable energy. A law incapable of distinguishing a critical watershed from a degraded margin will sometimes protect little at great expense.","These consequences fall unevenly. Wealthy nations that have already industrialized can more easily afford strict preservation, while poorer nations asked to leave resources untouched bear the heavier burden — which is why an inflexible universal standard tends to be, as well as to feel, unjust. The policy's net effect therefore depends on whether it permits graded protection: absolute for the most ecologically vital areas, negotiated for the remainder.","Passing laws to preserve wilderness is sound policy, since the consequences of inaction are irreversible and markets will not avert them. But the consequences of an unqualified \"any\" argue for building flexibility into the law from the outset. Preservation should be the strong default — not a rule so rigid that it produces the very waste and injustice it seeks to prevent."]},{"n":6,"title":"Praise Positive, Ignore Negative","kind":"Claim / challenge","prompt":"The best way to teach—whether as an educator, employer, or parent—is to praise positive actions and ignore negative ones.","ps":["The claim that the best way to teach is to praise positive actions and ignore negative ones is appealing in its emphasis on encouragement, but it is mistaken. Effective instruction requires that errors be identified and corrected, not overlooked; praise alone, however motivating, cannot perform the work that honest feedback does.","Learning depends on knowing what one is doing wrong. A student of a language who is praised for fluent passages but never corrected on persistent grammatical errors will entrench those errors, mistaking repetition for mastery. The same holds in music, mathematics, and athletics: a coach who ignores a flawed technique allows it to harden into habit. Ignoring negative actions does not make them disappear; it withholds the information the learner most needs in order to improve. Feedback on error is not incidental to learning but constitutive of it, since improvement is largely a matter of detecting the gap between performance and standard and then closing it; remove the signal and the gap simply persists unseen.","The claim's defenders can offer a genuine argument. Harsh, punitive correction often demoralizes learners, and a relentless focus on failure can erode the confidence on which sustained effort depends; considerable evidence suggests that encouragement motivates more effectively than criticism. A teacher who dwells only on mistakes may produce anxious, risk-averse students who stop trying.","This argument is persuasive against harsh criticism, but it misidentifies the alternative. To correct an error is not to punish it: constructive feedback names a mistake while treating the learner as capable of fixing it, which is exactly what distinguishes it from humiliation. The real choice is not between praise and cruelty but between feedback that is both supportive and candid and feedback that is merely one or the other. Finland's admired schools, often cited for their encouraging climate, pair that encouragement with continual, specific correction rather than silence about error — which is why their students improve rather than merely feel good. The claim's underlying mistake is a false dichotomy: it treats praise and criticism as the only options and then rightly rejects cruelty, without noticing that candid, respectful correction is a third possibility superior to both.","The claim therefore captures half a truth: praise belongs in good teaching, and gratuitous negativity harms it. But instruction that ignores negative actions withholds the guidance improvement requires. The best teaching does not choose between encouragement and correction; it delivers correction in an encouraging form."]},{"n":7,"title":"Living Hero","kind":"Statement","prompt":"In this age of intensive media coverage, it is no longer possible for a society to regard any living man or woman as a hero.","ps":["Intensive media coverage now exposes every public figure to continuous scrutiny, and from this the statement concludes that heroism has become impossible: no one, fully observed, can sustain admiration. The conclusion is understandable but unfounded. What constant exposure destroys is not heroism itself but an idealized conception of the hero that heroism never actually required.","The statement's reasoning has force. Admiration of the traditional kind depended partly on distance: a hero was someone whose flaws remained unseen, permitting an uncomplicated reverence. Media coverage removes that distance, documenting the contradictions and failings of anyone prominent. If heroism demanded an unblemished figure, then such exposure would indeed render it obsolete.","But this conflates the collapse of an illusion with the collapse of heroism. Heroism consists in admirable action, not in freedom from fault, and coverage that reveals a person's ordinary weaknesses can also document their extraordinary conduct. Malala Yousafzai is scrutinized by a global press, yet the same coverage that captures her unremarkable moments also recorded her being shot for defending girls' education. The scrutiny did not prevent her from being regarded as heroic; it carried the evidence of her courage to a worldwide audience. The very mechanism the statement blames for destroying heroes is thus what allowed millions who would otherwise never have heard her name to recognize her as one; exposure and admiration are not opposing forces here but a single process seen from two sides.","Coverage, moreover, frequently creates heroes rather than dissolving them. During disasters and the recent pandemic, ordinary medical workers and volunteers became widely admired precisely because reporting carried their actions far beyond their own communities. A century earlier such heroism would have remained local and soon been forgotten; today it can be witnessed, verified, and honored at scale. The intensity capable of destroying a reputation can equally establish one on documented grounds, and recognition that rests on visible evidence is, if anything, sturdier than the reputation of figures whose virtues simply went unverified.","Admittedly, saturation coverage breeds cynicism, and scandal can crowd out genuine achievement; a public conditioned to expect every figure to fall may hesitate to admire anyone. But that hesitation reflects a change in our habits of attention, not the disappearance of heroes, and it presupposes a standard still worth meeting. The statement mistakes a more demanding form of recognition for the end of heroism. We now grant the title less readily, and to people seen in full — a hero who withstands that scrutiny is more real, not less possible."]},{"n":8,"title":"Fund Research With Unclear Consequences","kind":"Policy","prompt":"Governments should not fund any scientific research whose consequences are unclear.","ps":["The policy that governments should not fund scientific research whose consequences are unclear appeals to caution, but implementing it would be self-defeating. Because the consequences of genuine research are by definition difficult to foresee, the policy would withdraw support from precisely the inquiry most likely to yield significant discovery.","The first consequence of implementation would be the collapse of basic research. Fundamental science proceeds without knowing where it will lead: Alexander Fleming was not pursuing a cure for bacterial infection when a contaminated culture revealed penicillin, and the physicists who investigated quantum behavior could not have foreseen the transistor or the laser. A rule funding only research with foreseeable consequences would have excluded these inquiries at the outset, since their value became clear only in retrospect. The policy would thus defund the very work that has historically produced the greatest benefit. The paradox is structural rather than occasional: research whose consequences are clearest in advance is usually incremental, applying what is already known, while research capable of transforming a field is unclear precisely because it ventures beyond established understanding. To fund only the foreseeable is, in effect, to fund only the unimportant.","A second consequence would be a chilling effect on ambition. Researchers dependent on public funding would be pushed toward narrow, predictable projects whose outcomes can be stated in advance, discouraging the exploratory work on which long-term progress depends. Over time, a nation applying this standard would cede discovery to those willing to tolerate uncertainty. A generation of such caution would be invisible in its costs — not failed experiments, but the discoveries that were never attempted — which makes the policy's damage easy to overlook and all the more serious for it.","The policy is not wholly without merit, and a fair treatment must concede its legitimate core. Some research carries foreseeable and catastrophic risks — certain pathogen experiments, for instance — where unclear consequences are themselves grounds for restraint. But this argues for regulating a narrow category of demonstrably dangerous work, not for refusing to fund uncertainty as such. The sensible policy distinguishes the merely unpredictable from the plausibly catastrophic and restricts only the latter.","Implemented literally, then, the policy would sacrifice the open-ended research responsible for modern science in exchange for an illusion of control. Governments should indeed scrutinize research that threatens serious harm; they should not treat uncertainty itself as a reason to withhold support, for uncertainty is the ordinary condition of discovery."]},{"n":9,"title":"Imagination Vs Knowledge","kind":"Claim / challenge","prompt":"In most professions and academic fields, imagination is more important than knowledge.","ps":["Knowledge can be acquired and verified; imagination cannot be supplied on demand. In most modern fields, where information is more abundant and accessible than ever, the decisive advantage has shifted to those who can conceive of what to do with it. The claim that imagination is more important than knowledge is largely correct — though only once the relation between the two is made clear.","Imagination matters most because it determines which possibilities are pursued. Knowledge describes how things are; imagination proposes how they might be otherwise. When the iPhone was developed, nearly all of its components — touchscreens, processors, cellular radios — already existed as common technical knowledge. What did not exist was the imaginative act of combining them into a device that redefined an entire category. The knowledge was available to the whole industry; the imagination was not, and that difference determined the outcome.","The same distinction separates the exceptional from the merely competent within a discipline. Two physicists may possess identical knowledge, yet one reframes an intractable problem in a way no existing equation suggested. Einstein's recognition that time itself could vary did not follow from knowing more mechanics than his contemporaries; it followed from imagining a universe they could not picture. Knowledge furnished the materials, but imagination performed the decisive act. This is why fields crowded with equally knowledgeable practitioners are nonetheless led by a few: the shared body of knowledge cannot by itself explain who advances a field, and what distinguishes those who do is an imaginative capacity the knowledge does not confer.","The strongest objection is that imagination without knowledge is empty or dangerous: a physician who improvises without medical knowledge harms patients, and an engineer who defies the properties of materials builds structures that fail. The objection is correct that knowledge is necessary — but necessity is not importance. Oxygen is necessary to every achievement, yet we never credit it, because it is never scarce. Knowledge in most fields has likewise become abundant and teachable; what remains scarce, and therefore decisive, is the capacity to use it in an unprecedented way. The value of any resource tracks its scarcity relative to demand, and on that measure imagination has become the binding constraint while knowledge, for most purposes, has not.","Imagination and knowledge are not ultimately rivals, since every achievement requires both. But when we ask which more often accounts for the difference between the ordinary and the remarkable, the answer across most fields is the one that cannot be memorized."]},{"n":10,"title":"Suspend Arts Funding","kind":"Claim + Reason","prompt":"Claim: Nations should suspend government funding for the arts when significant numbers of their citizens are hungry or unemployed. Reason: It is inappropriate to use public resources to fund the arts when people's basic needs are not being met.","ps":["The claim urges nations to suspend public funding for the arts whenever significant numbers of citizens are hungry or unemployed, on the reasoning that it is inappropriate to fund the arts while basic needs go unmet. The claim has an intuitive moral appeal, but the reason on which it rests is flawed, and with it the claim.","The reason assumes a direct competition between funding the arts and meeting basic needs, as though money withdrawn from the former would materially relieve the latter. In most national budgets this is false: arts funding is a minute fraction of public spending, far too small for its suspension to make a meaningful difference to hunger or unemployment. The reason therefore misrepresents the choice, treating a negligible reallocation as though it were a serious instrument of relief.","The reason is further weakened by its assumption that the arts stand apart from material welfare. Public arts spending employs people — performers, technicians, teachers — and sustains industries that generate income and tourism. During the Great Depression, the United States funded artists directly through the Federal Art Project at the very height of unemployment, treating cultural work as a form of relief rather than a luxury opposed to it. The episode shows that funding the arts and addressing economic distress need not be opposed, contrary to the reason's central premise. If the arts can themselves employ the unemployed and circulate money through local economies, then funding them is not a withdrawal from the work of relief but one instrument of it — a possibility the reason's framing renders invisible.","A fair reading must grant the claim its strongest case: under genuinely extreme scarcity, where resources are insufficient for survival, reprioritization toward basic needs is defensible. But this describes a rare emergency, not the ordinary condition of \"significant numbers\" being hungry or unemployed, which persists even in wealthy nations that can plainly afford both. The concession thus narrows the claim rather than vindicating it. What the reason needed to establish was a general incompatibility between arts funding and basic needs; what it can support, at most, is a narrow exception for genuine emergencies, which is a far weaker conclusion than the claim requires.","Because the reason mischaracterizes the trade-off and ignores the economic role of the arts, it cannot support the broad claim it is offered to justify. Nations facing hardship should strengthen support for those in need; doing so rarely requires, and is seldom advanced by, dismantling their cultural life."]},{"n":11,"title":"Officials' Own Judgment","kind":"Recommendation","prompt":"Government officials should rely on their own judgment rather than unquestioningly carry out the will of the people they serve.","ps":["Whether government officials should act on their own judgment or defer to public opinion reflects a genuine tension within representative democracy, in which officials serve simultaneously as expert decision-makers and as agents of the electorate. A categorical endorsement of independent judgment is therefore untenable. Whether such judgment is advantageous depends on the nature of the decision — specifically, on whether it is primarily a question of fact and rights or of values and priorities.","Independent judgment is warranted where a decision depends on specialized knowledge or implicates the rights of a minority. Public opinion is frequently formed under conditions of incomplete information and heightened emotion, which makes it an unreliable guide in technical or crisis situations. During the initial phase of a public-health emergency, popular sentiment may favor measures that are reassuring but epidemiologically counterproductive; an official who acts on the available evidence serves the public interest more faithfully than one who echoes the prevailing anxiety. The protection of minority rights presents an analogous case: had officials during the civil-rights era merely executed the majority's will, legally sanctioned segregation would have persisted considerably longer. In such circumstances, independent judgment is a form of service to the public rather than a departure from it.","The recommendation becomes unsound, however, where a decision concerns competing values rather than verifiable facts. How a community should balance economic development against the preservation of tradition admits of no expert answer; it is a determination of collective preference. An official who substitutes personal conviction for the informed preferences of constituents in such cases does not exercise sound judgment but disregards the consent from which official authority derives — a confusion of the official's taste with the public good. An expert may know more about how to build a highway, but not whether the community would prefer to have one at all; on that question her expertise confers no special authority.","The distinction turns on a single criterion: whether the decision is resolved by knowledge and principle or by value and priority. On the former, reliance on independent judgment is appropriate, since expertise is precisely what officials are selected to supply. On the latter, deference to the public is required, since democratic legitimacy originates in the governed rather than in the competence of those who govern.","A blanket endorsement of independent judgment is consequently too undifferentiated to be useful. The more defensible principle is conditional: officials should rely on their own judgment in matters of fact and right, defer to public will in matters of value, and possess the discernment to distinguish the two."]},{"n":12,"title":"Knowing The Past","kind":"Statement","prompt":"Knowing about the past cannot help people to make important decisions today.","ps":["The statement asserts that knowledge of the past cannot assist important decisions in the present. This is implausible as a general claim. While history offers no exact templates and can mislead when applied naively, it routinely informs present judgment by revealing patterns, consequences, and errors that would otherwise have to be rediscovered at cost.","Knowledge of the past most clearly helps by showing how comparable situations have unfolded. When the financial crisis of 2008 threatened a collapse of the banking system, policymakers acted on lessons drawn from the 1930s, when inaction had deepened the Great Depression; understanding that earlier failure shaped the decision to intervene rather than let institutions fall. The past did not dictate the response, but it supplied the reasoning that informed it — precisely the kind of help the statement denies. Without that historical knowledge the decision would have been approached as if for the first time, forcing policymakers to relearn under pressure a lesson the record already contained.","History also helps by exposing the likely consequences of recurring choices. A government weighing a costly military intervention can study the trajectories of previous ones, and a society debating a public-health measure can draw on how earlier epidemics were contained or mishandled. In each case the past functions not as prophecy but as evidence, narrowing uncertainty about what a given course of action tends to produce. In this role the past does not remove the need for judgment but equips it, replacing guesswork about consequences with a record of how comparable choices have actually turned out.","The statement does capture a real danger, which must be granted. History never repeats exactly, and decision-makers who apply its analogies mechanically can be badly misled — the familiar error of generals preparing to fight the previous war. Knowledge of the past can mislead when the present differs in ways the analogy obscures. But this is an argument for using history carefully, not for the stronger claim that it cannot help at all. A tool that can be misused is not thereby useless; the remedy for a bad analogy is a better reading of history, not the abandonment of history altogether.","Properly understood, the past is a source of reasoning rather than of ready-made answers. It cannot be transcribed onto the present, but it can discipline present judgment by showing what has worked, what has failed, and why. A decision made in deliberate ignorance of the past is not more objective; it is merely less informed."]},{"n":13,"title":"Learn From Agreement Or Disagreement","kind":"Two Views","prompt":"View 1: We learn more from people whose views we share. View 2: We learn more from people whose ideas differ from ours.","ps":["The question is whether we learn more from those who share our views or from those who oppose them. The first view points to the depth that shared understanding allows; the second, to the correction that disagreement provides. Both describe real benefits, but the second aligns more closely with how understanding is tested and improved.","There is a genuine case for learning from those we agree with. A shared framework lets discussion proceed further and faster, because participants need not relitigate basic premises; a student and a mentor in the same tradition can reach advanced questions that strangers to each other's assumptions could not. Agreement enables the cumulative, specialized learning on which expertise depends. Without some agreement, every exchange would stall at first principles and never reach the frontier where new understanding is actually won.","Yet disagreement does something agreement cannot: it exposes the weaknesses that shared conviction conceals. When our views go unchallenged, we mistake familiarity for proof and leave our assumptions untested. An opponent forces us to articulate and defend what we had merely assumed, and sometimes to abandon it. Scientific knowledge advances in large part through this adversarial process — claims are subjected to hostile scrutiny in peer review precisely because a sympathetic audience would let errors pass. The discomfort of being contradicted is the price of discovering where one is wrong. Agreement, by contrast, is comfortable precisely because it demands nothing: it confirms rather than corrects, and confirmation, however satisfying, adds little we did not already hold.","The strongest objection to favoring disagreement is that unmoderated conflict produces heat rather than light. This is true, but it identifies a condition for productive disagreement rather than a defect in it: we learn from opponents only when enough is shared — a common language, a standard of evidence — to make the exchange intelligible. View 1's insight is thus absorbed into View 2, since common ground is the platform from which fruitful disagreement proceeds rather than a rival source of learning that outranks it. Shared premises and productive disagreement thus stand in a relation of means to end: we cultivate common ground not for its own sake but because it makes the more valuable confrontation of ideas possible.","I therefore align with the view that we learn more from those whose ideas differ from ours. Agreement deepens what we already believe; disagreement reveals when those beliefs are mistaken — and recognizing error is the more valuable, because harder-won, form of learning."]},{"n":14,"title":"Behavior And Outside Forces","kind":"Claim / challenge","prompt":"People's behavior is largely determined by forces not of their own making.","ps":["The claim that behavior is largely determined by forces not of our own making is, with an important qualification, defensible. The circumstances into which people are born exert a powerful and underappreciated influence on what they do. But \"largely\" must not be read as \"wholly\": these forces shape behavior strongly without extinguishing the agency that operates within them.","The evidence that external forces shape behavior is substantial. A person's language, religion, values, and opportunities are overwhelmingly inherited from a family and society they did not choose, and outcomes track these conditions closely. Children born into poverty face measurably worse prospects in health, education, and employment, not because of individual failings but because of circumstances arranged before they could act. To ignore these forces is to misread as personal merit or fault what is in large part the product of unchosen conditions. The same behavior — diligence, say, or its absence — can issue from entirely different causes depending on the resources and expectations a person was handed, which is why outwardly identical choices are not equally free.","The most compelling objection is that this view dissolves responsibility. If behavior is determined by forces beyond our control, praise and blame appear unjust, and the many individuals who transcend their circumstances — who escape poverty or resist the prejudices of their time — become inexplicable. A claim that erased human agency would conflict with both moral practice and evident fact.","This objection succeeds only against a stronger claim than the one actually made. \"Largely determined\" is not \"entirely determined\": to say that forces heavily shape behavior is to describe the odds a person faces, not to deny that they choose within them. The existence of individuals who overcome adverse circumstances is consistent with those circumstances making such outcomes rarer — which is exactly what the influence of unchosen forces would predict. Acknowledging structure explains the distribution of outcomes without denying the choices that occur inside it. Determinism and agency appear opposed only when the claim is read as absolute; understood as a statement about degree, it leaves room for both the weight of circumstance and the reality of choice.","The claim is therefore largely correct once \"largely\" is taken seriously. External forces set the terrain on which behavior unfolds, decisively enough that ignoring them distorts our judgments of others. What they do not do is remove the agency that, constrained but real, still determines how individuals act within the terrain they were given."]},{"n":15,"title":"Understand A Society Via Its Cities","kind":"Statement","prompt":"To understand the most important characteristics of a society, one must study its major cities.","ps":["The statement holds that understanding a society's most important characteristics requires studying its major cities. Cities do concentrate much of what is revealing about a society, and to that extent the claim has merit. But it overstates the case: major cities also distort and omit, so that studying them alone yields an incomplete and sometimes misleading portrait.","There is a strong sense in which the claim is right. Cities concentrate a society's economic activity, cultural production, and political power, making its defining tendencies unusually legible. A visitor who studies a nation's largest city encounters its commerce, its arts, its ambitions, and its tensions compressed into a single setting; much of what a society aspires to and struggles with is visible there in concentrated form. For characteristics tied to wealth, innovation, and public life, the city is indeed the natural place to look. Precisely because so much is gathered there, the city offers an efficiency that no scattered survey of the countryside could match, compressing a society's energies into a form that can actually be studied.","Yet major cities are unrepresentative in ways that matter. They tend to be wealthier, more diverse, and more cosmopolitan than the societies around them, so that studying only Paris or Shanghai would miss the rural and provincial life in which much of a nation's population and tradition reside. A society's most important characteristics may include exactly what its cities exclude — the values of those who never arrived, and the inequalities between center and periphery that urban prosperity can obscure. A portrait drawn only from the metropolis risks mistaking the ambitions of a society's most mobile and advantaged members for the condition of the whole.","The claim's weakness lies partly in its key terms. What counts as a society's \"most important characteristics\" is not self-evident: if they include its distribution of opportunity, its treatment of minorities, or the texture of ordinary life beyond the metropolis, then the city is a poor guide to them. Understanding, properly construed, requires attending to what a society conceals as much as to what it displays, and cities display selectively.","The statement is thus right that cities are indispensable to understanding a society and wrong that they are sufficient. Major cities are a necessary lens, not a complete one. A full account must set what the city reveals against what it omits — otherwise one mistakes a society's most visible characteristics for its most important ones."]}]

  const by={1:{n:0,of:0},2:{n:0,of:0},3:{n:0,of:0}};
  t.forEach(w=>{ const b=FREQ.t[w]; by[b].of++; if(A.has(w)) by[b].n++; });
  return {asked:A, total:t.length, done:t.filter(w=>A.has(w)).length, by};
}
// Which words a single question would add, so you can see what a paste bought you
// Which words a question adds, told apart from the ones already in the bank, so the
// count can be checked against the list rather than taken on trust.
function coverNote(q, seenBefore, before, after){
  const got = questionWords(q);
  if(!got.length) return 'None of its options are on your word list, so the count is unchanged.';
  const banded = got.filter(w => FREQ.t[w]);
  const unbanded = got.filter(w => !FREQ.t[w]);
  const fresh = banded.filter(w => !seenBefore.has(w));
  const already = banded.filter(w => seenBefore.has(w));
  let out = `${after.done} of ${after.total} Most-likely words covered`;
  out += after.done>before ? ` — up ${after.done-before}.` : ', unchanged.';
  if(fresh.length) out += ` New here: ${fresh.join(', ')}.`;
  if(already.length) out += ` Already counted: ${already.join(', ')}.`;
  if(unbanded.length) out += ` Outside the bands, so not counted: ${unbanded.join(', ')}.`;
  return out;
}
// Under each option, once you have answered: what the word means, and the headword
// it belongs to when the option is an inflected form of one. Nothing if it is not on the list.
function optGloss(opt){
  const b = baseWord(opt);
  if(!b) return '';
  const e = AZ.find(x=>x.w===b);
  if(!e || !e.d) return '';
  const bare = String(opt).toLowerCase().replace(/[.,;:!?"']/g,'').trim();
  const stem = b!==bare ? `<b>${b}</b> · ` : '';
  return `<div class="ogl">${stem}${e.d}${e.vi?` <span class="vi">· ${e.vi}</span>`:''}</div>`;
}
function questionWords(q){
  const opts=[];
  if(q.k==='rc') q.qs.forEach(sub=>opts.push(...sub.o));
  else q.o.forEach(set_=>opts.push(...set_));
  return [...new Set(opts.map(baseWord).filter(Boolean))];
}
function askedWords(){
  const set=new Set();
  // Every option counts, not only the correct one: choosing between six words
  // means reading all six, and a distractor you had to rule out was tested too.
  ALLQ().forEach(q=>{
    const opts=[];
    if(q.k==='rc') q.qs.forEach(sub=>opts.push(...sub.o));
    else q.o.forEach(set_=>opts.push(...set_));
    opts.forEach(w=>{ const b=baseWord(w); if(b) set.add(b); });
  });
  return set;
}

let CLUSTER_OF = {};
function rebuildIndexes(){
  CLUSTER_OF = {};
  DATA.forEach(c=>c.w.forEach(x=>CLUSTER_OF[x[0]]=c.n));
  ALL.length=0; TAUGHT.length=0; AZ.length=0;
  DATA.forEach(c=>c.w.forEach(x=>{

// A question may use an inflected form of a listed word — distorting for distort,
// subverted for subvert. Map it back so the answer still feeds the schedule.
function baseWord(raw){
  if(!raw) return null;
  // An answer written in a book is rarely the bare headword: it may be "reverence for",
  // "to abate", "a diatribe", "distorting". Peel the wrapping off before giving up.
  let w = String(raw).toLowerCase().replace(/[.,;:!?"'\u2018\u2019\u201c\u201d()]/g,' ').trim();
  const hit = x => (x && CLUSTER_OF[x]!==undefined) ? x : null;
  // Some list entries carry a part-of-speech label, like "precipitate (adj)".
  // An answer written plainly should still find them.
  const labelled = x => {
    if(!x) return null;
    const k = Object.keys(CLUSTER_OF).find(w =>
      w.indexOf('(')>0 && w.slice(0, w.indexOf('(')).trim() === x);
    return k || null;
  };
  // Suffixes a word can carry, in both directions: a question may answer with
  // "reverence" where the list holds "reverent", or with "distorting" for "distort".
  const SUF = ['','e','s','es','ed','d','ing','ly','ness','ity','ety','ence','ance','ent','ant',
               'ion','tion','ation','ition','sion','ive','ous','ious','al','ic','ical','ment',
               'ism','ist','ize','ise','ate','y','ful','able','ible','acy','cy','ry','ude'];
  const inflect = x => {
    if(!x || x.length<4) return null;
    if(hit(x)) return x;
    const stems=new Set([x]);
    SUF.forEach(suf=>{
      if(suf && x.endsWith(suf) && x.length-suf.length>=3){
        const st=x.slice(0,x.length-suf.length);
        stems.add(st); stems.add(st+'e'); stems.add(st+'y');
        if(st.length>3 && st[st.length-1]===st[st.length-2]) stems.add(st.slice(0,-1));
      }
    });
    // A candidate only counts if it shares a real prefix with the word. Without this,
    // "come" loses its e, becomes "com", and recombines into "comity" — a different word.
    const shared=(a,b)=>{ let i=0; while(i<a.length && i<b.length && a[i]===b[i]) i++; return i; };
    for(const st of stems){
      if(st.length<4) continue;
      for(const suf of SUF){
        const cand=st+suf;
        if(cand.length<4 || !hit(cand)) continue;
        if(shared(x,cand) >= Math.min(6, cand.length, x.length)) return cand;
      }
    }
    return null;
  };
  if(hit(w)) return w;
  let r = labelled(w); if(r) return r;
  // "precipitate adj" once the brackets are stripped
  const nolabel = w.replace(/\b(adj|adv|n|v|noun|verb|adjective)\b/g,'').trim();
  if(nolabel!==w){ if(hit(nolabel)) return nolabel; r=labelled(nolabel); if(r) return r; }
  r = inflect(w); if(r) return r;

  const LEAD = new Set(['a','an','the','to','be','been','being','is','are','was','were','very','more','most','so','too']);
  const TAIL = new Set(['for','to','of','with','on','at','in','from','against','upon','by','about','into',
                        'over','toward','towards','up','out','off','down','away','oneself','himself','herself','itself','themselves']);
  let parts = w.split(/[\s\u2013\u2014-]+/).filter(Boolean);
  while(parts.length>1 && LEAD.has(parts[0])) parts.shift();
  while(parts.length>1 && TAIL.has(parts[parts.length-1])) parts.pop();
  const joined = parts.join(' ');
  if(hit(joined)) return joined;
  r = inflect(joined); if(r) return r;
  if(parts.length>1 && hit(parts.join('-'))) return parts.join('-');
  // a phrase whose head word is the one on the list
  for(const p of parts){ if(hit(p)) return p; const q=inflect(p); if(q) return q; }
  return null;
}

/* ================= scheduler =================
   Simplified DSR model, after FSRS: each word carries
   S  stability  — days until recall probability falls to ~90%
   D  difficulty — 1 easy .. 10 hard, moves with your answers
   L  lapses     — times you have forgotten it after learning it
   Target retention 0.90. Interval = S.                            */
const DAY = 864e5, now = () => Date.now();
let P = {};                                   // word -> {S,D,L,t}
const rec = w => P[w] || null;

let LOG = [];                                 // rolling record of the last 400 answers
let DAYS = [];                                // every study day, as day numbers
let QSTAT = {};                               // question text -> {n attempts, w wrong}
// A drill covers its whole set once, in a fixed shuffled order, and remembers where
// you stopped. Taking a random 40 each time meant some words were asked three times
// and others never.
let SESS = {};
const SKEY = 'ascent-sessions-v1';
function loadSess(){ try{ const r=localStorage.getItem(SKEY); if(r) SESS=JSON.parse(r)||{}; }catch(e){} }
function saveSess(){ try{ localStorage.setItem(SKEY, JSON.stringify(SESS)); }catch(e){} }
function sessionDeck(key, words, restart){
  const names = words.map(w=>w.w||w[0]);
  const cur = SESS[key];
  if(!restart && cur && cur.i < cur.order.length){
    const valid = cur.order.filter(n=>names.includes(n));
    if(valid.length === cur.order.length) return {order:cur.order, i:cur.i, resumed:cur.i>0};
  }
  const order = shuffle(names);
  SESS[key] = {order, i:0, at:now()}; saveSess();
  return {order, i:0, resumed:false};
}
function sessionAdvance(key){
  const c=SESS[key]; if(!c) return;
  c.i++; c.at=now(); saveSess();
}
function sessionClear(key){ delete SESS[key]; saveSess(); }
function sessionAt(key){ const c=SESS[key]; return c ? {i:c.i, n:c.order.length} : null; }
function resumeLabel(key, total){
  const a=sessionAt(key);
  return (a && a.i>0 && a.i<a.n) ? ` · resume at ${a.i+1}` : '';
}
function byName(n){ const e=AZ.find(x=>x.w===n); return e?[e.w,e.d,e.n,e.vi]:null; }
const qkey = q => q.t;
function recordQ(q, ok){
  const k = qkey(q);
  const r = QSTAT[k] || (QSTAT[k] = {n:0, w:0});
  r.n++; if(!ok) r.w++;
  dirty = true; queueSave();
}
function markDay(){
  const d = dayOf(now());
  if (DAYS[DAYS.length-1] !== d){ DAYS.push(d); DAYS.sort((a,b)=>a-b); dirty = true; }
}
function streaks(){
  if(!DAYS.length) return {total:0, current:0, best:0};
  let best=1, run=1;
  for(let i=1;i<DAYS.length;i++){
    if(DAYS[i]===DAYS[i-1]+1){ run++; best=Math.max(best,run); } else run=1;
  }
  const today = dayOf(now());
  const last = DAYS[DAYS.length-1];
  const current = (last===today || last===today-1) ? run : 0;
  return {total: DAYS.length, current, best: Math.max(best,current)};
}
function logAnswer(w, ok){
  markDay();
  LOG.push({w, ok:ok?1:0, t:now()});
  if(LOG.length>400) LOG = LOG.slice(-400);
}
// Which study-day a moment belongs to.
// Uses LOCAL midnight, not UTC, and rolls over at 4am so that a session
// running past midnight still counts as the evening it started.
const ROLLOVER = 4;                              // hours after local midnight
function dayOf(t){
  const d = new Date(t - ROLLOVER*3600000);      // shift back so 4am is the boundary
  return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY);
}
function grade(w, ok){
  logAnswer(w, ok);
  const r = rec(w);
  if (!r){ P[w] = { S: ok ? 1 : 0.4, D: ok ? 5 : 6.5, L: 0, m: ok?0:1,
                    cs: ok?1:0, n: ok?1:0, d0: dayOf(now()), t: now() }; }
  else if (ok){
    // a review only counts as a rep if it lands on a new day — drilling the same
    // card five times in one sitting is not five nights of remembering
    const newDay = dayOf(now()) !== (r.d0 ?? -1);
    if (newDay){ r.n = (r.n||0) + 1; r.cs = (r.cs||0) + 1; r.d0 = dayOf(now()); }
    // reviewing long before it was due earns less stability (retrievability was high)
    const due = r.t + r.S*DAY;
    const early = now() < due ? Math.max(0.25, (now()-r.t) / (due-r.t || 1)) : 1;
    const growth = 1 + (0.25 + (10 - r.D) * 0.13) * early;
    r.S = Math.min(400, Math.max(1, r.S * growth));
    r.D = Math.max(1, r.D - 0.18);
    r.t = now();
  } else {
    r.S = Math.max(0.35, r.S * 0.28);          // forgetting collapses stability
    r.D = Math.min(10, r.D + 1.3);
    r.L = (r.L||0) + 1;                        // lapse: forgot it after learning it
    r.m = (r.m||0) + 1;                        // miss: any wrong answer at all
    r.cs = 0;                                  // the clean streak starts again
    r.n = Math.max(0, (r.n||0) - 1);
    r.t = now();
  }
  dirty = true; queueSave();
}
const dueAt = r => r.t + r.S * DAY;
const isDue = w => { const r = rec(w); return r ? dueAt(r) <= now() : false; };

/* four states, as requested */
const NEW='new', SHAKY='shaky', LEARNING='learning', KNOWN='known';
const misses = r => r.m!==undefined ? r.m : (r.L||0);
const CLEAR = 2;                               // clean reviews, on separate days, to leave the weak group
const streak = r => r.cs||0;
const recovered = r => streak(r) >= CLEAR;
let REPS = 5;
let NORC = false;                              // leave reading questions out of the full test                                  // successful reviews, on separate days, to count as held
function loadReps(){ try{ const r=localStorage.getItem('ascent-reps'); if(r) REPS=Math.max(2,Math.min(12,+r)); }catch(e){} }
function saveNoRC(){ try{ localStorage.setItem('ascent-norc', NORC?'1':'0'); }catch(e){} }
function loadNoRC(){ try{ NORC = localStorage.getItem('ascent-norc')==='1'; }catch(e){} }
function saveReps(){ try{ localStorage.setItem('ascent-reps', String(REPS)); }catch(e){} }
function state(w){
  const r = rec(w);
  if (!r) return NEW;
  // A word escapes the weak group by being answered correctly CLEAR times on
  // separate days. The lifetime miss count is kept, but it stops being a sentence.
  if ((misses(r) >= 3 || r.D >= 7.5) && !recovered(r)) return SHAKY;      // học rồi nhưng quên nhiều
  // Holding is also reachable after a recovery. Requiring a near-clean lifetime
  // record would have barred any word you ever missed twice, however well you
  // know it now.
  if ((r.n||0) >= REPS && (misses(r) <= 1 || recovered(r))) return KNOWN;
  return LEARNING;                                     // học rồi quên ít
}

const COLOUR = {new:'var(--paper2)', shaky:'var(--weak)', learning:'var(--learn)', known:'var(--solid)'};

/* ================= storage =================
   Standalone build: progress lives in this browser via localStorage,
   with manual export/import so you can move it between devices.     */
const LSKEY = 'ascent-progress-v2';
let saveTimer=null, dirty=false;
function queueSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(save,600); }
function save(){
  if(!dirty) return;
  try{ localStorage.setItem(LSKEY, JSON.stringify({p:P, log:LOG, days:DAYS, qs:QSTAT, at:now(), v:6})); dirty=false; setSync(); }
  catch(e){ setSync('Browser storage is full or blocked — export your progress'); }
}
function load(){
  try{
    const raw = localStorage.getItem(LSKEY);
    if(!raw){ setSync(); return; }
    const d = JSON.parse(raw);
    if(d && d.p){
      if(d.log) LOG = d.log;
      if(d.days) DAYS = d.days;
      if(d.qs) QSTAT = d.qs;
      if(d.v>=2){
        P = d.p;
        // backfill fields added in later builds so nothing regresses
        Object.values(P).forEach(r=>{
          if(r.m === undefined) r.m = r.L || 0;               // misses: fall back to lapses
          if(r.n === undefined){                               // clean reps: infer from stability
            const S = r.S || 1;
            r.n = S >= 14 ? 5 : S >= 8 ? 4 : S >= 4 ? 3 : S >= 2 ? 2 : 1;
          }
          if(r.d0 === undefined) r.d0 = dayOf(r.t || now()) - 1;
        });
        dirty = true;
      }
      else Object.entries(d.p).forEach(([w,o])=>{
        const b=o.b||0; if(!b) return;
        P[w]={S:[0,1,2,4,9,21][b]||1, D:6-b*0.6, L:0, t:now()-1};
      });
    }
  }catch(e){ setSync('Saved progress could not be read'); }
  setSync(); render();
}
function setSync(msg){

/* ================= data helpers ================= */
const ALL = [], TAUGHT = [];
function tally(list){
  const t={new:0,shaky:0,learning:0,known:0};
  list.forEach(x=>t[state(x.w)]++); return t;
}
function clusterStats(c){
  const open = c.w.filter(x=>x[1]).map(x=>({w:x[0]}));
  return {...tally(open), t:open.length, n:c.w.length};
}
/* review queue: interleaved across clusters, shaky words first */
function queue(limit){
  const due = TAUGHT.filter(x=>isDue(x.w));
  const rank = x => state(x.w)===SHAKY ? 0 : 1;
  due.sort((a,b)=> rank(a)-rank(b) || dueAt(rec(a.w))-dueAt(rec(b.w)));
  const out = interleave(due);
  return limit ? out.slice(0,limit) : out;
}
function interleave(list){                     // avoid two words from one cluster in a row
  const byC = {}; list.forEach(x => (byC[x.c] ||= []).push(x));
  const keys = Object.keys(byC); const out=[];
  while(out.length < list.length){
    let placed=false;
    for(const k of keys){ if(byC[k].length){ out.push(byC[k].shift()); placed=true; } }
    if(!placed) break;
  }
  return out;
}

function profileSVG(){
  const W=860,H=150,pad=6;
  const pts = DATA.map((c,i)=>{
    const s=clusterStats(c);
    const frac = s.t ? (s.known + s.learning*0.55 + s.shaky*0.25)/s.t : 0;
    return [pad+i*(W-2*pad)/(DATA.length-1), H-18-frac*(H-40), s.t>0];
  });
  const line = pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const area = line+` L${pts[pts.length-1][0].toFixed(1)},${H-18} L${pts[0][0].toFixed(1)},${H-18} Z`;
  let contours='';
  for(let i=1;i<=4;i++){const y=H-18-i*(H-40)/4;
    contours+=`<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="var(--contour)" stroke-width=".7" stroke-dasharray="1 5"/>`;}
  const dots = pts.filter(p=>p[2]).map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.4" fill="var(--route)"/>`).join('');
  return `<div class="profile"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Your progress across 49 clusters">
    ${contours}<path d="${area}" fill="var(--route)" opacity=".13"/>
    <path d="${line}" fill="none" stroke="var(--route)" stroke-width="1.6" stroke-linejoin="round"/>${dots}
    <line x1="${pad}" y1="${H-18}" x2="${W-pad}" y2="${H-18}" stroke="var(--contour2)" stroke-width="1"/></svg></div>`;
}

function quizView(){
  const v=view, d=v.deck;
  if(v.i>=d.length) return doneScreen(`${v.score} of ${d.length} right`, v.c);
  const x=d[v.i];
  // In mixed mode the direction flips at random, so you cannot settle into one
  // habit: sometimes the meaning is given and you pick the word, sometimes the
  // reverse. Recognising a word is easier than producing it, and the test wants both.
  // A cluster is a set of words that share a meaning. Offering four definitions,
  // three of them from other clusters, would let you answer from the theme alone.
  // So a cluster quiz only ever runs meaning-to-word. Mixed decks run both ways.
  if(!v.dir) v.dir = v.c ? 'd2w' : (Math.random()<0.5 ? 'd2w' : 'w2d');
  const w2d = v.dir==='w2d';
  if(!v.opts){
    const home = CLUSTER_OF[x[0]];
    const banned = new Set(CONFUSABLE[x[0]] || []);
    // If every word in the deck shares a first letter, the distractors must share it
    // too. Otherwise the one word starting with S gives itself away before you read it.
    const letter = v.letter;
    let pool = TAUGHT.filter(y => y.d && y.w!==x[0] && !banned.has(y.w)
                 && (letter ? y.w[0].toLowerCase()===letter : y.c!==home));
    if(letter && pool.length<3)
      pool = TAUGHT.filter(y => y.d && y.w!==x[0] && y.c!==home && !banned.has(y.w));
    v.opts = shuffle([x, ...shuffle(pool.map(y=>[y.w,y.d,y.n,y.vi])).slice(0,3)]);
  }
  const label = (w2d ? ' · word to meaning' : ' · meaning to word')
              + (v.letter ? ` · all in ${v.letter.toUpperCase()}` : '');
  let h=`<button class="back lab" id="bk">← ${v.back ? backLabel(v) : (v.c?'Cluster':'Route')}</button>
    <div class="prog">${v.i+1} of ${d.length} · ${v.score} right${label}</div>`;
  h += w2d
    ? `<p class="qp"><span class="cw" style="font-size:34px">${x[0]}</span></p>
       <div class="hint lab" style="margin:-4px 0 12px">Which meaning is it?</div><div class="opts">`
    : `<p class="qp">${x[1]}</p><div class="opts">`;
  v.opts.forEach((o,i)=>{
    let cls = w2d ? 'opt def' : 'opt';
    if(v.picked!==null){ if(o[0]===x[0]) cls+=' right'; else if(i===v.picked) cls+=' wrong'; }
    h+=`<button class="${cls}" data-i="${i}" ${v.picked!==null?'disabled':''}>${w2d?o[1]:o[0]}</button>`;
  });
  h+='</div>';
  if(v.picked!==null){
    h+=`<div class="fb"><b>${x[0]}</b> — ${x[1]}${x[3]?`<br><span class="vi">${x[3]}</span>`:''}${x[2]?`<br>${x[2]}`:''}</div>`;
    const wrong = v.opts.filter(o=>o[0]!==x[0]);
    h+=`<div class="why"><span class="lab whyh">The others</span>`;
    wrong.forEach(o=> h+=`<div class="wl"><b>${o[0]}</b> ${o[1]}${o[3]?` <span class="vi">· ${o[3]}</span>`:''}</div>`);
    h+=`</div><div class="acts"><button class="btn pri" id="nx">Next</button></div>`;
  }
  app.innerHTML=h;
  document.getElementById('bk').onclick=()=>{view = v.back ? backTo(v) : (v.c?{name:'cluster',c:v.c}:{name:'route'});render();};
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    v.picked=+b.dataset.i;
    const ok=v.opts[v.picked][0]===x[0];
    if(ok)v.score++; grade(x[0],ok); render();
  });
  const nx=document.getElementById('nx');
  if(nx) nx.onclick=()=>{ if(v.skey) sessionAdvance(v.skey);
    v.i++;v.picked=null;v.opts=null;v.dir=null;render();};
}

function rcView(){
  const v=view, q=v.qs[v.i];
  const sub=q.qs[v.sub||0], n=q.qs.length;
  const multi = sub.m==='multi';
  if(!v.sel) v.sel = [];
  let h=`<button class="back lab" id="bk">← Route</button>
    <div class="prog">Question ${v.i+1} of ${v.qs.length} · Reading Comprehension${q.mine?' · yours':''} · ${v.score} right</div>
    ${(()=>{const rc=ALLQ().filter(q=>q.k==='rc').length;
      return rc ? `<div class="hint lab" style="margin:-4px 0 10px">Reading questions:
        <button class="del" id="norc" style="color:var(--route)">${NORC?'off — turn on':'on — turn off'}</button></div>` : '';})()}
    <div class="passage">${q.p}</div>
    ${n>1?`<div class="subq">Question ${(v.sub||0)+1} of ${n} on this passage</div>`:''}
    <p class="qp">${sub.t}</p>
    ${multi?`<div class="hint lab" style="margin:-8px 0 12px">Select every choice that applies</div>`:''}
    <div class="opts">`;
  sub.o.forEach((o,i)=>{
    let cls='opt def';
    if(v.done){
      const right = multi ? sub.a.includes(i) : sub.a===i;
      const chose = v.sel.includes(i);
      if(right) cls+=' right'; else if(chose) cls+=' wrong';
    } else if(v.sel.includes(i)) cls+=' picked';
    h+=`<button class="${cls}" data-i="${i}" ${v.done?'disabled':''}>${o}</button>`;
    if(v.done) h+=optGloss(o);
  });
  h+='</div>';
  if(!v.done){
    const ready = multi ? v.sel.length>0 : v.sel.length===1;
    h+=`<div class="acts"><button class="btn pri" id="chk" ${ready?'':'disabled'}>Check</button></div>`;
  } else {
    h+=`<div class="fb">${sub.e}</div>
        <div class="acts"><button class="btn pri" id="nx">${(v.sub||0)+1<n?'Next question on this passage':'Next'}</button></div>`;
  }
  app.innerHTML=h;
  document.getElementById('bk').onclick=()=>{view={name:'route'};render();};
  const nrc=document.getElementById('norc');
  if(nrc) nrc.onclick=()=>{ NORC=!NORC; saveNoRC();
    view={name:'verbal', qs:null, i:0, score:0, sel:[], done:false, sub:0}; render(); };
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    if(multi){ const k=v.sel.indexOf(i); if(k>=0) v.sel.splice(k,1); else v.sel.push(i); }
    else v.sel=[i];
    render();
  });
  const chk=document.getElementById('chk');
  if(chk) chk.onclick=()=>{
    const ok = multi
      ? v.sel.slice().sort().join()===sub.a.slice().sort().join()
      : v.sel[0]===sub.a;
    if(ok) v.score++;
    recordQ({t:q.p.slice(0,60)+'::'+(v.sub||0)}, ok);
    v.done=true; render();
  };
  const nx=document.getElementById('nx');
  if(nx) nx.onclick=()=>{
    if((v.sub||0)+1<n){ v.sub=(v.sub||0)+1; }
    else { v.i++; v.sub=0; }

  };
}

  let h=`<button class="back lab" id="bk">← Route</button>

    ${q.syn ? `<p class="qp">${q.t ? q.t.replace(q.syn, `<u>${q.syn}</u>`) : ''}</p>
        <div class="synq">Closest in meaning to <b>${q.syn}</b></div>` 
      : `<p class="qp">${q.t.replace(/___/g,'<span class="blank">______</span>')}</p>`}`;
  if(q.k==='se') h+=`<div class="hint lab" style="margin:-8px 0 12px">Choose the two that give the same meaning</div>`;
  q.o.forEach((set,bi)=>{
    if(q.k==='tc'&&q.o.length>1) h+=`<div class="blab lab">${roman[bi]}</div>`;
    h+='<div class="opts">';
    set.forEach((o,oi)=>{
      let cls='opt';
      if(v.done){
        const isAns = q.k==='se' ? q.a.includes(oi) : q.a[bi]===oi;
        const chose = q.k==='se' ? v.sel.includes(oi) : v.sel[bi]===oi;
        if(isAns) cls+=' right'; else if(chose) cls+=' wrong';
      } else {
        const chose = q.k==='se' ? v.sel.includes(oi) : v.sel[bi]===oi;
        if(chose) cls+=' picked';
      }
      h+=`<button class="${cls}" data-b="${bi}" data-o="${oi}" ${v.done?'disabled':''}>${o}</button>`;
      if(v.done) h+=optGloss(o);
    });
    h+='</div>';
  });
  if(!v.done){
    const ready = q.k==='se' ? v.sel.length===2 : v.sel.every(x=>x>=0);
    h+=`<div class="acts"><button class="btn pri" id="chk" ${ready?'':'disabled'}>Check</button></div>`;
  } else {
    h+=`<div class="fb">${q.e}</div><div class="acts"><button class="btn pri" id="nx">Next</button></div>`;
  }
  app.innerHTML=h;
  document.getElementById('bk').onclick=()=>{view={name:'route'};render();};
  const nrc=document.getElementById('norc');
  if(nrc) nrc.onclick=()=>{ NORC=!NORC; saveNoRC();
    view={name:'verbal', qs:null, i:0, score:0, sel:[], done:false, sub:0}; render(); };
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const bi=+b.dataset.b, oi=+b.dataset.o;
    if(q.k==='se'){
      const k=v.sel.indexOf(oi);
      if(k>=0) v.sel.splice(k,1); else if(v.sel.length<2) v.sel.push(oi);
    } else v.sel[bi]=oi;
    render();
  });
  const chk=document.getElementById('chk');
  if(chk) chk.onclick=()=>{
    let ok;
    if(q.k==='se') ok = v.sel.length===2 && v.sel.slice().sort().join()===q.a.slice().sort().join();
    else ok = v.sel.every((x,i)=>x===q.a[i]);
    if(ok) v.score++;
    recordQ(q, ok);
    // grade every target word this item tested
    const targets = q.k==='se' ? q.a.map(i=>q.o[0][i]) : q.a.map((ai,bi)=>q.o[bi][ai]);
    targets.forEach(w=>{ const b=baseWord(w); if(b) grade(b, ok); });
    v.done=true; render();
  };
  const nx=document.getElementById('nx');
  if(nx) nx.onclick=()=>{v.i++;v.sel=[];v.done=false;render();};
}






/* ---------- how the counting works: a reference screen ---------- */
/* ---------- A to Z index ---------- */
const AZ = [];

/* ---------- lapse buckets ---------- */
function lapseBuckets(){
  const b={0:[],1:[],2:[],3:[],ok:[]};          // key 3 means three or more; ok means recovered
  TAUGHT.forEach(x=>{
    const r=rec(x.w); if(!r) return;            // never reviewed, not counted
    const M = r.m!==undefined ? r.m : (r.L||0); // older records only have L
    if (M>=2 && recovered(r)) { b.ok.push(x); return; }
    b[M>=3?3:M].push(x);
  });
  return b;
}
function drillBucket(min){
  const b=lapseBuckets();
  let list = min>=3 ? b[3] : b[min];
  if(!list.length){ alert('Nothing in that group yet.'); return; }
  const key='bucket:'+min;
  const se=sessionDeck(key, list, false);
  const deck=se.order.map(byName).filter(Boolean);
  view={name:'shaky', deck, i:se.i, flipped:false, produce:true, c:null, skey:key,
        back:{name:'stats'}};
  render();
}

      <span class="wdef">${x.d}</span>${x.vi?`<span class="wvi">${x.vi}</span>`:''}

  app.querySelectorAll('.seg button[data-o]').forEach(b=>b.onclick=()=>{ v.only=b.dataset.o||null; render(); });

function startFreqDrill(tier, weakOnly, restart){
  let list = TAUGHT.filter(x=>hiFreq(x.w)===tier);

  const key = 'band:'+tier+(weakOnly?':weak':'');
  const se = sessionDeck(key, list, restart);

}

/* ---------- word families: one root, several words ---------- */
function rootsView(){
  const entries = Object.entries(ROOTS.roots).filter(([r,ws])=>ws.some(w=>CLUSTER_OF[w]!==undefined));
  let h=`<button class="back lab" id="bk">← Route</button>
    <h2 class="ct">Word families</h2>
    <p class="cax">One Latin or Greek root can carry a dozen words across half the clusters.
      Learning them together costs less than learning them apart.</p>
    <div class="acts"><button class="btn pri" id="drill">Test me on ${entries.length} roots</button></div>`;
  entries.forEach(([root, ws])=>{
    h+=`<div class="bandhead lab" style="margin-top:18px">${root}</div><div class="wlist">`;
    ws.forEach(w=>{
      const e=AZ.find(x=>x.w===w);
      if(!e) return;
      h+=`<div class="wrow"><span class="dot" style="background:${COLOUR[state(w)]}"></span>
        <span><span class="wd">${w}</span><span class="wdef">${e.d}</span>
        ${e.vi?`<span class="wvi">${e.vi}</span>`:''}</span></div>`;
    });
    h+=`</div>`;
  });
  if(ROOTS.neg.length){
    h+=`<div class="bandhead lab" style="margin-top:26px">Opposites made by a prefix</div><div class="wlist">`;
    ROOTS.neg.forEach(([a,b])=>{
      const ea=AZ.find(x=>x.w===a), eb=AZ.find(x=>x.w===b);
      if(!ea||!eb) return;
      h+=`<div class="wrow"><span class="dot" style="background:var(--route)"></span>
        <span><span class="wd">${a} → ${b}</span>
        <span class="wdef">${ea.d}</span><span class="wdef">${eb.d}</span></span></div>`;
    });
    h+=`</div>`;
  }
  app.innerHTML=h;
  document.getElementById('bk').onclick=()=>{view={name:'route'};render();};
  document.getElementById('drill').onclick=startRootDrill;
}
function startRootDrill(){
  const deck=[];
  Object.entries(ROOTS.roots).forEach(([root,ws])=>{
    const on=ws.filter(w=>CLUSTER_OF[w]!==undefined);
    on.forEach(target=>{ if(on.length>=2) deck.push({target, root, group:on}); });
  });
  view={name:'rootdrill', deck:shuffle(deck).slice(0,30), i:0, picked:null, score:0, opts:null,
        back:{name:'roots'}};
  render();
}
function rootDrillView(){
  const v=view, d=v.deck;
  if(!d.length) return doneScreen('No families available', null);
  if(v.i>=d.length) return doneScreen(`${v.score} of ${d.length} right`, null);
  const item=d[v.i], t=item.target;
  const e=AZ.find(x=>x.w===t);
  if(!v.opts){
    const others=[];
    Object.entries(ROOTS.roots).forEach(([r,ws])=>{ if(r!==item.root)
      ws.forEach(w=>{ if(CLUSTER_OF[w]!==undefined) others.push(w); }); });
    v.opts = shuffle([t, ...shuffle(others).slice(0,3)]);
  }
  let h=`<button class="back lab" id="bk">← Families</button>
    <div class="prog">${v.i+1} of ${d.length} · ${v.score} right</div>
    <p class="qp">${e.d}</p>
    <div class="hint lab" style="margin:-8px 0 12px">Root: <b>${item.root}</b></div><div class="opts">`;
  v.opts.forEach((o,i)=>{
    let cls='opt';
    if(v.picked!==null){ if(o===t) cls+=' right'; else if(v.opts[v.picked]===o) cls+=' wrong'; }
    h+=`<button class="${cls}" data-i="${i}" ${v.picked!==null?'disabled':''}>${o}</button>`;
  });
  h+='</div>';
  if(v.picked!==null){
    h+=`<div class="fb"><b>${t}</b> — ${e.d}${e.vi?`<br><span class="vi">${e.vi}</span>`:''}</div>
        <div class="why"><span class="lab whyh">The rest of the ${item.root} family</span>`;
    item.group.filter(w=>w!==t).forEach(w=>{
      const o=AZ.find(x=>x.w===w);
      if(o) h+=`<div class="wl"><b>${w}</b> ${o.d}${o.vi?` <span class="vi">· ${o.vi}</span>`:''}</div>`;

    h+=`</div><div class="acts"><button class="btn pri" id="nx">Next</button></div>`;
  }
  app.innerHTML=h;
  document.getElementById('bk').onclick=()=>{view={name:'roots'};render();};
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    v.picked=+b.dataset.i;
    const ok=v.opts[v.picked]===t;
    if(ok) v.score++;
    grade(t, ok); render();
  });
  const nx=document.getElementById('nx');
  if(nx) nx.onclick=()=>{v.i++;v.picked=null;v.opts=null;render();};
}

/* ---------- look-alikes ---------- */
function lookDef(w){
  return (CLUSTER_OF[w]!==undefined ? (AZ.find(x=>x.w===w)||{}).d : null) || LOOK.offlist[w] || '';
}
function startLook(){
  const deck=[];
  LOOK.groups.forEach(g=>{
    g.forEach(target=>{
      if(!lookDef(target)) return;
      if(CLUSTER_OF[target]===undefined) return;
      deck.push({target, group:g});
    });
  });
  view={name:'look', deck:shuffle(deck).slice(0,30), i:0, picked:null, score:0, opts:null};
  render();
}
function lookView(){
  const v=view, d=v.deck;
  if(!d.length) return doneScreen('No look-alike pairs available', null);
  if(v.i>=d.length) return doneScreen(`${v.score} of ${d.length} right`, null);
  const item=d[v.i], target=item.target;

  let h=`<button class="back lab" id="bk">← Route</button>

  document.getElementById('bk').onclick=()=>{view={name:'route'};render();};
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    v.picked=+b.dataset.i;

    if(ok) v.score++;

/* ---------- A to Z index of every word ---------- */

  };

  if(v.letter && !q){

/* ---------- review of the question bank ---------- */
function bankView(){
  const v=view;
  const bank=ALLQ();
  const rows=bank.map(q=>{
    const st=QSTAT[qkey(q)]||{n:0,w:0};
    return {q, n:st.n, w:st.w, rate: st.n ? st.w/st.n : -1};
  });
  const mode = v.sort||'worst';
  const sorted = rows.slice().sort((a,b)=>
    mode==='worst' ? (b.rate-a.rate) || (b.w-a.w) :
    mode==='most'  ? (b.n-a.n) :
                     (({tc:0,se:1,rc:2})[a.q.k] - ({tc:0,se:1,rc:2})[b.q.k]));
  const seen=rows.filter(r=>r.n>0);

/* ---------- shuffling ----------
   Options are reordered every time a question is served, and the answer
   indices are remapped to follow them, so position never carries a clue. */
function shuffleQuestion(q){
  // A reading question's options often follow the passage's own order, and the
  // select-the-sentence type depends on it, so these are served as written.
  if(q.k==='rc') return q;
  const groups=[], answers=[];
  q.o.forEach((set, bi)=>{
    const idx = shuffle(set.map((_,i)=>i));          // new position -> old index
    groups.push(idx.map(i=>set[i]));
    if(q.k==='se'){
      q.a.forEach(old=>{ const pos = idx.indexOf(old); if(pos>=0) answers.push(pos); });
    } else {
      answers.push(idx.indexOf(q.a[bi]));
    }
  });
  if(q.k==='se') answers.sort((x,y)=>x-y);
  return {...q, o:groups, a:answers};
}

function correct(q, a){
  if(q.k==='se') return a.length===2 && a.slice().sort().join()===q.a.slice().sort().join();
  if(q.k==='rcq') return q.m==='multi'
    ? a.slice().sort().join()===q.a.slice().sort().join()

}

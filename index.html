// A blank line starts a paragraph, which is how the essay itself is structured.
function splitParas(t){
  return (t||'').split(/\n\s*\n+/).map(x=>x.trim()).filter(Boolean);
}

// Pair your paragraphs against the model's in order, and total the result.
function compareEssay(text, model, secs){
  const mine=splitParas(text);
  const rows=[], n=Math.max(mine.length, model.length);
  let same=0, total=0;
  for(let k=0;k<n;k++){
    const mp=model[k], yp=mine[k];
    if(mp===undefined){ continue; }                 // extra paragraphs of yours have nothing to pair with
    const t=normWords(mp).length;           // counted the same way the comparison counts
    total+=t;
    if(yp===undefined){ rows.push({acc:null, same:0, total:t, nw:0, html:'', model:mp}); continue; }
    const d=compareWords(yp, mp);
    same+=d.same;
    rows.push({acc:d.acc, same:d.same, total:t, nw:yp.split(/\s+/).length, html:d.html, model:mp});
  }
  const nw=(text||'').trim()? text.trim().split(/\s+/).length : 0;
  return {acc: total?Math.round(100*same/total):0, same, total, nw, secs, rows, mine, model};
}

// A plain longest-common-subsequence over words: enough to show where your
// sentence went a different way from the model, without pretending to grade.
function normWords(t){
  return (t||'').toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"')
    .replace(/[^a-z0-9'\- ]/g,' ').split(/\s+/).filter(w=>w && w!=='-');
}
function compareWords(mine, model){
  const norm = normWords;
  const A=(mine||'').trim().split(/\s+/).filter(Boolean), B=norm(model);
  const a=norm(mine||'');
  const n=a.length, m=B.length;
  if(!n) return {same:0,total:m,acc:0,html:''};
  const LIM=1200;
  if(n>LIM || m>LIM) return {same:0,total:m,acc:0,html:'<em>Paragraph too long to compare.</em>'};
  const dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
    dp[i][j] = a[i]===B[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const same=dp[0][0];
  const out=[]; let i=0,j=0;
  while(i<n && j<m){
    if(a[i]===B[j]){ out.push(['same', A[i]]); i++; j++; }
    else if(dp[i+1][j]>=dp[i][j+1]){ out.push(['mine', A[i]]); i++; }
    else { j++; }
  }
  while(i<n){ out.push(['mine', A[i]]); i++; }
  const html=out.map(([k,w])=> k==='same'
    ? `<span class="diffg">${w}</span>` : `<span class="diffb">${w}</span>`).join(' ');
  return {same, total:m, acc: Math.round(100*same/m), html};
}


/* ---------- choosing distractors for you ---------- */
// The options must not be able to fill the blank themselves, so anything from the
// answer's own cluster is excluded: those are its near-synonyms. What is left and
// wanted is words that LOOK like the answer, which is the distinction worth drilling.
function pickDistractors(answer, n){
  const base = baseWord(answer) || String(answer).toLowerCase().trim();
  const home = CLUSTER_OF[base];
  const banned = new Set([base, answer.toLowerCase()]);
  const ok = w => w!==base && CLUSTER_OF[w]!==undefined && CLUSTER_OF[w]!==home && !banned.has(w);

  const lev=(a,b)=>{
    let prev=[...Array(b.length+1).keys()];
    for(let i=1;i<=a.length;i++){ const cur=[i];
      for(let j=1;j<=b.length;j++)
        cur.push(Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]!==b[j-1]?1:0)));
      prev=cur; }
    return prev[b.length];
  };
  const shared=(a,b)=>{ let i=0; while(i<a.length&&i<b.length&&a[i]===b[i]) i++; return i; };

  const out=[];
  const take = w => { if(ok(w) && !out.includes(w)) out.push(w); };

  // 1. the look-alike family the answer already belongs to
  LOOK.groups.forEach(g=>{ if(g.includes(base)) g.forEach(take); });

  // 2. closest by spelling across the whole list
  if(out.length<n){
    const pool=TAUGHT.filter(x=>ok(x.w)).map(x=>x.w);
    pool.map(w=>[lev(base,w), -shared(base,w), w])
        .sort((a,b)=>a[0]-b[0] || a[1]-b[1] || (a[2]<b[2]?-1:1))
        .slice(0, n*3).forEach(x=>take(x[2]));
  }
  // 3. alphabetical neighbours, so the list still reads as a set
  if(out.length<n){
    const sorted=TAUGHT.map(x=>x.w).filter(ok).sort();
    let lo=0, hi=sorted.length-1;
    while(lo<hi){ const mid=(lo+hi)>>1; if(sorted[mid]<base) lo=mid+1; else hi=mid; }
    for(let d=0; d<sorted.length && out.length<n; d++){
      if(sorted[lo+d]) take(sorted[lo+d]);
      if(sorted[lo-d-1]) take(sorted[lo-d-1]);
    }
  }
  return out.slice(0,n);
}

    render(); };

    read();

    const opts=[v.ans, ...v.picked].sort((a,b)=>a<b?-1:1);
    const q={k:'tc', syn:v.word, t:(v.sent||'').trim(), o:[opts],
             a:[opts.indexOf(v.ans)], e:v.expl.trim(), mine:1};
    const seen=coverage().asked, before=coverage().done;
    MYQ.push(q); saveQ();
    view={name:'syn', kind:'syn', err:'', note:'Saved. '+coverNote(q, seen, before, coverage())};
    render(); };
  function bad(m){ v.err=m; v.note=''; render(); }
}

// Wrong options for a meaning question: anything outside both the answer's cluster
// and the prompt word's, so none of them can also be close in meaning.
function farWords(answer, prompt, n){
  const homes=new Set([CLUSTER_OF[answer], CLUSTER_OF[prompt]]);
  const pool=TAUGHT.filter(x=>!homes.has(x.c) && x.w!==answer && x.w!==prompt);
  const byLen=pool.filter(x=>Math.abs(x.w.length-answer.length)<=3);
  return shuffle(byLen.length>=n?byLen:pool).slice(0,n).map(x=>x.w);
}

// Loading a saved question back into the form. Bulk-pasted questions can carry
// fewer options than the form shows, so the slots are padded and trimmed again on save.
function loadForEdit(i){
  const q=MYQ[i];
  if(q.k==='rc'){
    view={name:'rceditor', kind:'rc', editing:i, err:'', note:'',
      psg:q.p, nsub:q.qs.length,
      subs:q.qs.map(sub=>{
        const o=sub.o.slice(); while(o.length<5) o.push('');
        const a = sub.m==='multi' ? sub.a.slice() : [sub.a];
        return {t:sub.t, o, a, m:sub.m||'one', e:sub.e};
      })};
    return render();
  }
  const kind = q.k==='se' ? 'se' : 'tc'+q.o.length;
  const per = SPEC[kind].per;
  const opts = q.o.map(set_=>{ const o=set_.slice(); while(o.length<per) o.push(''); return o; });
  const mark = q.k==='se' ? [q.a.slice()] : q.a.slice();
  view={name:'editor', kind, editing:i, err:'', note:'',
        sent:q.t, expl:q.e, opts, mark};
  render();
}

    view={name:'editor', kind:v.kind, mark:null, err:'',
      note: `${editing?'Changes saved':'Saved'}. ` + coverNote(q, seenBefore, before, after)};
    render();
  };
  function fail(m){ v.err=m; render(); }
}
function bulkView(){
  const v=view;
  app.innerHTML=`<button class="back lab" id="bk">← Add a question</button>
    <h2 class="ct">Paste several</h2>
    <p class="cax">One question per block, blank line between blocks. Mark each correct option with a star.</p>
    <div class="note">SE<br>The report was ___ and added nothing.<br>*vacuous<br>*empty<br>prosaic<br>humdrum<br>evasive<br>terse<br>= vacuous and empty both mean without content.</div>
    ${v.err?`<div class="err">${v.err}</div>`:''}
    <label class="field"><textarea id="blk" style="min-height:220px" placeholder="Paste here"></textarea></label>
    <div class="acts"><button class="btn pri" id="go">Add them</button></div>`;
  document.getElementById('bk').onclick=()=>{view={name:'editor',kind:v.kind,mark:null,err:''};render();};
  document.getElementById('go').onclick=()=>{
    const before=coverage().done;
    const blocks=document.getElementById('blk').value.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
    let added=0, bad=[];
    blocks.forEach((blk,bi)=>{
      const lines=blk.split('\n').map(x=>x.trim()).filter(Boolean);
      const kind=(lines[0]||'').toLowerCase();
      if(kind!=='se'&&kind!=='tc'){ bad.push(bi+1); return; }
      const sent=lines[1]||'';
      const expl=(lines.find(l=>l.startsWith('='))||'').replace(/^=\s*/,'');
      const opts=lines.slice(2).filter(l=>!l.startsWith('='));
      const marks=[], clean=[];
      opts.forEach((o,i)=>{ if(o.startsWith('*')){ marks.push(i); clean.push(o.slice(1).trim()); } else clean.push(o.trim()); });
      const nb=(sent.match(/___/g)||[]).length;
      if(!sent||!clean.length||!expl||!marks.length||nb<1){ bad.push(bi+1); return; }
      if(kind==='se'){ if(marks.length!==2||nb!==1){ bad.push(bi+1); return; }
        MYQ.push({k:'se',t:sent,o:[clean],a:marks,e:expl,mine:1}); }
      else { if(marks.length!==nb){ bad.push(bi+1); return; }
        const per=clean.length/nb;
        if(!Number.isInteger(per)){ bad.push(bi+1); return; }
        const groups=[], ans=[];
        for(let b=0;b<nb;b++){ groups.push(clean.slice(b*per,(b+1)*per));
          const m=marks.find(x=>x>=b*per&&x<(b+1)*per); if(m===undefined){bad.push(bi+1);return;} ans.push(m-b*per); }
        MYQ.push({k:'tc',t:sent,o:groups,a:ans,e:expl,mine:1}); }
      added++;
    });
    saveQ();
    const c2=coverage();
    view={name:'editor',kind:v.kind,mark:null,
      err: bad.length ? `Added ${added}. Blocks ${bad.join(', ')} were skipped — check the format.` : '',
      note: `Added ${added}. ${c2.done} of ${c2.total} Most-likely words covered`
            + (c2.done>before ? ` — up ${c2.done-before}.` : ', unchanged: none of these options were new.')};
    render();
  };
}

         : k==='quick' ? {name:'quick', kind:'quick', err:''}
         : k==='syn' ? {name:'syn', kind:'syn', err:''}
         : {name:'editor', kind:k, mark:null, err:''};

  app.querySelectorAll('.seg button[data-m]').forEach(b=>b.onclick=()=>{
    read(); const sub=v.subs[+b.dataset.s];
    sub.m=b.dataset.m; if(sub.m==='one' && sub.a.length>1) sub.a=[sub.a[0]];
    v.err=''; render(); });
  app.querySelectorAll('.mark[data-sm]').forEach(b=>b.onclick=()=>{
    read(); const sub=v.subs[+b.dataset.sm], i=+b.dataset.i;
    if(sub.m==='multi'){ const k=sub.a.indexOf(i); if(k>=0) sub.a.splice(k,1); else sub.a.push(i); }
    else sub.a=[i];
    v.err=''; render(); });
  app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>loadForEdit(+b.dataset.edit));
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(!confirm('Delete this passage and its questions?')) return;
    MYQ.splice(+b.dataset.del,1); saveQ();
    if(v.editing!==undefined) view={name:'rceditor', kind:'rc', err:''};
    render(); });
  const bl=document.getElementById('bulkRC');
  if(bl) bl.onclick=()=>{ read(); view={name:'rcbulk', err:''}; render(); };
  const cr=document.getElementById('cancelRC');
  if(cr) cr.onclick=()=>{ view={name:'rceditor', kind:'rc', err:''}; render(); };
  document.getElementById('saveRC').onclick=()=>{
    read();
    if(!(v.psg||'').trim()) return fail('Paste the passage first.');
    if((v.psg||'').trim().length<120) return fail('That passage looks too short — check it pasted in full.');
    for(let i=0;i<v.subs.length;i++){
      const sub=v.subs[i];
      if(!sub.t.trim()) return fail(`Question ${i+1} has no prompt.`);
      const filled=sub.o.filter(x=>x.trim());
      if(filled.length<3) return fail(`Question ${i+1} needs at least three options.`);
      if(!sub.a.length) return fail(`Question ${i+1} has no correct answer marked.`);
      if(sub.m==='one' && sub.a.length!==1) return fail(`Question ${i+1} is set to one answer but has ${sub.a.length} marked.`);
      if(sub.a.some(x=>!sub.o[x].trim())) return fail(`Question ${i+1} marks an empty option.`);
      if(!sub.e.trim()) return fail(`Question ${i+1} has no explanation.`);
    }
    const q={k:'rc', p:v.psg.trim(), mine:1, qs:v.subs.map(sub=>{
      const keep=sub.o.map((o,i)=>[o.trim(),i]).filter(([o])=>o);
      const map={}; keep.forEach(([o,old],ni)=>map[old]=ni);
      return {t:sub.t.trim(), o:keep.map(([o])=>o),
              a: sub.m==='multi' ? sub.a.map(i=>map[i]).sort((a,b)=>a-b) : map[sub.a[0]],
              m: sub.m, e: sub.e.trim()};
    })};
    const seenBefore=coverage().asked, before=coverage().done;
    const editing = v.editing!==undefined;
    if(editing) MYQ[v.editing]=q; else MYQ.push(q);
    saveQ();
    const rc=ALLQ().filter(x=>x.k==='rc'), after=coverage();
    view={name:'rceditor', kind:'rc', nsub:v.nsub, err:'',
      note:`${editing?'Changes saved':'Saved'}. The bank holds ${rc.length} passage${rc.length===1?'':'s'} and `
        + `${rc.reduce((n,x)=>n+x.qs.length,0)} reading questions. ` + coverNote(q, seenBefore, before, after)};
    render();
  };
  function fail(m){ v.err=m; v.note=''; render(); }
}

function rcBulkView(){

  document.getElementById('bk').onclick=()=>{view={name:'rceditor',kind:'rc',err:''};render();};
  document.getElementById('go').onclick=()=>{
    const raw=document.getElementById('rb').value.trim();
    const lines=raw.split('\n').map(x=>x.trim());
    if((lines[0]||'').toLowerCase()!=='rc') return bad('The first line must be RC.');
    const parts=lines.slice(1).join('\n').split(/\n\s*\?\s*\n/);
    const passage=(parts[0]||'').trim();
    if(passage.length<120) return bad('No passage found, or it is too short.');
    const qs=[];
    for(const blk of parts.slice(1)){
      const ls=blk.split('\n').map(x=>x.trim()).filter(Boolean);
      if(ls.length<3) return bad('A question block is missing its options.');
      const prompt=ls[0];
      const expl=(ls.find(x=>x.startsWith('='))||'').replace(/^=\s*/,'');
      const opts=ls.slice(1).filter(x=>!x.startsWith('='));
      const marks=[], clean=[];
      opts.forEach((o,i)=>{ if(o.startsWith('*')){ marks.push(i); clean.push(o.slice(1).trim()); } else clean.push(o.trim()); });
      if(!prompt || clean.length<3 || !marks.length || !expl)
        return bad(`The question "${prompt.slice(0,40)}…" is missing a prompt, options, a star or an explanation.`);
      qs.push({t:prompt, o:clean, a: marks.length>1 ? marks : marks[0],
               m: marks.length>1 ? 'multi' : 'one', e:expl});
    }
    if(!qs.length) return bad('No questions found. Each one starts with a line containing only a question mark.');
    MYQ.push({k:'rc', p:passage, qs, mine:1}); saveQ();
    const rc=ALLQ().filter(x=>x.k==='rc');
    view={name:'rceditor', kind:'rc', err:'',
      note:`Added a passage with ${qs.length} question${qs.length>1?'s':''}. The bank now holds ${rc.length} passages.`};
    render();
  };
  function bad(m){ v.err=m; render(); }
}

  const reviewed = B[0].length+B[1].length+B[2].length+B[3].length+B.ok.length;
  const rows=[
    ['Never missed', B[0].length, 'var(--solid)', 'right on every attempt so far'],
    ['Missed before, now recovered', B.ok.length, 'var(--solid)',
      `missed two or more times, then right ${CLEAR} times running on separate days. They no longer count as weak`],
    ['Missed once',  B[1].length, 'var(--learn)', 'one wrong answer; the schedule has already pulled it closer'],
    ['Missed twice', B[2].length, '#C08A3E',      'on the edge — one more and it becomes a problem word'],
    ['Missed 3 or more times', B[3].length, 'var(--weak)',
      `still weak. ${CLEAR} correct answers on separate days clears a word out of this group`]
  ];
  document.getElementById('buckets').innerHTML = rows.map(([label,n,col,note])=>{
    const pc = reviewed ? Math.round(100*n/reviewed) : 0;
    return `<div class="wrow"><span class="dot" style="background:${col}"></span>
      <span><span class="wd">${label} — ${n}</span>
      <span class="wdef">${pc}% of the ${reviewed} words you have reviewed</span>
      <span class="wnote">${note}</span></span></div>`;
  }).join('');

  document.getElementById('repsUp').onclick=()=>{ REPS=Math.min(12,REPS+1); saveReps(); render(); };
  document.getElementById('repsDown').onclick=()=>{ REPS=Math.max(2,REPS-1); saveReps(); render(); };
  document.getElementById('d3').onclick=()=>drillBucket(3);
  document.getElementById('d2').onclick=()=>drillBucket(2);
  document.getElementById('bk').onclick=()=>{view={name:'route'};render();};
  document.getElementById('home').onclick=()=>{view={name:'route'};render();};
}

// Every drill carries the screen it was launched from, so finishing one lands you
// back where you chose it rather than at the route.
function backTo(v){ return (v && v.back) ? JSON.parse(JSON.stringify(v.back)) : {name:'route'}; }
function backLabel(v){
  const b = v && v.back;
  if(!b) return 'Route';
  return b.name==='index' ? 'All words'
       : b.name==='freq'  ? 'Most likely'
       : b.name==='stats' ? 'Progress'
       : b.name==='cluster' ? 'Cluster'
       : b.name==='roots' ? 'Families'
       : b.name==='bank' ? 'Question bank' : 'Route';
}
function doneScreen(msg,c){
  if(view.skey) sessionClear(view.skey);
  const t=tally(TAUGHT);
  app.innerHTML=`<h2 class="ct">${msg}</h2>
    <p class="cax">Words you missed come back within a day. Words you knew stretch further out each time.</p>
    <div class="legend lab" style="margin-bottom:20px">
      <span><i style="background:var(--solid)"></i>holding ${t.known}</span>
      <span><i style="background:var(--learn)"></i>coming along ${t.learning}</span>
      <span><i style="background:var(--weak)"></i>forgetting often ${t.shaky}</span>
    </div>
    <div class="acts">${(view.back)?`<button class="btn pri" id="bk2">Back to ${backLabel(view)}</button>`
      :(c!==null&&c!==undefined)?`<button class="btn pri" id="again2">Back to cluster</button>`:''}
      <button class="btn pri" id="home">Route</button></div>`;
  const b2=document.getElementById('bk2');
  if(b2){ const dest=backTo(view); b2.onclick=()=>{view=dest;render();}; }
  const a=document.getElementById('again2');
  if(a) a.onclick=()=>{view={name:'cluster',c};render();};
  document.getElementById('home').onclick=()=>{view={name:'route'};render();};
  save();
}

function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[b[i],b[j]]=[b[j],b[i]];}return b;}

document.getElementById('themeBtn').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':cur==='light'?'dark':(matchMedia('(prefers-color-scheme:dark)').matches?'light':'dark');
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem('ascent-theme',next)}catch(e){}
};
try{const t=localStorage.getItem('ascent-theme'); if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
document.getElementById('resetBtn').onclick=()=>{
  if(!confirm('Clear all progress? Export first if you want a copy.'))return;
  P={};dirty=true;save();render();
};
document.getElementById('expBtn').onclick=exportProgress;
document.getElementById('impBtn').onclick=()=>{ view={name:'import',err:''}; render(); };

loadReps(); loadNoRC(); loadQ(); loadW(); loadSess(); mergeMyWords(); render(); load();
</script>
</body>

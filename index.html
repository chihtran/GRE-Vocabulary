[{"k":"tc","n":1,"t":"The consultant's report was ___: forty pages restating what the board had already said, with nothing added.","o":[["vacuous","prosaic","humdrum","evasive","tendentious"]],"a":[0],"e":"vacuous — empty of content. prosaic is unimaginative, but a prosaic report still contains something. humdrum is dull through routine. evasive needs something being dodged. tendentious means biased toward a view."},{"k":"tc","n":2,"t":"Her bearing under cross-examination was remarkable — not defiance exactly, but a ___ suggesting she had expected the questions and long since decided how to meet them.","o":[["levity","poise","torpor","bravado","diffidence"]],"a":[1],"e":"poise — composed self-assurance including bearing. levity is lightness of manner. torpor is inactivity. bravado is boldness as display, ruled out by 'not defiance exactly'. diffidence is shyness."},{"k":"tc","n":3,"t":"The estate presented two faces. To visitors, an (i)___ display of wealth: imported marble, a fountain nobody used. To its tenants, a steward whose enforcement of the smallest rule marked him out as a (ii)___.","o":[["ostentatious","mundane","austere"],["martinet","sycophant","dilettante"]],"a":[0,0],"e":"ostentatious — display aimed at signalling wealth. mundane and austere run the other way. martinet — a person who enforces rules rigidly. sycophant flatters superiors; dilettante dabbles."},{"k":"tc","n":4,"t":"She remained (i)___ about the venture's prospects, which struck her partners as shrewd or delusional depending on the week. What none disputed was that the enterprise had proved unexpectedly (ii)___, returning more in its second year than the entire first round had cost.","o":[["sanguine","bereft","apprehensive"],["lucrative","exploitative","precarious"]],"a":[0,0],"e":"sanguine — optimism about outcomes, a forecast rather than a mood, which is why 'shrewd or delusional' fits. lucrative — returning more than it cost. exploitative and precarious describe method and risk, not profit."},{"k":"tc","n":5,"t":"The lecture did something unusual. It opened by (i)___ a principle most of the audience had never heard stated aloud, then spent an hour showing how it would (ii)___ the disciplinary boundaries the department had spent decades defending — all without once (iii)___ the evidence, which the speaker laid out fully enough for his critics to use against him.","o":[["enunciating","attenuating","rescinding"],["transcend","reinforce","delineate"],["distorting","citing","withholding"]],"a":[0,0,0],"e":"enunciate in its second sense: to state a principle formally. transcend — going beyond a boundary. distorting — laying out evidence fully is the opposite of distorting it."},{"k":"tc","n":6,"t":"He was the most (i)___ man in the department and the least effective. Every proposal met the same treatment: a list of small objections, none fatal, delivered in a tone so (ii)___ that colleagues stopped bringing him drafts — which left him free to complain, ever more (iii)___, that nobody consulted him.","o":[["captious","mettlesome","phlegmatic"],["magisterial","tentative","conciliatory"],["obstreperous","reticent","sanguine"]],"a":[0,0,0],"e":"captious — disposed to raise trivial objections. magisterial — authoritative in a way that brooks no question; this is the word's negative face, though it can also be a compliment. obstreperous — complaint that grows louder."},{"k":"se","n":7,"t":"Twenty years of unbroken success had left the firm in a state of ___ from which no quarterly warning could rouse it.","o":[["torpor","lassitude","ferment","turmoil","vigilance","disarray"]],"a":[0,1],"e":"torpor and lassitude both name inactivity and drained energy. ferment, turmoil, disarray are the reverse; vigilance is alertness."},{"k":"se","n":8,"t":"The charge was never substantiated, and the biography treats it as the ___ it plainly was.","o":[["calumny","slander","grievance","stricture","concession","oversight"]],"a":[0,1],"e":"calumny and slander both assert a damaging falsehood, which 'never substantiated' requires. grievance may be legitimate; stricture is a criticism that could be true."},{"k":"se","n":9,"t":"He would ___ for an hour about matters he had not troubled to study, and nobody had the heart to stop him.","o":[["prate","prattle","expatiate","equivocate","demur","recapitulate"]],"a":[0,1],"e":"prate and prattle both mean talking on foolishly. expatiate is neutral and implies he had studied the subject, which the sentence denies."},{"k":"se","n":10,"t":"Her replies were ___ to the point of rudeness: four words where a sentence was expected.","o":[["laconic","terse","prolix","verbose","evasive","tortuous"]],"a":[0,1],"e":"laconic and terse both mean using very few words. prolix and verbose are the reverse pair. evasive is about dodging; tortuous about twisting."},{"k":"se","n":11,"t":"The archive holds ___ documentation of the period — far more, in fact, than any historian has yet worked through.","o":[["copious","profuse","scant","sparse","fragmentary","contested"]],"a":[0,1],"e":"copious and profuse both mean abundant. scant, sparse, fragmentary run the other way."},{"k":"se","n":12,"t":"What the field suffers from is not a ___ of theory but an absence of anyone willing to test it.","o":[["dearth","paucity","plethora","welter","surplus","rejection"]],"a":[0,1],"e":"dearth and paucity both mean a shortage. plethora, welter and surplus are the reverse — note three of them, which is itself the signal."},{"k":"se","n":13,"t":"Nothing the chairman said could ___ the shareholders, who had come intending to be angry and left more so.","o":[["placate","mollify","provoke","inflame","address","reimburse"]],"a":[0,1],"e":"placate and mollify both mean calming an angry person — the object here is people, not a condition. provoke and inflame are the reverse."},{"k":"se","n":14,"t":"He wrote the novel in conditions of near ___, pawning the furniture chapter by chapter.","o":[["penury","indigence","affluence","seclusion","obscurity","infirmity"]],"a":[0,1],"e":"penury and indigence both mean extreme poverty. affluence is the reverse; the others are different kinds of hardship."},{"k":"se","n":15,"t":"The heir proved as ___ as the family had feared, and the estate was gone within a decade.","o":[["prodigal","profligate","parsimonious","miserly","industrious","reclusive"]],"a":[0,1],"e":"prodigal and profligate both mean recklessly wasteful with money — prodigal is not about wandering. parsimonious and miserly are the reverse pair."},{"k":"se","n":16,"t":"The argument is ___ — it survives a first reading and collapses under the second.","o":[["specious","spurious","cogent","trenchant","impenetrable","hackneyed"]],"a":[0,1],"e":"specious and spurious both mean false. specious fits especially well: plausible on first reading, wrong underneath. cogent and trenchant are the reverse."},{"k":"se","n":17,"t":"She was ___ about her own limitations in a way that disarmed the committee entirely.","o":[["candid","frank","disingenuous","evasive","defensive","oblivious"]],"a":[0,1],"e":"candid and frank both mean openly truthful. disingenuous is the reverse — feigned openness."},{"k":"se","n":18,"t":"He pursued the reform with an ___ that his own allies found exhausting.","o":[["ardor","fervor","apathy","ennui","equanimity","ambivalence"]],"a":[0,1],"e":"ardor and fervor both mean intense warmth of feeling directed at a cause. the others describe absence or division of feeling."},{"k":"se","n":19,"t":"The editorial board voted to ___ him publicly, a step it had taken twice in ninety years.","o":[["castigate","chastise","exonerate","commend","reinstate","consult"]],"a":[0,1],"e":"castigate and chastise both mean to reprimand severely. exonerate, commend, reinstate run the other way."},{"k":"se","n":20,"t":"For the last decade of his life he would ___ against a policy he had himself drafted.","o":[["fulminate","inveigh","demur","acquiesce","legislate","preside"]],"a":[0,1],"e":"fulminate and inveigh both take 'against' and mean sustained bitter protest. demur is a mild objection; acquiesce is the reverse."},{"k":"tc","t":"The drug's effect on the tumour was negligible, but its ___ effect on the liver ended the trial within a month.","o":[["deleterious","salutary","negligible","ancillary","transient"]],"a":[0],"e":"deleterious — causing harm, especially gradually. salutary means beneficial. negligible repeats the first clause. ancillary means supporting. transient means short-lived.","n":21},{"k":"tc","t":"His reputation rests on a single (i)___ paper, published when he was twenty-three, that (ii)___ a field nobody had thought to question.","o":[["prescient","derivative","perfunctory"],["subverted","corroborated","summarized"]],"a":[0,0],"e":"prescient — seeing ahead of its time. subverted — undermined the established view, which 'nobody had thought to question' sets up.","n":22},{"k":"tc","t":"The committee was (i)___ about the timetable but (ii)___ on the budget, which suggested where its real interest lay.","o":[["amenable","intransigent","prescient"],["obdurate","tractable","sanguine"]],"a":[0,0],"e":"amenable — open to suggestion; obdurate — immovable. The contrast between the two blanks is what the sentence turns on.","n":23},{"k":"se","t":"Her rise was ___: three promotions in four years, in an institution where most wait a decade for one.","o":[["meteoric","precipitous","gradual","measured","stalled","tentative"]],"a":[0,1],"e":"precipitous can describe a steep rise as well as a steep fall. gradual and measured are the reverse.","n":24},{"k":"se","t":"The effects of the policy were ___ — nobody noticed them until the damage was two decades deep.","o":[["insidious","pernicious","overt","conspicuous","immediate","salutary"]],"a":[0,1],"e":"insidious and pernicious both mean harmful in a gradual, concealed way. overt and conspicuous are the reverse.","n":25},{"k":"se","t":"What survives of the library is ___: a few charred leaves and a catalogue listing nine thousand volumes.","o":[["vestigial","fragmentary","extant","copious","pristine","definitive"]],"a":[0,1],"e":"vestigial and fragmentary both mean only a remnant survives. extant merely means still existing, which is true but not the point.","n":26},{"k":"se","t":"He is a ___ in the field — he reads the journals, attends the conferences, and has never once done an experiment.","o":[["dilettante","dabbler","polymath","savant","practitioner","pioneer"]],"a":[0,1],"e":"dilettante and dabbler both mean someone engaging without serious commitment. polymath and savant credit real expertise.","n":27},{"k":"se","t":"The objection is ___ to the argument and can be set aside without weakening it.","o":[["tangential","extraneous","germane","pertinent","fatal","central"]],"a":[0,1],"e":"tangential and extraneous both mean off to the side. germane and pertinent are the reverse pair — note two of each, which is the signal.","n":28},{"k":"se","t":"She was ___ enough to notice what the figures implied three quarters before anyone else did.","o":[["perspicacious","astute","credulous","obtuse","complacent","diffident"]],"a":[0,1],"e":"perspicacious and astute both mean sharp in perception. obtuse is the reverse; credulous means too ready to believe.","n":29},{"k":"tc","t":"The sentence was widely called ___ — six years for an offence the statute had never intended to reach.","o":[["draconian","lenient","equitable","nominal","warranted"]],"a":[0],"e":"draconian — excessively harsh. lenient, equitable, nominal and warranted all run the other way.","n":30},{"k":"tc","t":"He had built a career on (i)___ — attaching himself to whichever faction was rising — and the memoir's attempt to present this as principle is (ii)___.","o":[["opportunism","probity","fortitude"],["unconvincing","meticulous","tenable"]],"a":[0,0],"e":"opportunism — exploiting chances without regard to principle. The memoir's reframing therefore fails to convince.","n":31},{"k":"tc","t":"The treaty did not (i)___ the dispute ives.","o":[["florid","overwrought","spare","laconic","lucid","trenchant"]],"a":[0,1],"e":"florid and overwrought both mean over-decorated. spare and laconic are the reverse.","n":38},{"k":"tc","t":"A second inspection would ___ the need for a third, which is why the council refused to fund it.","o":[["obviate","necessitate","expedite","corroborate","precipitate"]],"a":[0],"e":"obviate — to remove the need for. The refusal makes sense only if the inspection would have saved money later.","n":39},{"k":"tc","t":"The speech was designed to (i)___ a crowd that had arrived merely curious, and by the end it had (ii)___ them into something closer to a mob.","o":[["galvanize","placate","enlighten"],["incited","mollified","instructed"]],"a":[0,0],"e":"galvanize — to shock into action; incite — to stir up unlawful behaviour. Both blanks run in the same direction, which the ending confirms.","n":40},{"k":"tc","t":"His public position and his private correspondence are so (i)___ that one of them must be (ii)___, though the biographer declines to say which.","o":[["incongruous","complementary","analogous"],["disingenuous","substantive","veracious"]],"a":[0,0],"e":"incongruous — out of keeping with each other; disingenuous — insincere. If two accounts clash, one is being faked.","n":41},{"k":"se","t":"The evidence is ___ — it fits the theory, but it fits two rival theories equally well.","o":[["circumstantial","inconclusive","incontrovertible","decisive","ironclad","dispositive"]],"a":[0,1],"e":"circumstantial and inconclusive both mean the evidence does not settle the matter. the other four all mean it does.","n":42},{"k":"se","t":"She proved ___ in the face of three rejections, submitting the paper a fourth time without altering a word.","o":[["dogged","pertinacious","irresolute","pliant","tractable","capitulating"]],"a":[0,1],"e":"dogged and pertinacious both mean stubbornly persistent. the rest describe giving way.","n":43},{"k":"se","t":"His argument is ___ rather than balanced: it exists to attack a position, not to weigh one.","o":[["polemical","tendentious","dispassionate","impartial","tentative","conciliatory"]],"a":[0,1],"e":"polemical and tendentious both mean advancing one side rather than assessing. dispassionate and impartial are the reverse pair.","n":44},{"k":"se","t":"The objection is ___ — it adds nothing the previous three had not already established.","o":[["superfluous","redundant","indispensable","salient","novel","trenchant"]],"a":[0,1],"e":"superfluous and redundant both mean more than is needed. indispensable and salient run the other way.","n":45},{"k":"se","t":"He was ___ toward the rival he had spent a decade defeating, and the eulogy he delivered surprised everyone.","o":[["magnanimous","gracious","vindictive","spiteful","indifferent","perfunctory"]],"a":[0,1],"e":"magnanimous and gracious both mean generous where harshness was available. vindictive and spiteful are the reverse pair.","n":46},{"k":"se","t":"The reforms were ___: announced with ceremony, funded at a tenth of what they required, and abandoned within a year.","o":[["token","perfunctory","substantive","thoroughgoing","radical","efficacious"]],"a":[0,1],"e":"token and perfunctory both mean done for appearance only. substantive and thoroughgoing are the reverse.","n":47}]

<script>
const DATA = JSON.parse(document.getElementById('DATA').textContent);
const VERBAL = JSON.parse(document.getElementById('VERBAL').textContent);
let MYQ = [];                                  // questions you add yourself
const QKEY = 'ascent-questions-v1';
function loadQ(){ try{ const r=localStorage.getItem(QKEY); if(r) MYQ=JSON.parse(r)||[]; }catch(e){} }
function saveQ(){ try{ localStorage.setItem(QKEY, JSON.stringify(MYQ)); }catch(e){} }
const ALLQ = () => VERBAL.concat(MYQ);
const CLUSTER_OF = {}; DATA.forEach(c=>c.w.forEach(x=>CLUSTER_OF[x[0]]=c.n));
// pairs that sit in different clusters but are still confusable — never offered together
const CONFUSABLE = {
  insensible:['oblivious'], oblivious:['insensible'],
  specious:['implausible','spurious'], spurious:['specious'],
  mitigate:['militate'], placate:['assuage','mollify'], assuage:['placate','mollify','alleviate'],
  mollify:['placate','assuage'], alleviate:['assuage','allay','ameliorate'], allay:['alleviate','assuage'],
  prodigal:['profligate'], profligate:['prodigal'],
  laconic:['terse','taciturn'], terse:['laconic'], taciturn:['reticent','laconic'], reticent:['taciturn'],
  ardor:['fervor'], fervor:['ardor'], ardent:['fervent'], fervent:['ardent'],
  castigate:['chastise'], chastise:['castigate'], fulminate:['inveigh'], inveigh:['fulminate'],
  penury:['indigence'], indigence:['penury'], dearth:['paucity'], paucity:['dearth'],
  copious:['profuse'], profuse:['copious'], torpor:['lassitude'], lassitude:['torpor'],
  calumny:['slander'], slander:['calumny'], prate:['prattle'], prattle:['prate'],
  candid:['frank'], frank:['candid'], guileless:['artless','ingenuous'], artless:['guileless'],
  ingenuous:['guileless'], obdurate:['adamant','obstinate'], obstinate:['obdurate'],
  recalcitrant:['refractory'], refractory:['recalcitrant'], captious:['carping'], carping:['captious'],
  vapid:['insipid'], insipid:['vapid'], turgid:['tumid'], tumid:['turgid'],
  bolster:['buttress'], buttress:['bolster'], abstruse:['recondite'], recondite:['abstruse'],
  garrulous:['loquacious'], loquacious:['garrulous'], verbose:['prolix'], prolix:['verbose']
};
const app = document.getElementById('app');

/* ================= scheduler =================
   Simplified DSR model, after FSRS: each word carries
   S  stability  — days until recall probability falls to ~90%
   D  difficulty — 1 easy .. 10 hard, moves with your answers
   L  lapses     — times you have forgotten it after learning it
   Target retention 0.90. Interval = S.                            */
const DAY = 864e5, now = () => Date.now();
let P = {};                                   // word -> {S,D,L,t}
const rec = w => P[w] || null;

let LOG = [];                                 // rolling record of the last 400 answers
let DAYS = [];                                // every study day, as day numbers
function markDay(){
  const d = dayOf(now());
  if (DAYS[DAYS.length-1] !== d){ DAYS.push(d); DAYS.sort((a,b)=>a-b); dirty = true; }
}
function streaks(){
  if(!DAYS.length) return {total:0, current:0, best:0};
  let best=1, run=1;
  for(let i=1;i<DAYS.length;i++){
    if(DAYS[i]===DAYS[i-1]+1){ run++; best=Math.max(best,run); } else run=1;
  }
  const today = dayOf(now());
  const last = DAYS[DAYS.length-1];
  const current = (last===today || last===today-1) ? run : 0;
  return {total: DAYS.length, current, best: Math.max(best,current)};
}
function logAnswer(w, ok){
  markDay();
  LOG.push({w, ok:ok?1:0, t:now()});
  if(LOG.length>400) LOG = LOG.slice(-400);
}
// Which study-day a moment belongs to.
// Uses LOCAL midnight, not UTC, and rolls over at 4am so that a session
// running past midnight still counts as the evening it started.
const ROLLOVER = 4;                              // hours after local midnight
function dayOf(t){
  const d = new Date(t - ROLLOVER*3600000);      // shift back so 4am is the boundary
  return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY);
}
function grade(w, ok){
  logAnswer(w, ok);
  const r = rec(w);
  if (!r){ P[w] = { S: ok ? 1 : 0.4, D: ok ? 5 : 6.5, L: 0, m: ok?0:1,
                    n: ok?1:0, d0: dayOf(now()), t: now() }; }
  else if (ok){
    // a review only counts as a rep if it lands on a new day — drilling the same
    // card five times in one sitting is not five nights of remembering
    const newDay = dayOf(now()) !== (r.d0 ?? -1);
    if (newDay){ r.n = (r.n||0) + 1; r.d0 = dayOf(now()); }
    // reviewing long before it was due earns less stability (retrievability was high)
    const due = r.t + r.S*DAY;
    const early = now() < due ? Math.max(0.25, (now()-r.t) / (due-r.t || 1)) : 1;
    const growth = 1 + (0.25 + (10 - r.D) * 0.13) * early;
    r.S = Math.min(400, Math.max(1, r.S * growth));
    r.D = Math.max(1, r.D - 0.18);
    r.t = now();
  } else {
    r.S = Math.max(0.35, r.S * 0.28);          // forgetting collapses stability
    r.D = Math.min(10, r.D + 1.3);
    r.L = (r.L||0) + 1;                        // lapse: forgot it after learning it
    r.m = (r.m||0) + 1;                        // miss: any wrong answer at all
    r.n = Math.max(0, (r.n||0) - 1);
    r.t = now();
  }
  dirty = true; queueSave();
}
const dueAt = r => r.t + r.S * DAY;
const isDue = w => { const r = rec(w); return r ? dueAt(r) <= now() : false; };

/* four states, as requested */
const NEW='new', SHAKY='shaky', LEARNING='learning', KNOWN='known';
const misses = r => r.m!==undefined ? r.m : (r.L||0);
let REPS = 5;                                  // successful reviews, on separate days, to count as held
function loadReps(){ try{ const r=localStorage.getItem('ascent-reps'); if(r) REPS=Math.max(2,Math.min(12,+r)); }catch(e){} }
function saveReps(){ try{ localStorage.setItem('ascent-reps', String(REPS)); }catch(e){} }
function state(w){
  const r = rec(w);
  if (!r) return NEW;
  if (misses(r) >= 3 || r.D >= 7.5) return SHAKY;      // học rồi nhưng quên nhiều
  if ((r.n||0) >= REPS && misses(r) <= 1)  return KNOWN;      // học rồi và nhớ
  return LEARNING;                                     // học rồi quên ít
}
const LABEL = {new:'Not started', shaky:'Forgetting often', learning:'Coming along', known:'Holding'};
const COLOUR = {new:'var(--paper2)', shaky:'var(--weak)', learning:'var(--learn)', known:'var(--solid)'};

/* ================= storage =================
   Standalone build: progress lives in this browser via localStorage,
   with manual export/import so you can move it between devices.     */
const LSKEY = 'ascent-progress-v2';
let saveTimer=null, dirty=false;
function queueSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(save,600); }
function save(){
  if(!dirty) return;
  try{ localStorage.setItem(LSKEY, JSON.stringify({p:P, at:now(), v:2})); dirty=false; setSync(); }
  catch(e){ setSync('Browser storage is full or blocked — export your progress'); }
}
function load(){
  try{
    const raw = localStorage.getItem(LSKEY);
    if(!raw){ setSync(); return; }
    const d = JSON.parse(raw);
    if(d && d.p){
      if(d.log) LOG = d.log;
      if(d.days) DAYS = d.days;
      if(d.v>=2) P=d.p;
      else Object.entries(d.p).forEach(([w,o])=>{
        const b=o.b||0; if(!b) return;
        P[w]={S:[0,1,2,4,9,21][b]||1, D:6-b*0.6, L:0, t:now()-1};
      });
    }
  }catch(e){ setSync('Saved progress could not be read'); }
  setSync(); render();
}
function setSync(msg){
  const n = Object.keys(P).length;
  document.getElementById('sync').textContent =
    msg || (n ? `${n} words tracked in this browser` : 'Progress saves in this browser');
}
function exportProgress(){
  const blob = new Blob([JSON.stringify({p:P, log:LOG, days:DAYS, q:MYQ, at:now(), v:5}, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ascent-progress-' + new Date().toISOString().slice(0,10) + '.json';
  a.click(); URL.revokeObjectURL(a.href);
}
function importProgress(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const d = JSON.parse(fr.result);
      if(!d || !d.p) throw 0;
      P = d.p; if(d.log) LOG = d.log; if(d.days) DAYS = d.days; if(d.q){ MYQ = d.q; saveQ(); } dirty = true; save(); render();
    }catch(e){ setSync('That file was not a progress export'); }
  };
  fr.readAsText(file);
}

/* ================= data helpers ================= */
const ALL = DATA.flatMap(c => c.w.map(x => ({w:x[0], d:x[1], n:x[2], c:c.n})));
const TAUGHT = ALL.filter(x => x.d);
function tally(list){
  const t={new:0,shaky:0,learning:0,known:0};
  list.forEach(x=>t[state(x.w)]++); return t;
}
function clusterStats(c){
  const open = c.w.filter(x=>x[1]).map(x=>({w:x[0]}));
  return {...tally(open), t:open.length, n:c.w.length};
}
/* review queue: interleaved across clusters, shaky words first */
function queue(limit){
  const due = TAUGHT.filter(x=>isDue(x.w));
  const rank = x => state(x.w)===SHAKY ? 0 : 1;
  due.sort((a,b)=> rank(a)-rank(b) || dueAt(rec(a.w))-dueAt(rec(b.w)));
  const out = interleave(due);
  return limit ? out.slice(0,limit) : out;
}
function interleave(list){                     // avoid two words from one cluster in a row
  const byC = {}; list.forEach(x => (byC[x.c] ||= []).push(x));
  const keys = Object.keys(byC); const out=[];
  while(out.length < list.length){
    let placed=false;
    for(const k of keys){ if(byC[k].length){ out.push(byC[k].shift()); placed=true; } }
    if(!placed) break;
  }
  return out;
}

const GROUPS = [[1,8,'Speech — praise, attack, style'],[9,13,'Temperament'],[14,16,'Kindness, money, honesty'],
 [17,20,'Quantity and intensity'],[21,24,'Time and change'],[25,28,'Knowledge and reasoning'],
 [29,32,'Politics, law, society'],[33,35,'Discipline and vice'],[36,42,'Sensory and cultural'],
 [43,46,'Abstract verbs'],[47,47,'Trap words'],[50,56,'Skill, virtue, certainty']];

/* ================= views ================= */
let view = {name:'route'};
function render(){
  const t = tally(TAUGHT);
  const st = streaks();
  document.getElementById('alt').innerHTML =
    `<b>${t.known}</b> holding · <b>${t.learning}</b> coming along · <b>${t.shaky}</b> forgetting often`
    + (st.total ? ` · day <b>${st.total}</b>${st.current>1?`, ${st.current} in a row`:''}` : '');
  ({route:routeView, cluster:clusterView, study:studyView, quiz:quizView, review:reviewView, shaky:shakyView, verbal:verbalView, stats:statsView, editor:editorView, test:testView, tresult:tresultView})[view.name]();
  window.scrollTo({top:0});
}

function routeView(){
  const t = tally(TAUGHT), q = queue().length;
  let h = profileSVG();
  h += `<div class="legend lab">
    <span><i style="background:var(--solid)"></i>holding — ${t.known}</span>
    <span><i style="background:var(--learn)"></i>coming along — ${t.learning}</span>
    <span><i style="background:var(--weak)"></i>forgetting often — ${t.shaky}</span>
    <span><i style="background:var(--paper2);border:1px solid var(--contour)"></i>not started — ${t.new}</span>
  </div>
  <div class="hint lab" style="margin-top:6px">The number beside each cluster is how many of its words you have started.</div>`;
  h += `<div class="acts" style="margin-top:22px">
    <button class="btn pri" id="revBtn" ${q?'':'disabled'}>Review ${q} due</button>
    <button class="btn" id="shkBtn" ${t.shaky?'':'disabled'}>Drill ${t.shaky} weak</button>
    <button class="btn" id="vbBtn">GRE questions (${ALLQ().length})</button>
    <button class="btn" id="stBtn">Progress</button>
    <button class="btn" id="edBtn">Add questions</button>
    <button class="btn pri" id="tstBtn">Full test</button>
  </div>`;
  h += '<div class="bands">';
  GROUPS.forEach(([a,b,label])=>{
    const cs = DATA.filter(c=>c.n>=a&&c.n<=b); if(!cs.length) return;
    h += `<div class="bandhead lab">${label}</div>`;
    cs.forEach(c=>{
      const s=clusterStats(c), open=s.t>0, pct=x=> s.t ? x/s.t*100 : 0;
      h += `<button class="st ${open?'':'locked'}" data-c="${c.n}" ${open?'':'disabled'}>
        <span class="sn">${String(c.n).padStart(2,'0')}</span>
        <span><span class="stt">${c.t}</span><span class="sax">${c.a||''}</span></span>
        <span class="meter"><span class="bar">
          <span style="width:${pct(s.known)}%;background:var(--solid)"></span>
          <span style="width:${pct(s.learning)}%;background:var(--learn)"></span>
          <span style="width:${pct(s.shaky)}%;background:var(--weak)"></span>
        </span><span class="cap">${open? (s.known+s.learning+s.shaky)+'/'+s.t : s.n+' soon'}</span></span>
      </button>`;
    });
  });
  h+='</div>';
  app.innerHTML=h;
  const rb=document.getElementById('revBtn'); if(rb) rb.onclick=()=>{view={name:'review'};render();};
  const sb=document.getElementById('shkBtn'); if(sb) sb.onclick=()=>{view={name:'shaky'};render();};
  document.getElementById('vbBtn').onclick=()=>{view={name:'verbal',i:0,sel:[],done:false,score:0};render();};
  document.getElementById('stBtn').onclick=()=>{view={name:'stats'};render();};
  document.getElementById('edBtn').onclick=()=>{view={name:'editor',kind:'se',blanks:1,mark:[],err:''};render();};
  document.getElementById('tstBtn').onclick=startTest;
  app.querySelectorAll('.st[data-c]').forEach(b=>b.onclick=()=>{view={name:'cluster',c:+b.dataset.c};render();});
}

function profileSVG(){
  const W=860,H=150,pad=6;
  const pts = DATA.map((c,i)=>{
    const s=clusterStats(c);
    const frac = s.t ? (s.known + s.learning*0.55 + s.shaky*0.25)/s.t : 0;
    return [pad+i*(W-2*pad)/(DATA.length-1), H-18-frac*(H-40), s.t>0];
  });
  const line = pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const area = line+` L${pts[pts.length-1][0].toFixed(1)},${H-18} L${pts[0][0].toFixed(1)},${H-18} Z`;
  let contours='';
  for(let i=1;i<=4;i++){const y=H-18-i*(H-40)/4;
    contours+=`<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="var(--contour)" stroke-width=".7" stroke-dasharray="1 5"/>`;}
  const dots = pts.filter(p=>p[2]).map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.4" fill="var(--route)"/>`).join('');
  return `<div class="profile"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Your progress across 49 clusters">
    ${contours}<path d="${area}" fill="var(--route)" opacity=".13"/>
    <path d="${line}" fill="none" stroke="var(--route)" stroke-width="1.6" stroke-linejoin="round"/>${dots}
    <line x1="${pad}" y1="${H-18}" x2="${W-pad}" y2="${H-18}" stroke="var(--contour2)" stroke-width="1"/></svg></div>`;
}

function clusterView(){

  let h=`<button class="back lab" id="bk">← Route</button>
    <h2 class="ct">${String(c.n).padStart(2,'0')} · ${c.t}</h2>
    <p class="cax">${c.a||''}</p>

  c.w.forEach(x=>{

    h+=`<div class="wrow">

function studyView(){
  const v=view,d=v.deck;
  if(v.i>=d.length) return doneScreen('Cards done', v.c);
  const x=d[v.i];
  let h=`<button class="back lab" id="bk">← Cluster</button>
    <div class="prog">${v.i+1} of ${d.length}${v.produce?' · recall the word':''}</div><div class="card" id="card">`;
  if(v.produce){
    h += v.flipped ? `<div class="cw">${x[0]}</div>${x[2]?`<div class="cn">${x[2]}</div>`:''}`
                   : `<div class="cd">${x[1]}</div><div class="hint" style="margin-top:18px">Say the word aloud, then check</div>`;
  } else {
    h += v.flipped ? `<div class="cd">${x[1]}</div>${x[2]?`<div class="cn">${x[2]}</div>`:''}`
                   : `<div class="cw">${x[0]}</div><div class="hint" style="margin-top:16px">Tap to see the meaning</div>`;
  }
  h+=`</div>`;
  h+= v.flipped
    ? `<div class="acts"><button class="btn" id="again">Missed it</button><button class="btn pri" id="got">Got it</button></div>`
    : `<div class="acts"><button class="btn" id="flip">Check</button></div>`;
  app.innerHTML=h;
  document.getElementById('bk').onclick=()=>{view={name:'cluster',c:v.c};render();};
  const flip=()=>{v.flipped=true;render();};
  document.getElementById('card').onclick=()=>{if(!v.flipped)flip();};
  if(!v.flipped) document.getElementById('flip').onclick=flip;
  else{
    document.getElementById('again').onclick=()=>{grade(x[0],false);v.i++;v.flipped=false;render();};
    document.getElementById('got').onclick=()=>{grade(x[0],true);v.i++;v.flipped=false;render();};
  }
}

function quizView(){
  const v=view,d=v.deck;
  if(v.i>=d.length) return doneScreen(`${v.score} of ${d.length} right`, v.c);
  const x=d[v.i];
  if(!v.opts){
    // Distractors must be excludable. Words inside one cluster share an axis and are
    // often near-synonyms, so distractors are drawn from OTHER clusters, minus a
    // blocklist of pairs that are confusable across cluster boundaries.
    const home = CLUSTER_OF[x[0]];
    const banned = new Set(CONFUSABLE[x[0]] || []);
    const pool = TAUGHT.filter(y => y.d && y.w!==x[0] && y.c!==home && !banned.has(y.w))
                       .map(y=>[y.w,y.d,y.n]);
    v.opts = shuffle([x, ...shuffle(pool).slice(0,3)]);
  }
  let h=`<button class="back lab" id="bk">← ${v.c?'Cluster':'Route'}</button>
    <div class="prog">${v.i+1} of ${d.length} · ${v.score} right</div>
    <p class="qp">${x[1]}</p><div class="opts">`;
  v.opts.forEach((o,i)=>{
    let cls='opt';
    if(v.picked!==null){ if(o[0]===x[0])cls+=' right'; else if(i===v.picked)cls+=' wrong'; }
    h+=`<button class="${cls}" data-i="${i}" ${v.picked!==null?'disabled':''}>${o[0]}</button>`;
  });
  h+='</div>';
  if(v.picked!==null){
    h+=`<div class="fb"><b>${x[0]}</b> — ${x[1]}${x[2]?`<br>${x[2]}`:''}</div>`;
    const wrong = v.opts.filter(o=>o[0]!==x[0]);
    h+=`<div class="why"><span class="lab whyh">The others</span>`;
    wrong.forEach(o=> h+=`<div class="wl"><b>${o[0]}</b> ${o[1]}</div>`);
    h+=`</div><div class="acts"><button class="btn pri" id="nx">Next</button></div>`;
  }
  app.innerHTML=h;
  document.getElementById('bk').onclick=()=>{view=v.c?{name:'cluster',c:v.c}:{name:'route'};render();};
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    v.picked=+b.dataset.i;
    const ok=v.opts[v.picked][0]===x[0];
    if(ok)v.score++; grade(x[0],ok); render();
  });
  const nx=document.getElementById('nx');
  if(nx) nx.onclick=()=>{v.i++;v.picked=null;v.opts=null;render();};
}

function reviewView(){
  const v=view;
  if(!v.deck){ v.deck=queue(40).map(t=>[t.w,t.d,t.n]); v.i=0; v.score=0; v.picked=null; v.c=null; }
  if(!v.deck.length) return doneScreen('Nothing due right now', null);
  if(v.i>=v.deck.length) return doneScreen(`${v.score} of ${v.deck.length} right`, null);
  quizView();
}
function shakyView(){
  const v=view;
  if(!v.deck || !v.deck.length){
    v.deck=interleave(TAUGHT.filter(x=>state(x.w)===SHAKY)).slice(0,30).map(t=>[t.w,t.d,t.n]);
    v.i=0; v.flipped=false; v.produce=true; v.c=null;
  }
  if(!v.deck.length) return doneScreen('No weak words right now', null);
  studyView();
}

function verbalView(){
  const v=view;
  const BANK=ALLQ();
  if(v.i>=BANK.length) return doneScreen(`${v.score} of ${BANK.length} right`, null);
  const q=BANK[v.i];
  const nBlanks = q.k==='tc' ? q.o.length : 1;
  if(!v.sel.length) v.sel = q.k==='se' ? [] : Array(nBlanks).fill(-1);
  const roman=['(i)','(ii)','(iii)'];
  let h=`<button class="back lab" id="bk">← Route</button>
    <div class="prog">Question ${v.i+1} of ${BANK.length} · ${q.k==='tc'?'Text Completion':'Sentence Equivalence'}${q.mine?' · yours':''} · ${v.score} right</div>
    <p class="qp">${q.t.replace(/___/g,'<span class="blank">______</span>')}</p>`;
  if(q.k==='se') h+=`<div class="hint lab" style="margin:-8px 0 12px">Choose the two that give the same meaning</div>`;
  q.o.forEach((set,bi)=>{
    if(q.k==='tc'&&q.o.length>1) h+=`<div class="blab lab">${roman[bi]}</div>`;
    h+='<div class="opts">';
    set.forEach((o,oi)=>{
      let cls='opt';
      if(v.done){
        const isAns = q.k==='se' ? q.a.includes(oi) : q.a[bi]===oi;
        const chose = q.k==='se' ? v.sel.includes(oi) : v.sel[bi]===oi;
        if(isAns) cls+=' right'; else if(chose) cls+=' wrong';
      } else {
        const chose = q.k==='se' ? v.sel.includes(oi) : v.sel[bi]===oi;
        if(chose) cls+=' picked';
      }
      h+=`<button class="${cls}" data-b="${bi}" data-o="${oi}" ${v.done?'disabled':''}>${o}</button>`;
    });
    h+='</div>';
  });
  if(!v.done){
    const ready = q.k==='se' ? v.sel.length===2 : v.sel.every(x=>x>=0);
    h+=`<div class="acts"><button class="btn pri" id="chk" ${ready?'':'disabled'}>Check</button></div>`;
  } else {
    h+=`<div class="fb">${q.e}</div><div class="acts"><button class="btn pri" id="nx">Next</button></div>`;
  }
  app.innerHTML=h;
  document.getElementById('bk').onclick=()=>{view={name:'route'};render();};
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const bi=+b.dataset.b, oi=+b.dataset.o;
    if(q.k==='se'){
      const k=v.sel.indexOf(oi);
      if(k>=0) v.sel.splice(k,1); else if(v.sel.length<2) v.sel.push(oi);
    } else v.sel[bi]=oi;
    render();
  });
  const chk=document.getElementById('chk');
  if(chk) chk.onclick=()=>{
    let ok;
    if(q.k==='se') ok = v.sel.length===2 && v.sel.slice().sort().join()===q.a.slice().sort().join();
    else ok = v.sel.every((x,i)=>x===q.a[i]);
    if(ok) v.score++;
    // grade every target word this item tested
    const targets = q.k==='se' ? q.a.map(i=>q.o[0][i]) : q.a.map((ai,bi)=>q.o[bi][ai]);
    targets.forEach(w=>{ if(CLUSTER_OF[w]!==undefined) grade(w, ok); });
    v.done=true; render();
  };
  const nx=document.getElementById('nx');
  if(nx) nx.onclick=()=>{v.i++;v.sel=[];v.done=false;render();};
}



/* ---------- lapse buckets ---------- */
function lapseBuckets(){
  const b={0:[],1:[],2:[],3:[]};                 // key 3 means three or more
  TAUGHT.forEach(x=>{
    const r=rec(x.w); if(!r) return;             // never reviewed, not counted
    const M = r.m!==undefined ? r.m : (r.L||0);   // older records only have L
    b[M>=3?3:M].push(x);
  });
  return b;
}
function drillBucket(min){
  const b=lapseBuckets();
  let list = min>=3 ? b[3] : b[min];
  list = interleave(list).slice(0,40).map(t=>[t.w,t.d,t.n]);
  if(!list.length){ alert('Nothing in that group yet.'); return; }
  view={name:'shaky', deck:list, i:0, flipped:false, produce:true, c:null};
  render();
}

/* ---------- full test: 27 questions, 41 minutes ---------- */
const TEST_N = 27, TEST_MIN = 41;
let tick = null;

function startTest(){
  const bank = ALLQ();
  if(bank.length < TEST_N){
    alert(`A full test needs ${TEST_N} questions and the bank holds ${bank.length}. `
        + `Add ${TEST_N-bank.length} more under Add questions, or use GRE questions to work through what is there.`);
    return;
  }
  // keep the real proportion: roughly a third Text Completion
  const tc = shuffle(bank.filter(q=>q.k==='tc'));
  const se = shuffle(bank.filter(q=>q.k==='se'));
  const wantTC = Math.min(tc.length, Math.round(TEST_N/3));
  const picked = shuffle(tc.slice(0,wantTC).concat(se.slice(0,TEST_N-wantTC)));
  const qs = picked.length===TEST_N ? picked : shuffle(bank).slice(0,TEST_N);
  view = {name:'test', qs, i:0, ans:qs.map(q=>q.k==='se'?[]:Array(q.o.length).fill(-1)),
          ends: now() + TEST_MIN*60000};
  clearInterval(tick);
  tick = setInterval(()=>{
    if(view.name!=='test'){ clearInterval(tick); return; }
    if(now() >= view.ends){ clearInterval(tick); submitTest(); return; }
    const el=document.getElementById('clock');
    if(el){ const L=left(); el.textContent=L.s; el.className='clock'+(L.ms<300000?' low':''); }
  }, 1000);
  render();
}
function left(){
  const ms = Math.max(0, view.ends - now());
  const m = Math.floor(ms/60000), sec = Math.floor(ms%60000/1000);
  return {ms, s: m+':'+String(sec).padStart(2,'0')};
}
function answered(i){
  const q=view.qs[i], a=view.ans[i];
  return q.k==='se' ? a.length===2 : a.every(x=>x>=0);
}

function testView(){
  const v=view, q=v.qs[v.i], a=v.ans[v.i];
  const roman=['(i)','(ii)','(iii)'];
  const done = v.ans.filter((_,i)=>answered(i)).length;
  let h=`<div class="tbar"><span class="clock" id="clock">${left().s}</span>
      <span class="tmeta">${done} of ${TEST_N} answered</span></div>
    <div class="prog">Question ${v.i+1} · ${q.k==='tc'?'Text Completion':'Sentence Equivalence'}${q.mine?' · yours':''}</div>
    <p class="qp">${q.t.replace(/___/g,'<span class="blank">______</span>')}</p>`;
  if(q.k==='se') h+=`<div class="hint lab" style="margin:-8px 0 12px">Choose the two that give the same meaning</div>`;
  q.o.forEach((set,bi)=>{
    if(q.k==='tc'&&q.o.length>1) h+=`<div class="blab lab">${roman[bi]}</div>`;
    h+='<div class="opts">';
    set.forEach((o,oi)=>{
      const chose = q.k==='se' ? a.includes(oi) : a[bi]===oi;
      h+=`<button class="opt${chose?' picked':''}" data-b="${bi}" data-o="${oi}">${o}</button>`;
    });
    h+='</div>';
  });
  h+=`<div class="acts">
      <button class="btn" id="prev" ${v.i?'':'disabled'}>Back</button>
      <button class="btn" id="next" ${v.i<TEST_N-1?'':'disabled'}>Next</button>
      <button class="btn pri" id="fin">Finish</button></div>`;
  h+=`<div class="nav">`;
  for(let i=0;i<TEST_N;i++)
    h+=`<button data-j="${i}" class="${answered(i)?'ans':''}${i===v.i?' here':''}">${i+1}</button>`;
  h+=`</div>`;
  app.innerHTML=h;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const bi=+b.dataset.b, oi=+b.dataset.o;
    if(q.k==='se'){ const k=a.indexOf(oi); if(k>=0) a.splice(k,1); else if(a.length<2) a.push(oi); }
    else a[bi]=oi;
    render();
  });
  document.getElementById('prev').onclick=()=>{v.i--;render();};
  document.getElementById('next').onclick=()=>{v.i++;render();};
  document.getElementById('fin').onclick=()=>{
    const un = TEST_N-done;
    if(un && !confirm(`${un} question${un>1?'s are':' is'} unanswered. Finish anyway?`)) return;
    submitTest();
  };
  app.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{v.i=+b.dataset.j;render();});
}

function correct(q, a){
  return q.k==='se'
    ? a.length===2 && a.slice().sort().join()===q.a.slice().sort().join()
    : a.every((x,i)=>x===q.a[i]);
}
function submitTest(){
  clearInterval(tick);
  const v=view, rows=[];
  let score=0;
  v.qs.forEach((q,i)=>{
    const ok = correct(q, v.ans[i]);
    if(ok) score++;
    // every target word the item tested goes into the scheduler
    const targets = q.k==='se' ? q.a.map(x=>q.o[0][x]) : q.a.map((ai,bi)=>q.o[bi][ai]);
    targets.forEach(w=>{ if(CLUSTER_OF[w]!==undefined) grade(w, ok); });
    rows.push({q, a:v.ans[i], ok});
  });
  const used = TEST_MIN*60000 - Math.max(0, v.ends-now());
  view = {name:'tresult', rows, score, mins: Math.round(used/60000)};
  render();
}

function tresultView(){
  const v=view, pct=Math.round(100*v.score/TEST_N);
  const tcRows=v.rows.filter(r=>r.q.k==='tc'), seRows=v.rows.filter(r=>r.q.k==='se');
  const sub=rs=>rs.length?`${rs.filter(r=>r.ok).length} of ${rs.length}`:'—';
  let h=`<h2 class="ct">Test complete</h2>
    <div class="big">${v.score}<span style="font-size:24px;color:var(--ink2)"> / ${TEST_N}</span></div>
    <p class="cax">${pct}% · finished in ${v.mins} of ${TEST_MIN} minutes</p>
    <div class="wlist">
      <div class="wrow"><span class="dot" style="background:transparent"></span>
        <span><span class="wd">Text Completion — ${sub(tcRows)}</span>
        <span class="wdef">all blanks must be right for the question to count</span></span></div>
      <div class="wrow"><span class="dot" style="background:transparent"></span>
        <span><span class="wd">Sentence Equivalence — ${sub(seRows)}</span>
        <span class="wdef">both answers must be right; there is no half credit</span></span></div>
    </div>
    <div class="acts" style="margin-top:18px">
      <button class="btn pri" id="home">Route</button>
      <button class="btn" id="again">Another test</button></div>
    <div class="bandhead lab" style="margin-top:26px">Every question</div>`;
  v.rows.forEach((r,i)=>{
    const q=r.q, yours = q.k==='se'
      ? (r.a.length ? r.a.map(x=>q.o[0][x]).join(' + ') : 'not answered')
      : (r.a.every(x=>x>=0) ? r.a.map((x,b)=>q.o[b][x]).join(' · ') : 'not answered');
    const right = q.k==='se' ? q.a.map(x=>q.o[0][x]).join(' + ') : q.a.map((x,b)=>q.o[b][x]).join(' · ');
    h+=`<div class="rev">
      <div class="rq">${i+1}. ${q.t.replace(/___/g,'______')}</div>
      <div class="ra ${r.ok?'good':'bad'}">Your answer: ${yours}</div>
      ${r.ok?'':`<div class="ra good">Correct: ${right}</div>`}
      <div class="re">${q.e}</div></div>`;
  });
  app.innerHTML=h;
  document.getElementById('home').onclick=()=>{view={name:'route'};render();};
  document.getElementById('again').onclick=startTest;
  save();
}

/* ---------- question editor ---------- */
const SPEC = {                                   // real GRE shapes
  tc1:{blanks:1, per:5, label:'Text Completion — one blank'},
  tc2:{blanks:2, per:3, label:'Text Completion — two blanks'},
  tc3:{blanks:3, per:3, label:'Text Completion — three blanks'},
  se: {blanks:1, per:6, label:'Sentence Equivalence'}
};
function editorView(){
  const v=view, sp=SPEC[v.kind||'se'];
  const nB=sp.blanks, per=sp.per, isSE=(v.kind||'se')==='se';
  if(!v.mark || v.mark.length!==nB) v.mark = Array(nB).fill(null).map(()=>isSE?[]:-1);
  const roman=['(i)','(ii)','(iii)'];
  let h=`<button class="back lab" id="bk">← Route</button>
    <h2 class="ct">Add a question</h2>
    <p class="cax">Questions you add join the bank and are stored in this browser. They travel with Export progress.</p>
    <div class="seg">`;
  Object.entries(SPEC).forEach(([k,o])=>
    h+=`<button data-k="${k}" class="${(v.kind||'se')===k?'on':''}">${o.label}</button>`);
  h+=`</div>`;
  if(v.err) h+=`<div class="err">${v.err}</div>`;
  h+=`<label class="field"><span>Sentence — type ___ where each blank goes</span>
      <textarea id="sent" placeholder="The report was ___: forty pages restating what the board had said.">${v.sent||''}</textarea></label>`;
  for(let b=0;b<nB;b++){
    h+=`<div class="blab lab">${nB>1?roman[b]+' options':'Options'} — tap the ${isSE?'two that match':'correct one'}</div>`;
    for(let i=0;i<per;i++){
      const on = isSE ? v.mark[0].includes(i) : v.mark[b]===i;
      h+=`<div class="orow">
        <button class="mark ${on?'on':''}" data-b="${b}" data-i="${i}">${on?'✓':String.fromCharCode(65+i)}</button>
        <input id="o${b}_${i}" value="${(v.opts&&v.opts[b]&&v.opts[b][i])||''}" placeholder="word">
      </div>`;
    }
  }
  h+=`<label class="field" style="margin-top:14px"><span>Explanation — shown after answering</span>
      <textarea id="expl" placeholder="Why the answer is right, and why each other option fails.">${v.expl||''}</textarea></label>
    <div class="acts"><button class="btn pri" id="saveQ">Save question</button>
      <button class="btn" id="bulk">Paste several</button></div>`;
  if(MYQ.length){
    h+=`<div class="bandhead lab" style="margin-top:26px">Your questions — ${MYQ.length}</div><div class="wlist">`;
    MYQ.forEach((q,i)=> h+=`<div class="wrow"><span class="dot" style="background:var(--route)"></span>
      <span><span class="wd">${q.t.slice(0,72)}${q.t.length>72?'…':''}</span>
        <span class="wdef">${q.k==='se'?'Sentence Equivalence':'Text Completion, '+q.o.length+' blank'+(q.o.length>1?'s':'')}</span>
        <span class="wnote"><button class="del" data-del="${i}">Delete</button></span></span></div>`);
    h+=`</div>`;
  }
  app.innerHTML=h;

  const readFields=()=>{
    v.sent=document.getElementById('sent').value;
    v.expl=document.getElementById('expl').value;
    v.opts=[]; for(let b=0;b<nB;b++){ v.opts[b]=[]; for(let i=0;i<per;i++) v.opts[b][i]=document.getElementById(`o${b}_${i}`).value; }
  };
  document.getElementById('bk').onclick=()=>{view={name:'route'};render();};
  app.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
    readFields(); v.kind=b.dataset.k; v.mark=null; v.err=''; render(); });
  app.querySelectorAll('.mark').forEach(b=>b.onclick=()=>{
    readFields();
    const bi=+b.dataset.b, i=+b.dataset.i;
    if(isSE){ const k=v.mark[0].indexOf(i); if(k>=0) v.mark[0].splice(k,1); else if(v.mark[0].length<2) v.mark[0].push(i); }
    else v.mark[bi]=i;
    v.err=''; render();
  });
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(!confirm('Delete this question?')) return;
    MYQ.splice(+b.dataset.del,1); saveQ(); render();
  });
  document.getElementById('bulk').onclick=()=>{ view={name:'editor', kind:v.kind, bulkMode:true, mark:null, err:''}; bulkView(); };
  document.getElementById('saveQ').onclick=()=>{
    readFields();
    const blanksInText=(v.sent.match(/___/g)||[]).length;
    if(!v.sent.trim()) return fail('Write the sentence first.');
    if(blanksInText!==nB) return fail(`This type needs exactly ${nB} blank${nB>1?'s':''} — type ___ ${nB} time${nB>1?'s':''}. Found ${blanksInText}.`);
    for(let b=0;b<nB;b++) for(let i=0;i<per;i++)
      if(!v.opts[b][i].trim()) return fail('Fill in every option box.');
    if(isSE && v.mark[0].length!==2) return fail('Mark exactly two matching answers.');
    if(!isSE && v.mark.some(x=>x<0)) return fail('Mark the correct option for every blank.');
    if(!v.expl.trim()) return fail('Add an explanation — it is what you read when you get it wrong.');
    const q = isSE
      ? {k:'se', t:v.sent.trim(), o:[v.opts[0].map(x=>x.trim())], a:v.mark[0].slice().sort((x,y)=>x-y), e:v.expl.trim(), mine:1}
      : {k:'tc', t:v.sent.trim(), o:v.opts.map(g=>g.map(x=>x.trim())), a:v.mark.slice(), e:v.expl.trim(), mine:1};
    MYQ.push(q); saveQ();
    view={name:'editor', kind:v.kind, mark:null, err:'', saved:true}; render();
  };
  function fail(m){ v.err=m; render(); }
}

function bulkView(){
  const v=view;
  app.innerHTML=`<button class="back lab" id="bk">← Add a question</button>
    <h2 class="ct">Paste several</h2>
    <p class="cax">One question per block, blank line between blocks. Mark each correct option with a star.</p>
    <div class="note">SE<br>The report was ___ and added nothing.<br>*vacuous<br>*empty<br>prosaic<br>humdrum<br>evasive<br>terse<br>= vacuous and empty both mean without content.<br><br>TC<br>She was ___ about the outcome.<br>*sanguine<br>bereft<br>wary<br>curt<br>bleak<br>= sanguine means optimistic.</div>
    ${v.err?`<div class="err">${v.err}</div>`:''}
    <label class="field"><textarea id="blk" style="min-height:220px" placeholder="Paste here"></textarea></label>
    <div class="acts"><button class="btn pri" id="go">Add them</button></div>`;
  document.getElementById('bk').onclick=()=>{view={name:'editor',kind:v.kind,mark:null,err:''};render();};
  document.getElementById('go').onclick=()=>{
    const blocks=document.getElementById('blk').value.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
    let added=0, bad=[];
    blocks.forEach((blk,bi)=>{
      const lines=blk.split('\n').map(x=>x.trim()).filter(Boolean);
      const kind=(lines[0]||'').toLowerCase();
      if(kind!=='se'&&kind!=='tc'){ bad.push(bi+1); return; }
      const sent=lines[1]||'';
      const expl=(lines.find(l=>l.startsWith('='))||'').replace(/^=\s*/,'');
      const opts=lines.slice(2).filter(l=>!l.startsWith('='));
      const marks=[], clean=[];
      opts.forEach((o,i)=>{ if(o.startsWith('*')){ marks.push(i); clean.push(o.slice(1).trim()); } else clean.push(o.trim()); });
      const nb=(sent.match(/___/g)||[]).length;
      if(!sent||!clean.length||!expl||!marks.length||nb<1){ bad.push(bi+1); return; }
      if(kind==='se'){ if(marks.length!==2||nb!==1){ bad.push(bi+1); return; }
        MYQ.push({k:'se',t:sent,o:[clean],a:marks,e:expl,mine:1}); }
      else { if(marks.length!==nb){ bad.push(bi+1); return; }
        const per=clean.length/nb;
        if(!Number.isInteger(per)){ bad.push(bi+1); return; }
        const groups=[], ans=[];
        for(let b=0;b<nb;b++){ groups.push(clean.slice(b*per,(b+1)*per));
          const m=marks.find(x=>x>=b*per&&x<(b+1)*per); if(m===undefined){bad.push(bi+1);return;} ans.push(m-b*per); }
        MYQ.push({k:'tc',t:sent,o:groups,a:ans,e:expl,mine:1}); }
      added++;
    });
    saveQ();
    view={name:'editor',kind:v.kind,mark:null,
      err: bad.length ? `Added ${added}. Blocks ${bad.join(', ')} were skipped — check the format.` : ''};
    render();
  };
}

function statsView(){
  const t = tally(TAUGHT);
  const total = TAUGHT.length;
  const seen = LOG.length;
  const last100 = LOG.slice(-100);
  const acc = last100.length ? Math.round(100*last100.filter(x=>x.ok).length/last100.length) : null;
  const today = LOG.filter(x => x.t > now()-DAY).length;
  // words missed most often in the log
  const miss = {};
  LOG.forEach(x => { if(!x.ok) miss[x.w]=(miss[x.w]||0)+1; });
  const worst = Object.entries(miss).sort((a,b)=>b[1]-a[1]).slice(0,12);
  const pct = n => total ? Math.round(100*n/total) : 0;

  let h = `<button class="back lab" id="bk">← Route</button>
    <h2 class="ct">Progress</h2>
    <p class="cax">Every answer you give — flashcard, quiz or GRE question — moves the word through these four states.</p>
    <div class="wlist">
      <div class="wrow"><span class="dot" style="background:var(--solid)"></span>
        <span><span class="wd">Holding — ${t.known}</span><span class="wdef">${pct(t.known)}% · ${REPS} correct reviews on separate days, at most one miss</span></span></div>
      <div class="wrow"><span class="dot" style="background:var(--learn)"></span>
        <span><span class="wd">Coming along — ${t.learning}</span><span class="wdef">${pct(t.learning)}% · seen and holding, but not yet stable</span></span></div>
      <div class="wrow"><span class="dot" style="background:var(--weak)"></span>
        <span><span class="wd">Forgetting often — ${t.shaky}</span><span class="wdef">${pct(t.shaky)}% · three or more lapses, or high difficulty</span></span></div>
      <div class="wrow"><span class="dot" style="background:var(--paper2);border:1px solid var(--contour)"></span>
        <span><span class="wd">Not started — ${t.new}</span><span class="wdef">${pct(t.new)}% · no review yet</span></span></div>
    </div>
    <div class="acts" style="margin:14px 0 0">
      <button class="btn" id="repsDown">−</button>
      <button class="btn" disabled style="opacity:1">Held after ${REPS} clean reviews</button>
      <button class="btn" id="repsUp">+</button>
    </div>
    <div class="note" style="margin:8px 0 0">Only reviews on different study days count — a study day runs from 4am to 4am in your own timezone, so a late session still belongs to the evening it started.  Four to six is what the evidence supports for a month of preparation; past that you are spending time on words that are already safe.</div>
    <div class="bandhead lab" style="margin-top:22px">How often each word has been missed</div>
    <div class="note" style="margin:0 0 10px">Counted only for words you have reviewed at least once. Every wrong answer counts, including the first time you meet a word.</div>
    <div class="wlist" id="buckets"></div>
    <div class="acts" style="margin:12px 0 0">
      <button class="btn pri" id="d3">Drill the 3+ group</button>
      <button class="btn" id="d2">Drill the 2-lapse group</button>
    </div>
    <div class="bandhead lab" style="margin-top:22px">Days</div>
    <div class="wlist">
      <div class="wrow"><span class="dot" style="background:var(--route)"></span>
        <span><span class="wd">${streaks().total} days studied</span>
        <span class="wdef">counted from 4am to 4am in your own timezone</span></span></div>
      <div class="wrow"><span class="dot" style="background:${streaks().current?'var(--solid)':'var(--paper2)'};${streaks().current?'':'border:1px solid var(--contour)'}"></span>
        <span><span class="wd">${streaks().current} day${streaks().current===1?'':'s'} in a row</span>
        <span class="wdef">${streaks().current ? 'keep it going' : 'a gap of two days resets this'}</span></span></div>
      <div class="wrow"><span class="dot" style="background:transparent"></span>
        <span><span class="wd">${streaks().best} is the longest run</span>
        <span class="wdef">spacing beats volume, so an unbroken run matters more than a long session</span></span></div>
    </div>
    <div class="bandhead lab" style="margin-top:22px">Answering</div>
    <div class="wlist">
      <div class="wrow"><span class="dot" style="background:transparent"></span><span><span class="wd">${seen} answers recorded</span><span class="wdef">${today} in the last 24 hours</span></span></div>
      <div class="wrow"><span class="dot" style="background:transparent"></span><span><span class="wd">${acc===null?'—':acc+'% on the last '+last100.length}</span><span class="wdef">rolling accuracy across every mode</span></span></div>
      <div class="wrow"><span class="dot" style="background:transparent"></span><span><span class="wd">${queue().length} due now</span><span class="wdef">past their scheduled interval</span></span></div>
    </div>`;
  if(worst.length){
    h += `<div class="bandhead lab" style="margin-top:22px">Missed most often</div><div class="wlist">`;
    worst.forEach(([w,n])=>{
      const e = TAUGHT.find(x=>x.w===w);
      h += `<div class="wrow"><span class="dot" style="background:${COLOUR[state(w)]}"></span>
        <span><span class="wd">${w}</span><span class="wdef">${e?e.d:''}</span>
        <span class="wnote">missed ${n} ${n===1?'time':'times'}</span></span></div>`;
    });
    h += `</div>`;
  }
  h += `<div class="acts" style="margin-top:20px"><button class="btn pri" id="home">Route</button></div>`;
  app.innerHTML=h;

  const B=lapseBuckets();
  const reviewed = B[0].length+B[1].length+B[2].length+B[3].length;
  const rows=[
    ['Never missed', B[0].length, 'var(--solid)', 'right on every attempt so far'],
    ['Missed once',  B[1].length, 'var(--learn)', 'one wrong answer; the schedule has already pulled it closer'],
    ['Missed twice', B[2].length, '#C08A3E',      'on the edge — one more and it becomes a problem word'],
    ['Missed 3 or more times', B[3].length, 'var(--weak)', 'repetition alone will not fix these. Change the encoding instead: recall direction, the etymology hook, and the neighbour it keeps being confused with']
  ];
  const bx=document.getElementById('buckets');
  bx.innerHTML = rows.map(([label,n,col,note])=>{
    const pc = reviewed ? Math.round(100*n/reviewed) : 0;
    return `<div class="wrow"><span class="dot" style="background:${col}"></span>
      <span><span class="wd">${label} — ${n}</span>
      <span class="wdef">${pc}% of the ${reviewed} words you have reviewed</span>
      <span class="wnote">${note}</span></span></div>`;
  }).join('');

  document.getElementById('repsUp').onclick=()=>{ REPS=Math.min(12,REPS+1); saveReps(); render(); };
  document.getElementById('repsDown').onclick=()=>{ REPS=Math.max(2,REPS-1); saveReps(); render(); };
  document.getElementById('d3').onclick=()=>drillBucket(3);
  // the buckets are rebuilt on every render, so they are always current
  document.getElementById('d2').onclick=()=>drillBucket(2);
  document.getElementById('bk').onclick=()=>{view={name:'route'};render();};
  document.getElementById('home').onclick=()=>{view={name:'route'};render();};
}

function doneScreen(msg,c){
  const t=tally(TAUGHT);
  app.innerHTML=`<h2 class="ct">${msg}</h2>
    <p class="cax">Words you missed come back within a day. Words you knew stretch further out each time.</p>
    <div class="legend lab" style="margin-bottom:20px">
      <span><i style="background:var(--solid)"></i>holding ${t.known}</span>
      <span><i style="background:var(--learn)"></i>coming along ${t.learning}</span>
      <span><i style="background:var(--weak)"></i>forgetting often ${t.shaky}</span>
    </div>
    <div class="acts">${c?`<button class="btn" id="again2">Back to cluster</button>`:''}
      <button class="btn pri" id="home">Route</button></div>`;
  const a=document.getElementById('again2');
  if(a) a.onclick=()=>{view={name:'cluster',c};render();};
  document.getElementById('home').onclick=()=>{view={name:'route'};render();};
  save();
}

function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[b[i],b[j]]=[b[j],b[i]];}return b;}

document.getElementById('themeBtn').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':cur==='light'?'dark':(matchMedia('(prefers-color-scheme:dark)').matches?'light':'dark');
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem('ascent-theme',next)}catch(e){}
};
try{const t=localStorage.getItem('ascent-theme'); if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
document.getElementById('resetBtn').onclick=()=>{
  if(!confirm('Clear all progress? Export first if you want a copy.'))return;
  P={};dirty=true;save();render();
};
document.getElementById('expBtn').onclick=exportProgress;
document.getElementById('impBtn').onclick=()=>document.getElementById('impFile').click();
document.getElementById('impFile').onchange=e=>{ if(e.target.files[0]) importProgress(e.target.files[0]); };

render(); loadReps(); loadQ(); load();
</script>
